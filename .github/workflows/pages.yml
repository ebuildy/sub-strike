# GitHub Pages: publish the game (www/) and the screenshots (docs/, used by the share preview)
# Transition: Pages still serves the root index.html from main, so this only runs by hand.
# To switch: `gh api -X PUT repos/ebuildy/sub-strike/pages -f build_type=workflow`, add `push: branches: [main]`
# below, then delete the root index.html.
name: pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && cp -r www/. _site/ && cp -r docs _site/docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
