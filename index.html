<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Battle Beneath the Sea</title>
<style>
  html, body { margin: 0; height: 100%; background: #021428; display: flex; align-items: center; justify-content: center; }
  /* Sky + water gradient lives in CSS (drawn by the GPU for free); the canvas is transparent on top.
     Sky ends at y=74/450 (16.4%), water goes from #3fb6e0 to #062a4f. */
  canvas { background: linear-gradient(to bottom, #6ec6ff 0%, #d8f3ff 16.4%, #3fb6e0 16.45%, #0f6aa0 49.8%, #062a4f 100%); border: 3px solid #e6c88a; border-radius: 8px; width: min(96vw, calc(94vh * 16 / 9)); height: auto; }
</style>
</head>
<body>
<canvas id="c" width="1600" height="900"></canvas>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const SCALE = 2; // render at 2x for crisp graphics
const W = cv.width / SCALE, H = cv.height / SCALE;
const SURFACE = 70; // y of the sea surface
const keys = {};

// ---------- Audio ----------
// Everything goes through master -> compressor (loud explosions don't clip). Effects also feed a
// dark generated reverb, which gives the underwater echo, and are panned by their screen x.
let ac = null, master = null, verb = null, noiseBuf = null, musicStep = 0, musicTimer = 0;
function initAudio() {
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.25;
  master = ac.createGain(); master.gain.value = 0.9; master.connect(comp).connect(ac.destination);
  verb = ac.createConvolver(); verb.buffer = reverbIR(2.2);
  const vg = ac.createGain(); vg.gain.value = 0.5; verb.connect(vg).connect(master);
}
function reverbIR(sec) { // decaying low-passed noise: a murky underwater tail
  const n = ac.sampleRate * sec | 0, b = ac.createBuffer(2, n, ac.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = b.getChannelData(c); let y = 0;
    for (let i = 0; i < n; i++) { y += 0.18 * (Math.random() * 2 - 1 - y); d[i] = y * Math.pow(1 - i / n, 2.5) * 2.5; }
  }
  return b;
}
function noiseBuffer() { // built once, reused by every noise
  if (!noiseBuf) {
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return noiseBuf;
}
function tone(freq, dur, type = 'square', vol = 0.15, slideTo = null) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur);
  o.onended = () => { o.disconnect(); g.disconnect(); };
}
function noise(dur, vol = 0.2) {
  if (!ac) return;
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), t = ac.currentTime;
  f.type = 'lowpass'; f.frequency.value = 900;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.buffer = noiseBuffer(); s.connect(f).connect(g).connect(master); s.start(t); s.stop(t + dur);
  s.onended = () => { s.disconnect(); f.disconnect(); g.disconnect(); };
}
// Output for one effect: panned by screen x, with a share (wet) sent to the reverb
function sfxOut(x, wet, life) {
  const g = ac.createGain(), send = ac.createGain(); send.gain.value = wet;
  let last = g;
  if (x != null && ac.createStereoPanner) {
    const p = ac.createStereoPanner(); p.pan.value = Math.max(-0.8, Math.min(0.8, x / W * 1.6 - 0.8));
    g.connect(p); last = p;
  }
  last.connect(master); last.connect(send).connect(verb);
  setTimeout(() => { g.disconnect(); last.disconnect(); send.disconnect(); }, life * 1000 + 300);
  return g;
}
function nz(out, t, dur, vol, type, f0, f1, q = 0.7, att = 0.004) { // filtered noise burst, filter sweeps f0 -> f1
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuffer(); s.loop = true;
  f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + att); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(g).connect(out); s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.05);
  s.onended = () => { s.disconnect(); f.disconnect(); g.disconnect(); };
}
function os(out, t, dur, type, f0, f1, vol, att = 0.004) { // oscillator with a pitch slide
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + att); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(out); o.start(t); o.stop(t + dur + 0.05);
  o.onended = () => { o.disconnect(); g.disconnect(); };
}
function bubbles(out, t, n, spread, vol) { // each bubble is a tiny upward chirp
  for (let i = 0; i < n; i++) { const f = rnd(300, 900); os(out, t + Math.random() * spread, rnd(0.03, 0.06), 'sine', f, f * rnd(2, 3), vol * rnd(0.5, 1), 0.002); }
}
function crackle(out, t, dur, n, vol, k = 1) { // rocket exhaust crackle: many tiny noise pops
  for (let i = 0; i < n; i++) { const f = rnd(1500, 5000) * k; nz(out, t + Math.random() * dur * (0.4 + 0.6 * Math.random()), rnd(0.008, 0.025), vol * rnd(0.4, 1), 'bandpass', f, f * 0.7, 1.5, 0.001); }
}
const sfx = {
  shoot(x) { // torpedo tube: water-ram thump, air whoosh, bubbles, then the motor spins up
    if (!ac) return; const t = ac.currentTime, o = sfxOut(x, 0.35, 1.2);
    os(o, t, 0.2, 'sine', 95, 40, 0.4);
    nz(o, t, 0.5, 0.28, 'bandpass', 1400, 250, 0.8, 0.01);
    bubbles(o, t + 0.05, 7, 0.45, 0.06);
    os(o, t + 0.15, 0.8, 'triangle', 500, 1150, 0.035, 0.12);
  },
  boom(x, y) { // underwater: shock, deep thump, bubble-pulse second kick, fizz. In the air: crack and rumble
    if (!ac) return; const t = ac.currentTime, sea = y == null || y > SURFACE, o = sfxOut(x, sea ? 0.6 : 0.35, 2.5);
    if (sea) {
      nz(o, t, 0.9, 0.5, 'lowpass', 3500, 150, 0.7, 0.003);
      os(o, t, 0.8, 'sine', 80, 28, 0.6, 0.003);
      os(o, t + 0.22, 0.5, 'sine', 55, 24, 0.3, 0.01);
      nz(o, t + 0.22, 0.5, 0.18, 'lowpass', 600, 100);
      nz(o, t + 0.3, 1.3, 0.04, 'bandpass', 2200, 1200, 1.5, 0.15);
      bubbles(o, t + 0.3, 8, 0.9, 0.04);
    } else {
      nz(o, t, 0.1, 0.5, 'highpass', 1800, 900, 0.7, 0.002);
      nz(o, t, 1.2, 0.45, 'lowpass', 2800, 120);
      os(o, t, 1.0, 'sine', 65, 30, 0.45);
      nz(o, t + 0.1, 0.8, 0.08, 'bandpass', 3000, 2000, 2, 0.05);
    }
  },
  pop(x, y) { // small explosion
    if (!ac) return; const t = ac.currentTime, o = sfxOut(x, 0.4, 1);
    nz(o, t, 0.3, 0.25, 'lowpass', 2200, 200, 0.7, 0.003);
    os(o, t, 0.22, 'sine', 140, 50, 0.22);
    if (y == null || y > SURFACE) bubbles(o, t + 0.05, 4, 0.3, 0.04);
  },
  bubbles(x) { // bubble screen: compressed air blasts out of the hull, then a long fizz of rising bubbles
    if (!ac) return; const t = ac.currentTime, o = sfxOut(x, 0.6, 2.5);
    nz(o, t, 0.5, 0.4, 'lowpass', 1800, 180, 0.7, 0.005);
    os(o, t, 0.4, 'sine', 90, 35, 0.4);
    nz(o, t + 0.05, 1.6, 0.08, 'bandpass', 900, 2600, 1.2, 0.1);
    bubbles(o, t + 0.05, 45, 1.6, 0.05);
  },
  launch(x) { // H-bomb ejected from the tube by a gas generator: hard thump, gas blast, hiss, bubbles
    if (!ac) return; const t = ac.currentTime, o = sfxOut(x, 0.5, 2);
    os(o, t, 0.5, 'sine', 90, 28, 0.6, 0.002);
    nz(o, t, 0.08, 0.4, 'lowpass', 2500, 600, 0.7, 0.001);
    nz(o, t, 0.8, 0.32, 'lowpass', 1200, 150, 0.7, 0.01);
    nz(o, t + 0.02, 0.35, 0.12, 'highpass', 3000, 1500, 0.7, 0.01);
    bubbles(o, t + 0.05, 18, 0.9, 0.06);
  },
  motor(x, under) { // rocket motor lights: ignition crack, then a roaring, crackling burn (muffled under water)
    if (!ac) return; const t = ac.currentTime, o = sfxOut(x, under ? 0.6 : 0.3, 3), k = under ? 0.35 : 1;
    nz(o, t, 0.06, 0.45, 'highpass', 4000 * k, 1500 * k, 0.7, 0.001);
    nz(o, t, 2.4, 0.42, 'lowpass', 3000 * k, 500 * k, 0.6, 0.03);
    nz(o, t, 2.2, 0.14, 'bandpass', 1800 * k, 700 * k, 0.9, 0.05);
    os(o, t, 2.0, 'sawtooth', 55, 95, 0.05, 0.08);
    crackle(o, t + 0.05, 1.8, under ? 18 : 40, under ? 0.06 : 0.12, k);
    if (under) bubbles(o, t, 26, 1.8, 0.05);
  },
  ignite(x) { // rocket motor lights as it leaves the water, then roars away
    if (!ac) return; const t = ac.currentTime, o = sfxOut(x, 0.3, 2.5);
    crackle(o, t + 0.05, 1.6, 30, 0.1);
    nz(o, t, 0.25, 0.4, 'lowpass', 5000, 1500, 0.7, 0.003);
    nz(o, t, 2.2, 0.38, 'lowpass', 3500, 500, 0.6, 0.06);
    nz(o, t, 2.0, 0.12, 'bandpass', 2500, 900, 0.8, 0.05);
    os(o, t, 1.8, 'sawtooth', 70, 45, 0.05, 0.05);
  },
  mega(x, y) { // H-bomb: crack, huge rumble, rolling thunder, the sea boiling
    if (!ac) return; const t = ac.currentTime, o = sfxOut(x, 0.7, 4.5);
    nz(o, t, 0.15, 0.6, 'highpass', 2000, 800, 0.7, 0.002);
    nz(o, t, 3.2, 0.7, 'lowpass', 1600, 60, 0.7, 0.01);
    os(o, t, 2.8, 'sine', 50, 18, 0.7, 0.01);
    os(o, t, 2.0, 'triangle', 90, 30, 0.25);
    nz(o, t + 0.35, 3, 0.35, 'lowpass', 400, 70, 1, 0.4);
    nz(o, t + 0.6, 2.5, 0.06, 'bandpass', 2500, 1000, 1.5, 0.3);
  },
  impact(x, y) { // torpedo hits a hull: blast plus inharmonic metal ring
    if (!ac) return; const t = ac.currentTime, o = sfxOut(x, 0.5, 1.5);
    nz(o, t, 0.45, 0.35, 'lowpass', 3000, 250, 0.7, 0.003);
    os(o, t, 0.35, 'sine', 190, 55, 0.35);
    for (const f of [430, 1170, 1890]) os(o, t, 0.7, 'sine', f, f * 0.97, 0.05, 0.002);
  },
  sam(x) { // Rampart air/air missile: sharp crack, then a short hissing whoosh
    if (!ac) return; const t = ac.currentTime, o = sfxOut(x, 0.3, 1.5);
    nz(o, t, 0.06, 0.35, 'highpass', 3000, 1500, 0.7, 0.001);
    nz(o, t, 1.0, 0.22, 'bandpass', 4000, 1200, 0.9, 0.02);
    os(o, t, 0.3, 'sine', 120, 50, 0.2);
  },
  droneOut(x) { // drone thrown out of a Rampart module: pneumatic thump, then its rotors spin up
    if (!ac) return; const t = ac.currentTime, o = sfxOut(x, 0.25, 1.5);
    nz(o, t, 0.25, 0.3, 'lowpass', 1500, 200, 0.7, 0.003);
    os(o, t + 0.1, 0.9, 'sawtooth', 120, 420, 0.04, 0.2);
  },
  die(x) { // our hull groans after the hit
    if (!ac) return; const t = ac.currentTime, o = sfxOut(x, 0.5, 2);
    os(o, t, 1.1, 'sawtooth', 85, 38, 0.07, 0.05);
    os(o, t + 0.1, 0.9, 'triangle', 300, 180, 0.05, 0.05);
  },
  shock(x) { // electric eel: crackling discharge, mains hum, then the weapons power down
    if (!ac) return; const t = ac.currentTime, o = sfxOut(x, 0.3, 1.8);
    nz(o, t, 0.6, 0.35, 'highpass', 3000, 1500, 0.7, 0.002);
    os(o, t, 0.5, 'sawtooth', 60, 55, 0.12);
    os(o, t, 0.4, 'square', 120, 118, 0.05);
    os(o, t + 0.3, 0.9, 'sawtooth', 600, 40, 0.06, 0.02);
  },
  surface(x) { // blowing the ballast tanks: air roar, then water pouring off the deck
    if (!ac) return; const t = ac.currentTime, o = sfxOut(x, 0.3, 2.5);
    nz(o, t, 1.0, 0.22, 'lowpass', 1500, 300, 0.7, 0.05);
    nz(o, t + 0.3, 1.4, 0.08, 'bandpass', 2500, 1200, 0.8, 0.2);
    bubbles(o, t, 10, 0.6, 0.05);
  },
  dive(x) { // vents open: hiss and gurgle
    if (!ac) return; const t = ac.currentTime, o = sfxOut(x, 0.4, 2);
    nz(o, t, 0.8, 0.12, 'highpass', 4000, 2000, 0.7, 0.02);
    bubbles(o, t + 0.2, 12, 0.8, 0.05);
  },
  raise(x) { // CIWS mount rises: hydraulic hiss, servo whine, then it locks
    if (!ac) return; const t = ac.currentTime, o = sfxOut(x, 0.2, 1.5);
    nz(o, t, 0.6, 0.06, 'highpass', 3500, 2500, 0.7, 0.02);
    os(o, t, 0.6, 'sawtooth', 220, 440, 0.025, 0.05);
    os(o, t + 0.62, 0.08, 'square', 120, 80, 0.06);
  },
  denied: () => tone(110, 0.1, 'square', 0.06), // trigger pressed while the weapons are down
  hit: () => tone(300, 0.08, 'square', 0.08, 200),
  coin: () => { tone(988, 0.08, 'square', 0.08); setTimeout(() => tone(1319, 0.25, 'square', 0.08), 80); },
  win: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.2, 'square', 0.12), i * 150)),
  power: () => [660, 880, 1320].forEach((f, i) => setTimeout(() => tone(f, 0.12, 'square', 0.1), i * 80)),
  lose: () => [392, 330, 262, 196].forEach((f, i) => setTimeout(() => tone(f, 0.3, 'triangle', 0.2), i * 220)),
};
// Laser hum: a buzzing sawtooth chopped by a fast LFO, running while L is held
let laserSnd = null;
function laserSound(on) {
  if (!ac || on === !!laserSnd) return;
  if (on) {
    const o = ac.createOscillator(), o2 = ac.createOscillator(), lfo = ac.createOscillator(), lg = ac.createGain(), g = ac.createGain();
    o.type = 'sawtooth'; o.frequency.value = 110; o2.type = 'square'; o2.frequency.value = 1760;
    lfo.type = 'square'; lfo.frequency.value = 33; lg.gain.value = 0.04; g.gain.value = 0.05;
    lfo.connect(lg).connect(g.gain); o.connect(g); o2.connect(g); g.connect(master);
    o.start(); o2.start(); lfo.start(); laserSnd = { o, o2, lfo, lg, g };
  } else {
    const n = laserSnd, t = ac.currentTime; laserSnd = null;
    n.g.gain.cancelScheduledValues(t); n.g.gain.setValueAtTime(0.05, t); n.g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
    for (const k of ['o', 'o2', 'lfo']) { n[k].stop(t + 0.1); }
    n.o.onended = () => { for (const k in n) n[k].disconnect(); };
  }
}
// CIWS: a gatling firing 75 rounds/s. Noise chopped by a sawtooth LFO (a sharp crack per round, then it fades),
// plus a buzzing sawtooth body at the same rate. The barrels spin up when it starts and whine down when it stops
let ciwsSnd = null;
function ciwsSound(on) {
  if (!ac || on === !!ciwsSnd) return;
  const t = ac.currentTime;
  if (on) {
    const n = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), lfo = ac.createOscillator(), lg = ac.createGain();
    const o = ac.createOscillator(), of = ac.createBiquadFilter(), og = ac.createGain(), out = ac.createGain(), send = ac.createGain();
    n.buffer = noiseBuffer(); n.loop = true; f.type = 'bandpass'; f.frequency.value = 3200; f.Q.value = 0.6;
    for (const x of [lfo, o]) { x.type = 'sawtooth'; x.frequency.setValueAtTime(30, t); x.frequency.exponentialRampToValueAtTime(75, t + 0.25); }
    lg.gain.value = -0.5; g.gain.value = 0.5; // gain = 0.5 - 0.5 * saw: jumps to 1 at each round, fades to 0
    of.type = 'highpass'; of.frequency.value = 600; og.gain.value = 0.25; send.gain.value = 0.3;
    out.gain.setValueAtTime(0.0001, t); out.gain.exponentialRampToValueAtTime(0.14, t + 0.04);
    lfo.connect(lg).connect(g.gain); n.connect(f).connect(g).connect(out); o.connect(of).connect(og).connect(out);
    out.connect(master); out.connect(send).connect(verb);
    n.start(t); lfo.start(t); o.start(t); ciwsSnd = { n, f, g, lfo, lg, o, of, og, out, send };
  } else {
    const c = ciwsSnd; ciwsSnd = null;
    c.out.gain.cancelScheduledValues(t); c.out.gain.setValueAtTime(Math.max(0.0001, c.out.gain.value), t); c.out.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
    for (const k of ['n', 'lfo', 'o']) c[k].stop(t + 0.08);
    c.n.onended = () => { for (const k in c) c[k].disconnect(); };
    os(sfxOut(null, 0.2, 1), t, 0.6, 'triangle', 1400, 250, 0.03, 0.01); // barrels spin down
  }
}
// Music: a cheerful sea melody + bass, 32 steps
const MEL = [659, 0, 784, 0, 880, 0, 784, 659, 587, 0, 659, 0, 523, 0, 0, 0, 659, 0, 784, 0, 880, 0, 1047, 880, 784, 0, 659, 0, 587, 0, 0, 0];
const BASS = [131, 110, 87, 98, 131, 110, 87, 98];
function music() {
  if (--musicTimer > 0) return;
  musicTimer = 9;
  if (MEL[musicStep % 32]) tone(MEL[musicStep % 32], 0.18, 'sine', 0.07);
  if (musicStep % 4 === 0) tone(BASS[(musicStep / 4) % 8], 0.4, 'triangle', 0.18);
  musicStep++;
}

// Boss theme: swashbuckler style (original tune), 6/8 in D minor. Driving cello eighths, big drum and brass hits on 1 and 4
const BM_ROOT = [73.42, 73.42, 58.27, 65.41, 73.42, 49, 55, 55]; // D D Bb C D G A A, one per bar
const DM = [293.66, 349.23, 440], BB = [233.08, 293.66, 349.23], CM = [261.63, 329.63, 392], GM = [196, 233.08, 293.66], AM = [220, 277.18, 329.63];
const BM_CHORD = [DM, DM, BB, CM, DM, GM, AM, AM];
const BM_LEAD = [ // [eighth, Hz, length in eighths] over 8 bars of 6 eighths
  [0, 587.33, 3], [3, 698.46, 2], [5, 659.25, 1], [6, 587.33, 2], [8, 440, 1], [9, 587.33, 3],
  [12, 698.46, 3], [15, 932.33, 3], [18, 783.99, 2], [20, 698.46, 1], [21, 659.25, 3],
  [24, 698.46, 2], [26, 659.25, 1], [27, 587.33, 3], [30, 466.16, 2], [32, 587.33, 1], [33, 783.99, 3],
  [36, 659.25, 2], [38, 554.37, 1], [39, 440, 3], [42, 554.37, 3], [45, 659.25, 2], [47, 880, 1]];
const BM_STEP = 11; // 60 Hz steps per eighth note (dotted quarter ~110 BPM)
const BM_VOL = 0.4; // music bus volume: stays under the sound effects
let mbus = null, bossStep = 0;
function syn(t, f, dur, type, vol, cut, att = 0.01, detune = 0) { // filtered synth voice on the music bus
  const o = ac.createOscillator(), fl = ac.createBiquadFilter(), g = ac.createGain();
  o.type = type; o.frequency.value = f; o.detune.value = detune; fl.type = 'lowpass'; fl.frequency.value = cut;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + att); g.gain.setValueAtTime(vol, t + dur * 0.6); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(fl).connect(g).connect(mbus); o.start(t); o.stop(t + dur + 0.05);
  o.onended = () => { o.disconnect(); fl.disconnect(); g.disconnect(); };
}
function bossMusic() {
  if (--musicTimer > 0) return;
  musicTimer = BM_STEP;
  if (!mbus) { mbus = ac.createGain(); mbus.gain.value = BM_VOL; mbus.connect(master); const s = ac.createGain(); s.gain.value = 0.35; mbus.connect(s).connect(verb); }
  const t = ac.currentTime + 0.02, e8 = BM_STEP / 60, i = bossStep % 6, bar = Math.floor(bossStep / 6) % 8, k = bossStep % 48;
  const big = i === 0 || i === 3, fill = bar === 7 && i >= 3;
  syn(t, BM_ROOT[bar] * 2, e8 * 0.85, 'sawtooth', big ? 0.15 : 0.1, 600, 0.005);                     // cello ostinato: every eighth
  if (i === 0) syn(t, BM_ROOT[bar], e8 * 5.5, 'sawtooth', 0.12, 260, 0.02);                          // low strings under each bar
  if (big || fill) os(mbus, t, 0.4, 'sine', 120, 38, i === 0 ? 0.55 : 0.4);                           // big drum on 1 and 4, roll at the end
  if (i === 3 || fill) nz(mbus, t, 0.25, 0.2, 'bandpass', 1400, 500, 0.8);                            // snare crack
  if (i === 0) nz(mbus, t, 0.6, 0.06, 'highpass', 6000, 3000);                                        // cymbal wash
  if (i === 0 || (i === 3 && (bar === 3 || bar === 7))) for (const f of BM_CHORD[bar]) { // brass hits

function bubbleBurst() {

// Air drone (W): a rocket rises to the surface, bursts and throws our drone (dark gray, green lights).
// It shoots enemy drones with its laser and dives kamikaze into helicopters. Enemy drones can laser it too
const MY_DRONE_RANGE = 230, MY_DRONE_AIM = 54, MY_DRONE_LOCK = 18, MY_DRONE_BEAM = 15; // px, steps
function launchDrone() {
  if (locked('drone') || droneAmmo <= 0 || droneRocket || myDrone || player.jam) return;
  droneAmmo--; sfx.launch(player.x + 60);
  droneRocket = { x: player.x + 58, y: player.y + 6, vy: -0.6 };

function updateMyDrone() {
  const r = droneRocket;
  if (r) { // rocket: straight up, bursts at the surface
    r.vy = Math.max(-3.2, r.vy - 0.08); r.y += r.vy; r.x += 0.2;
    particles.push({ kind: 'bubble', x: r.x + 2 + rnd(-2, 2), y: r.y + 10, vx: rnd(-0.3, 0.3), vy: rnd(-0.6, 0), life: 35, max: 35, size: rnd(1, 2.2) });
    if (r.y < SURFACE - 4) {
      droneRocket = null; sfx.pop(r.x, SURFACE - 6); sfx.droneOut(r.x);
      particles.push({ kind: 'flash', x: r.x + 2, y: SURFACE - 6, life: 8, max: 8, size: 6 });
      for (let i = 0; i < 14; i++) particles.push({ kind: 'drop', x: r.x + rnd(-6, 6), y: SURFACE, vx: rnd(-1.5, 1.5), vy: rnd(-3.5, -1), life: 40, max: 40, size: rnd(1.5, 2.5) });
      for (let i = 0; i < 6; i++) particles.push({ kind: 'smoke', x: r.x + rnd(-4, 4), y: SURFACE - 8, vx: rnd(-0.5, 0.5), vy: rnd(-0.6, 0), life: 40, max: 40, size: rnd(2.5, 4), color: '#d9dde0' });
      myDrone = { type: 'drone', mine: true, x: r.x - 14, y: SURFACE - 16, w: 32, h: 14, vx: 0, vy: -2.5, t: 0, aim: 0, beam: 0, fire: 20 };
      flash = { msg: 'DRONE AWAY', t: 50 };
    }
  }
  const d = myDrone;
  if (!d) return;
  d.t += 0.02;
  const ox = d.x + 12, oy = d.y + 12;
  let foe = null, fd = Infinity; // closest enemy drone, else the helicopter
  for (const e of enemies) if (e.type === 'drone' && !e.dead && e.x < W) { const dd = Math.hypot(e.x + 12 - ox, e.y + 12 - oy); if (dd < fd) { fd = dd; foe = e; } }
  const heli = !foe && enemies.find(e => e.type === 'heli' && !e.dead && e.x < W - 10);
  let gx, gy, sp = 2.2;
  if (foe) { gx = foe.x + (foe.x > ox ? -130 : 130); gy = foe.y; }            // stand off and shoot
  else if (heli) { gx = heli.x + heli.w / 2 - 16; gy = heli.y + 6; sp = 4.5;  // kamikaze
    if (!d.dive) { d.dive = true; tone(600, 0.8, 'sawtooth', 0.05, 1500); if (!flash) flash = { msg: 'DRONE ON ATTACK RUN', t: 50 }; } }
  else { gx = player.x + 120; gy = 28 + Math.sin(d.t * 2) * 6; }             // waits over the sub
  const dx = gx - d.x, dy = gy - d.y, dd = Math.hypot(dx, dy) || 1, k = Math.min(1, dd / 40);
  d.vx += (dx / dd * sp * k - d.vx) * 0.08; d.vy += (dy / dd * sp * k - d.vy) * 0.08;
  d.x += d.vx; d.y += d.vy;
  d.x = Math.max(0, Math.min(W - 32, d.x)); d.y = Math.max(6, Math.min(SURFACE - 18, d.y));
  if (heli && Math.hypot(heli.x + heli.w / 2 - d.x - 16, heli.y + heli.h / 2 - d.y - 7) < 22) { // impact
    myDrone = null; killEnemy(heli); shake = Math.max(shake, 8); flash = { msg: 'SPLASH ONE HELO', t: 60 }; return;
  }
  // laser duel: aims (tracks, then locks), fires a short green beam
  if (d.beam > 0) {
    d.beam--;
    const lx = d.tx - ox, ly = d.ty - oy, ll = Math.hypot(lx, ly) || 1, c = lx / ll, sn = ly / ll;
    let x2 = ox, y2 = oy;
    for (let q = 0; q < ll + 14; q += 3) {
      x2 = ox + c * q; y2 = oy + sn * q;
      if (y2 > SURFACE || x2 < -20 || x2 > W + 20) break;
      const e = enemies.find(e => e.type === 'drone' && !e.dead && x2 > e.x - 2 && x2 < e.x + e.w + 2 && y2 > e.y - 2 && y2 < e.y + e.h + 2);
      if (e) { killEnemy(e); d.beamHit = true; flash = { msg: 'SPLASH ONE DRONE', t: 50 }; break; }
    }
    d.lx = x2; d.ly = y2;

    if (d.aim === 0) { d.beam = MY_DRONE_BEAM; d.beamHit = false; d.lx = d.tx; d.ly = d.ty; tone(2400, 0.3, 'sawtooth', 0.06, 900); }
  } else if (d.fire > 0) d.fire--;

}

// Boss at the end of mission 4: a Typhoon-class sub with 10 hp. The mission only ends when it is sunk.
// It roams fast on the right side, fires 2 homing Shkval rocket-torpedoes every 5 s (sail and keel),

// One boss per mission. speed: max px/step (our sub: 1.75), save: chance to defeat each torpedo / H-bomb, swim: steps between swimmer launches
const BOSSES = {

const BOSS_HBOMB = 3, BOSS_DIVERS = 3; // hp an H-bomb takes, max swimmers out at once
const BOSS_FIRE = 300, BOSS_RKT_V = 3, BOSS_RKT_TURN = 0.035;      // steps between salvos, rocket px/step and rad/step
const BOSS_LASER_RANGE = 170, BOSS_LZ_AIM = 40, BOSS_LZ_LOCK = 24, BOSS_LZ_BEAM = 20, BOSS_LZ_COOL = 120; // px, steps
const BOSS_CM_RANGE = 260, BOSS_BCL_R = 30;       // reaction range, bubble wall radius
let boss = null, bossDone = false, bossEnd = 0;

}
function bossDefend(e, w, x, y) { // w: our torpedo or H-bomb, (x, y): where to put the bubble wall

    const d = { type: 'cm', x: e.x + 30, y: e.y + 12, w: 6, h: 6, vx: -1.2, vy: (w.y < e.y + 12 ? -1 : 1) * 2.6, life: 300 };

function updateBoss(e) {

    let x2 = bx, y2 = by;
    for (let s = 0; s < BOSS_LASER_RANGE + 40; s += 3) {

      if (y2 < SURFACE || y2 > groundY(camX + x2) || x2 < -20) break;
      if (!e.lzHit && x2 > pb.x - 2 && x2 < pb.x + pb.w + 2 && y2 > pb.y - 2 && y2 < pb.y + pb.h + 2) { e.lzHit = true; damagePlayer(); }

    const gap = e.x - t.x - t.w, ty = t.y + t.h / 2 + Math.tan(t.a) * Math.max(0, gap);

    if (t.boss ??= Math.random() < e.save) { bossDefend(e, t, t.x + t.w + gap * 0.5, t.y + t.h / 2 + Math.tan(t.a) * gap * 0.5); return; }

    if (m.boss ??= Math.random() < e.save) { bossDefend(e, m, mx + (cx - mx) * 0.4, my + (cy - my) * 0.4); return; }

}

// Electric eel: touching the sub shocks it, the weapons (torpedoes, laser, H-bomb) are down for 10 s.
// Decoys still work. Each eel discharges once, then dives away.
const JAM_TIME = 600;
function shockPlayer(e) {
  e.spent = true; player.jam = JAM_TIME; shake = Math.max(shake, 6);
  sfx.shock(player.x + 46); flash = { msg: 'EMP HIT - WEAPONS OFFLINE', t: 120, danger: true };

    particles.push({ kind: 'spark', x: player.x + 46 + rnd(-30, 30), y: player.y + 24 + rnd(-6, 6), vx: Math.cos(an) * sp, vy: Math.sin(an) * sp, life: 18, max: 18, size: rnd(1, 2), color: '#9ff' });

}
function bolt(x1, y1, x2, y2) { // zigzag lightning line
  ctx.beginPath(); ctx.moveTo(x1, y1);
  for (let i = 1; i < 5; i++) ctx.lineTo(x1 + (x2 - x1) * i / 5 + rnd(-3, 3), y1 + (y2 - y1) * i / 5 + rnd(-3, 3));
  ctx.lineTo(x2, y2); ctx.stroke();
}

// Drone laser: only reaches the sub near the surface (water absorbs it past DRONE_DEPTH).
// It aims for 1 s (thin blinking line), locks the target for the last 0.5 s (time to dodge), then fires for 1/3 s.
const DRONE_DEPTH = 100, DRONE_AIM = 60, DRONE_LOCK = 30, DRONE_BEAM = 20;
function droneLaser(e) {
  const ox = e.x + 12, oy = e.y + 12, md = myDrone && Math.hypot(myDrone.x + 16 - ox, myDrone.y + 7 - oy) < 260 ? myDrone : null;
  const px = e.atMine && md ? md.x + 16 : player.x + 46, py = e.atMine && md ? md.y + 7 : player.y + 24; // our drone first, when it is near
  if (e.beam > 0) {
    e.beam--;
    const dx = e.tx - ox, dy = e.ty - oy, dd = Math.hypot(dx, dy) || 1, c = dx / dd, sn = dy / dd;
    const pb = playerBox();
    let x2 = ox, y2 = oy;
    for (let d = 0; d < dd + 12; d += 3) { // a short burst: stops just past the locked point
      x2 = ox + c * d; y2 = oy + sn * d;
      if (y2 > SURFACE + DRONE_DEPTH || y2 > groundY(camX + x2) || x2 < -20 || x2 > W + 20) break;
      if (!e.beamHit && x2 > pb.x - 2 && x2 < pb.x + pb.w + 2 && y2 > pb.y - 2 && y2 < pb.y + pb.h + 2) { e.beamHit = true; damagePlayer(); }
      if (myDrone && x2 > myDrone.x - 2 && x2 < myDrone.x + myDrone.w + 2 && y2 > myDrone.y - 2 && y2 < myDrone.y + myDrone.h + 2) { e.beamHit = true; killMyDrone(); }
      for (let i = allies - 1; i >= 0; i--) {
        const ab = allyBox(i);
        if (x2 > ab.x && x2 < ab.x + ab.w && y2 > ab.y && y2 < ab.y + ab.h) { allies--; boom(ab.x + 28, ab.y + 12, false); }
      }

    e.lx = x2; e.ly = y2;

    }

    e.aim--;

    if (e.aim === 0) { e.beam = DRONE_BEAM; e.beamHit = false; e.lx = e.tx; e.ly = e.ty; tone(1800, 0.35, 'sawtooth', 0.08, 500); }
  } else if (e.fire > 0) e.fire--;

}

// Proximity fuse: mines and depth charges arm when the sub comes close, beep fast, then blow up
const FUSE_RANGE = 38, FUSE_TIME = 24, MINE_BLAST = 55; // px, steps (0.4 s), px
function distToPlayer(x, y) { const b = playerBox(); return Math.hypot(Math.max(b.x - x, 0, x - b.x - b.w), Math.max(b.y - y, 0, y - b.y - b.h)); }
function proximityFuse(o, x, y) { // returns true when it explodes
  const lure = decoyNear(x, y); // fooled by a decoy: only the decoy sets it off
  if (!o.fuse) { if (lure ? Math.hypot(lure.x - x, lure.y - y) < FUSE_RANGE : distToPlayer(x, y) < FUSE_RANGE) { o.fuse = FUSE_TIME; tone(1200, 0.06, 'square', 0.1); } return false; }
  if (--o.fuse % 6 === 0) tone(1600, 0.05, 'square', 0.1); // arming beeps
  if (o.fuse > 0) return false;
  o.dead = true; boom(x, y);
  particles.push({ kind: 'ring', x, y, life: 20, max: 20, r: MINE_BLAST });
  shake = Math.max(shake, 8);
  if (distToPlayer(x, y) < MINE_BLAST) damagePlayer();
  for (const d of decoys) if (d.life > 0 && Math.hypot(d.x - x, d.y - y) < MINE_BLAST) d.life = 0;
  for (let i = allies - 1; i >= 0; i--) { const a = allyBox(i); if (Math.hypot(a.x + a.w / 2 - x, a.y + a.h / 2 - y) < MINE_BLAST) { allies--; boom(a.x + 28, a.y + 12, false); } }

// Homing swimmers (beluga, diver): steer toward the nearest decoy, else the sub; give up when life runs out.
// Sets e.svx / e.vy (screen speed); returns false once it has given up.
function steer(e, speed, turn) {
  const ox = e.w / 2, oy = e.h / 2, lure = decoyNear(e.x + ox, e.y + oy);
  const gx = lure ? lure.x : player.x + 46, gy = lure ? lure.y : player.y + 24;
  const leave = --e.life <= 0, dx = gx - (e.x + ox), dy = gy - (e.y + oy), d = Math.hypot(dx, dy) || 1;
  const sx = leave ? -speed * 1.76 : dx / d * speed, sy = leave ? 0 : dy / d * speed;
  const k = lure ? turn * 2.8 : turn; // a lure pulls it hard
  e.svx = (e.svx || 0) + (sx - (e.svx || 0)) * k; e.vy += (sy - e.vy) * k;
  return !leave;
}
function swim(e) { // apply the steering: vx is used with the scroll on the next step; stay in the water
  e.vx = -scroll - e.svx; e.y += e.vy;
  e.y = Math.max(SURFACE + 8, Math.min(groundY(camX + e.x + e.w / 2) - e.h - 4, e.y));
  if (Math.abs(e.svx) > 0.15) e.face = Math.sign(e.svx);
}

function damagePlayer() {
  if (player.inv > 0) return;
  lives--; player.inv = 150; boom(player.x + 46, player.y + 24); sfx.die(player.x + 46);
  if (lives <= 0) { state = 'over'; sfx.lose(); }
}

function killEnemy(e, safe) { // safe: the swimmer's bomb can't hurt the sub (bubble screen)
  e.dead = true; boom(e.x + e.w / 2, e.y + e.h / 2);
  if (e.type === 'boss') { // sunk: huge blast, its rockets go dead, the mission ends a bit later
    bossDone = true; bossEnd = 150; boss = null; shake = 20; whiteFlash = 0.8; sfx.mega(e.x + e.w / 2, e.y + e.h / 2);
    for (let i = 0; i < 4; i++) boom(e.x + rnd(10, e.w - 10), e.y + rnd(0, e.h));
    for (const s of eShots) if (s.type === 'brk') { s.dead = true; boom(s.x + 6, s.y + 2, false); }
    flash = { msg: 'SPLASH ONE ' + e.name + ' - BOSS DOWN', t: 150 };
  }
  if (['sub', 'boat', 'heli', 'drone', 'boss'].includes(e.type)) { // burning wreck sinks (or falls into the sea)
    const w = { ...e, flash: 0, marks: [...(e.marks || [])] };
    for (let i = 0; i < 3; i++) addMark(w, w.x + rnd(0, w.w * 0.5));
    particles.push({ kind: 'wreck', e: w, x: 0, y: 0, vy: 0.1, rot: 0, spin: rnd(0.004, 0.01) * (Math.random() < 0.5 ? -1 : 1), air: e.type === 'heli' || e.type === 'drone', life: 220, max: 220 });
  }
  if (e.type === 'beluga' || e.type === 'diver') { // bomb destroyed: big blast, the carrier is neutralized
    const bx = e.x + e.w / 2, by = e.y + 2;
    particles.push({ kind: 'ring', x: bx, y: by, life: 20, max: 20, r: MINE_BLAST }); shake = Math.max(shake, 8);
    if (!safe && distToPlayer(bx, by) < MINE_BLAST) damagePlayer();
  }
  if (e.type === 'octo') for (let i = 0; i < 10; i++) // ink cloud
    particles.push({ kind: 'smoke', x: e.x + e.w / 2 + rnd(-6, 6), y: e.y + e.h / 2 + rnd(-6, 6), vx: rnd(-0.4, 0.4), vy: rnd(-0.3, 0.3), life: 90, max: 90, size: rnd(6, 12), color: '#2a0f3a' });
  score += e.pts * level; coins++; save();
  if (Math.random() < 0.15) pickups.push({ type: 'star', x: e.x + e.w / 2 - 10, y: e.y + e.h / 2 - 10, w: 20, h: 20 });
  // Every 10 kills: a new ally sub (max 2), then extra lives
  if (++kills % 10 === 0) {
    if (allies < 2) { allies++; flash = { msg: 'FRIENDLY SUB JOINING FORMATION', t: 120 }; }
    else { lives++; flash = { msg: 'REINFORCEMENTS: +1 LIFE', t: 120 }; }
    sfx.win();
  }

// Destroyed vehicles: tilt and sink to the bottom, trailing bubbles and smoke
function updateWreck(p) {
  const e = p.e;
  if (state === 'play') e.x -= scroll;
  if (p.air && e.y < SURFACE) p.vy = Math.min(3, p.vy + 0.12);   // falling from the sky
  else p.vy = Math.min(0.7, p.vy + 0.015);                       // sinking slowly
  if (p.air && !p.splashed && e.y + e.h / 2 > SURFACE) {
    p.splashed = true; p.vy = 0.5;

    const m = e.marks[Math.floor(Math.random() * e.marks.length)], mx = e.x + m.dx, my = e.y + m.dy;

// ---------- Update ----------

  // Player: free swimming in 4 directions
  const sp = ship().speed * 0.5;
  const tx = (keys.ArrowRight ? sp : 0) - (keys.ArrowLeft ? sp : 0);
  const ty = (keys.ArrowDown ? sp : 0) - (keys.ArrowUp ? sp : 0);

  player.x = Math.max(10, Math.min(W * 0.65, player.x + player.vx));
  player.y = Math.max(SURF_Y, Math.min(groundY(camX + player.x + 46) - 40, player.y + player.vy));

    particles.push({ kind: 'bubble', x: px + rnd(-3, 1), y: py + rnd(-5, 5), vx: -c * rnd(0.6, 1.4) - scroll * 0.3, vy: -sn * 0.8 + rnd(-0.5, 0.1), life: 45, max: 45, size: rnd(1.5, 4) });

    d.y = Math.max(SURFACE + 6, Math.min(groundY(camX + d.x) - 6, d.y));
    if (d.life % 30 === 0) { particles.push({ kind: 'ring', x: d.x, y: d.y, life: 20, max: 20, r: 30 }); if (d.life % 60 === 0) tone(2200, 0.05, 'sine', 0.03); }

    torps.push({ x: tx0, y: ty0 - 1.5, w: 18, h: 3, vx: 0.4, a }); // slim, matte black
    for (let i = 0; i < allies; i++) { const al = allyBox(i); torps.push({ x: al.x + 56, y: al.y + 11, w: 16, h: 3, vx: 0.4, a: 0 }); }
    for (let i = 0; i < 8; i++) // launch bubbles from the tube
      particles.push({ kind: 'bubble', x: tx0 + rnd(0, 8), y: ty0 + rnd(-6, 4), vx: rnd(-0.3, 0.3), vy: rnd(-0.8, -0.2), life: 50, max: 50, size: rnd(1, 3) });

  }

  laser = null;
  if (keys.KeyF && !player.jam) {
    const a = player.vy * 0.1, c = Math.cos(a), sn = Math.sin(a), cx = player.x + 46, cy = player.y + 24;

      particles.push({ kind: 'fire', x: cx - Math.cos(s.a) * 5, y: cy - Math.sin(s.a) * 5, vx: -s.vx * 0.2, vy: -s.vy * 0.2, life: 6, max: 6, size: rnd(1, 2), color: '#ffd23f' });
      if (T % 2 === 0) particles.push({ kind: 'smoke', x: cx - Math.cos(s.a) * 6, y: cy - Math.sin(s.a) * 6, vx: 0, vy: -0.1, life: 35, max: 35, size: 1.8, color: '#e6e9ec' });
      if (cy > SURFACE) { s.dead = true; for (let i = 0; i < 5; i++) particles.push({ kind: 'drop', x: cx, y: SURFACE, vx: rnd(-1, 1), vy: rnd(-2.5, -1), life: 30, max: 30, size: rnd(1, 2) }); }
      if (--s.life <= 0 || s.y < -30) s.dead = true;
    }
    else {
      const d = s.y > SURFACE && decoyNear(s.x + 5, s.y + 7);
      if (d) { const dx = d.x - s.x - 5, dy = d.y - s.y - 7, dd = Math.hypot(dx, dy) || 1, v = Math.max(0.8, s.vy); s.x += dx / dd * v; s.y += dy / dd * v; }
      else { s.y += s.y < SURFACE ? 1.4 : s.vy; s.x -= scroll * 0.4; s.x += Math.sin(s.y * 0.05) * 0.3; }
    }
    if (s.type === 'charge' && s.y + s.h > groundY(camX + s.x)) { s.dead = true; boom(s.x + 5, s.y + 7, false); }
    if (s.type === 'charge' && !s.dead && s.y > SURFACE && proximityFuse(s, s.x + 5, s.y + 7)) continue;
    if (s.type === 'sam' || s.type === 'atr' || s.type === 'cm' || s.type === 'bcl') continue; // they only go after our weapons
    if (!s.dead && hit(s, playerBox())) { s.dead = true; damagePlayer(); }
    for (let i = allies - 1; i >= 0; i--) if (!s.dead && hit(s, allyBox(i))) { s.dead = true; allies--; boom(allyBox(i).x + 28, allyBox(i).y + 12); }
    for (const t of torps) if (!s.dead && !t.dead && hit(s, t)) { s.dead = t.dead = true; boom(s.x, s.y, false); score += 5; }
  }
  eShots = eShots.filter(s => !s.dead && s.x > -30 && s.x < W + 30 && s.y < H);

  // Threat warning: the closest missile, torpedo, beluga, swimmer or drone aimed at the sub. Beeps faster as it closes in
  const px = player.x + 46, py = player.y + 24;
  let th = Infinity, thO = null;
  const near = (o, d) => { if (d < th) { th = d; thO = o; } };
  for (const s of eShots) {
    if (s.type === 'brk') near(s, Math.hypot(s.x + s.w / 2 - px, s.y + s.h / 2 - py));
    if (s.type === 'asm' && !s.boost && player.up) near(s, Math.hypot(s.x + s.w / 2 - px, s.y + s.h / 2 - py));
    if (s.type === 'torp') { // only if its course passes close to the sub
      const rx = px - s.x - s.w / 2, ry = py - s.y - s.h / 2, v = Math.hypot(s.vx, s.vy) || 1, along = (rx * s.vx + ry * s.vy) / v;
      if (along > 0 && Math.abs(rx * s.vy - ry * s.vx) / v < 40) near(s, Math.hypot(rx, ry));
    }
  }
  for (const e of enemies) {
    if (e.dead || e.x > W) continue;
    const homing = (e.type === 'beluga' || e.type === 'diver') && e.bomb && !e.air && !e.blow && e.life > 0 && !decoyNear(e.x + e.w / 2, e.y + e.h / 2); // hunting the sub, not a decoy
    const drone = e.type === 'drone' && (e.aim > 0 || e.beam > 0 || player.y < SURFACE + 70); // its laser can reach us
    if (homing || drone) near(e, Math.hypot(e.x + e.w / 2 - px, e.y + e.h / 2 - py));
  }
  player.threat = th < WARN_RANGE ? th : Infinity;
  if (thO && th < WARN_RANGE && !thO.warned) { // a new threat has us locked: danger message, once per threat
    thO.warned = true;
    const what = { asm: 'MISSILE', brk: 'SHKVAL', torp: 'TORPEDO', beluga: 'KAMIKAZE WHALE', diver: 'COMBAT SWIMMER', drone: 'DRONE' }[thO.type];
    if (what && !(flash && flash.danger && flash.t > 30)) flash = { msg: 'LOCKED TARGET - ' + what + ' INBOUND', t: 70, danger: true };
  }
  if (player.threat === Infinity) player.beepT = 0;
  else if (--player.beepT <= 0) {
    const red = player.threat < WARN_RED;
    tone(red ? 1900 : 1500, 0.05, 'square', red ? 0.05 : 0.035);
    player.beepT = 6 + Math.round(48 * player.threat / WARN_RANGE); // from 0.9 s far away to 0.1 s when close
  }

  // Target lock: always the closest enemy sub or ship on screen (orange box). The H-bomb homes on it
  player.lock = null;
  let ld = Infinity;
  for (const e of enemies) if ((e.type === 'sub' || e.type === 'boat' || e.type === 'boss') && !e.dead && e.x + e.w > 0 && e.x < W) {
    const d = Math.hypot(e.x + e.w / 2 - player.x - 46, e.y + e.h / 2 - player.y - 24);
    if (d < ld) { ld = d; player.lock = e; }
  }
  if (player.lock !== player.lockOld) { if (player.lock) tone(2600, 0.04, 'sine', 0.04); player.lockOld = player.lock; } // lock-on chirp

  // Guided H-bomb: ejected upward, then the motor lights and it turns onto its target, under or over the water
  for (const m of missiles) {
    if (!m.guided) continue;
    if (!m.target || m.target.dead) m.target = player.lock; // target gone: take the next lock (or fly straight)
    m.t++;
    const cx = m.x + 2.5, cy = m.y + 7, wasUnder = cy > SURFACE;
    if (m.lure && m.lure.dead) m.lure = false;
    if (m.t > 20) {
      const tg = m.lure || m.target; // an enemy sub's decoy pulls it away
      if (tg) {
        let diff = Math.atan2(tg.y + tg.h / 2 - cy, tg.x + tg.w / 2 - cx) - m.a; diff = Math.atan2(Math.sin(diff), Math.cos(diff));
        m.a += Math.max(-0.08, Math.min(0.08, diff));
      }
      m.v = Math.min(wasUnder ? 2.8 : 4, m.v + 0.08);
      if (m.t === 21) sfx.motor(cx, wasUnder); // motor lights
    }
    m.x += Math.cos(m.a) * m.v; m.y += Math.sin(m.a) * m.v;
    const nx = m.x + 2.5, ny = m.y + 7, under = ny > SURFACE, bx = nx - Math.cos(m.a) * 9, by = ny - Math.sin(m.a) * 9;
    if (under !== wasUnder) { // crossing the surface: splash
      if (!under) sfx.ignite(nx); else noise(0.2, 0.1);
      for (let i = 0; i < 14; i++) particles.push({ kind: 'drop', x: nx + rnd(-6, 6), y: SURFACE, vx: rnd(-1.5, 1.5), vy: rnd(-3.5, -1), life: 45, max: 45, size: rnd(1.5, 3) });
    }
    if (under) particles.push({ kind: 'bubble', x: bx + rnd(-2, 2), y: by + rnd(-2, 2), vx: rnd(-0.3, 0.3), vy: rnd(-0.6, 0), life: 40, max: 40, size: rnd(1, 2.5) });
    else if (m.t > 20) {
      particles.push({ kind: 'fire', x: bx, y: by, vx: -Math.cos(m.a), vy: -Math.sin(m.a), life: 12, max: 12, size: rnd(2, 4), color: '#ffb347' });
      particles.push({ kind: 'smoke', x: bx, y: by, vx: rnd(-0.2, 0.2), vy: 0.2, life: 50, max: 50, size: rnd(2, 4) });
    }
    const struck = enemies.find(e => !e.dead && (e.type === 'sub' || e.type === 'boat' || e.type === 'boss') && nx > e.x - 3 && nx < e.x + e.w + 3 && ny > e.y - 3 && ny < e.y + e.h + 3);
    if (m.lure && Math.hypot(m.lure.x + 3 - nx, m.lure.y + 3 - ny) < 10) { m.dead = m.lure.dead = true; megaBoom(nx, ny); } // wasted on the decoy
    else if (struck || ny > groundY(camX + nx) || ny < 8) { m.dead = true; megaBoom(nx, ny, struck); } // flies past aircraft
    else if (m.t > 600 || nx < -20 || nx > W + 20) m.dead = true;
  }
  // Unguided H-bomb (nothing locked): rises slowly underwater, then rockets into the sky
  for (const m of missiles) {
    if (m.guided || m.dead) continue;
    m.vy = Math.max(m.under ? -1.6 : -4.5, m.vy - (m.under ? 0.03 : 0.12));
    m.y += m.vy; m.x += 0.2;
    if (m.under && m.y < SURFACE) { // splash out of the water
      m.under = false; sfx.ignite(m.x);
      for (let i = 0; i < 20; i++) particles.push({ kind: 'drop', x: m.x + rnd(-6, 6), y: SURFACE, vx: rnd(-1.5, 1.5), vy: rnd(-3.5, -1), life: 45, max: 45, size: rnd(1.5, 3) });
    }
    if (m.under) particles.push({ kind: 'bubble', x: m.x + 2 + rnd(-2, 2), y: m.y + 14, vx: rnd(-0.3, 0.3), vy: rnd(-0.6, 0), life: 40, max: 40, size: rnd(1, 2.5) });
    else {
      particles.push({ kind: 'fire', x: m.x + 2.5, y: m.y + 15, vx: rnd(-0.3, 0.3), vy: 1, life: 12, max: 12, size: rnd(2, 4), color: '#ffb347' });
      particles.push({ kind: 'smoke', x: m.x + 2.5, y: m.y + 18, vx: rnd(-0.2, 0.2), vy: 0.2, life: 50, max: 50, size: rnd(2, 4) });
    }
    const target = enemies.find(e => !e.dead && e.type === 'boat' && hit(m, e));
    if (target || m.y < 22) { m.dead = true; megaBoom(m.x + 2, m.y, target); } // in the sky it hurts nobody
  }
  missiles = missiles.filter(m => !m.dead);
  updateMyDrone();
  if (whiteFlash > 0.01) whiteFlash *= 0.9; else whiteFlash = 0;

  // Pickups: coins and the double-torpedo starfish
  for (const p of pickups) {
    p.x -= scroll;
    if (hit(p, playerBox())) {
      p.dead = true;
      if (p.type === 'coin') { coins++; score += 5; save(); sfx.coin(); }
      else if (p.type === 'life') { lives++; sfx.win(); flash = { msg: 'MEDEVAC CRATE: +1 LIFE', t: 90 }; }
      else { player.double = 600; sfx.power(); flash = { msg: 'RAPID RELOAD', t: 90 }; }
    }
  }
  pickups = pickups.filter(p => !p.dead && p.x > -30);

  if (BOSSES[level] && dist >= levelLen && (!bossDone || --bossEnd > 0)) { dist = levelLen; if (!boss && !bossDone) spawnBoss(); } // the mission ends when the boss is sunk
  else if (dist >= levelLen) { state = 'next'; nextTimer = 180; enemies = []; eShots = []; sfx.win(); }
}

// ---------- Draw ----------
let T = 0;
const GR = {}; // cached gradients
const FONT = '"Trebuchet MS", Verdana, sans-serif';
const bgFish = Array.from({ length: 5 }, (_, i) => ({ x: rnd(0, W), y: 130 + i * 50, s: rnd(0.2, 0.6), size: rnd(0.6, 1.1) }));

function shade(hex, f) { // f < 0 darker, f > 0 lighter
  const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255];
  return 'rgb(' + c.map(v => Math.round(f < 0 ? v * (1 + f) : v + (255 - v) * f)).join(',') + ')';
}
const waveY = sx => SURFACE + Math.sin((sx + camX) * 0.03 + T * 0.05) * 3;

function drawLayer(speed, color, base, a1, f1, a2, f2) {
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, H);
  for (let sx = 0; sx <= W; sx += 10) { const wx = camX * speed + sx; ctx.lineTo(sx, base - a1 * Math.sin(wx * f1) - a2 * Math.sin(wx * f2 + 2)); }
  ctx.lineTo(W, H); ctx.fill();
}

function drawWreck(x, y) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(-0.12);
  ctx.fillStyle = '#123f5c';
  ctx.beginPath(); ctx.moveTo(-90, -10); ctx.lineTo(90, -22); ctx.lineTo(70, 12); ctx.lineTo(-75, 15); ctx.fill(); // hull
  ctx.fillRect(-40, -38, 50, 20);                                   // cabin
  ctx.fillRect(25, -90, 4, 72); ctx.fillRect(5, -75, 44, 3);        // mast
  ctx.fillStyle = '#0b2e45';
  for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.arc(-55 + i * 28, -2, 4, 0, 7); ctx.fill(); }
  ctx.restore();
}

function drawSeaweed(x, y, h, c) {
  const sway = Math.sin(T * 0.03 + x * 0.1) * 10;
  ctx.strokeStyle = c; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, y);
  ctx.bezierCurveTo(x - 10, y - h * 0.33, x + 10 + sway / 2, y - h * 0.66, x + sway, y - h); ctx.stroke();
}

function drawCoral(x, y, c, s) {
  ctx.strokeStyle = c; ctx.lineCap = 'round';
  const branch = (bx, by, an, len, wdt) => {
    if (len < 4) return;
    const ex = bx + Math.cos(an) * len, ey = by + Math.sin(an) * len;
    ctx.lineWidth = wdt; ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(ex, ey); ctx.stroke();
    branch(ex, ey, an - 0.5, len * 0.7, wdt * 0.75); branch(ex, ey, an + 0.45, len * 0.65, wdt * 0.75);
  };
  branch(x, y, -Math.PI / 2, 14 * s, 5 * s);
}

function drawGround() {
  // Decorations behind the sand edge
  const step = 46, i0 = Math.floor(camX / step);
  for (let i = i0; i <= i0 + W / step + 1; i++) {
    const wx = i * step + hash(i) * 20, sx = wx - camX, gy = groundY(wx) + 4, k = hash(i * 7.3);
    if (k < 0.35) drawSeaweed(sx, gy, 30 + hash(i * 3.1) * 50, ['#2e8b57', '#3cb371', '#228b22', '#6b8e23'][i & 3]);
    else if (k < 0.55) drawCoral(sx, gy, ['#ff6f61', '#ff9ad5', '#ffb347', '#c77dff'][i & 3], 0.8 + hash(i * 2.2) * 0.6);
    else if (k < 0.62) {   // anemone
      ctx.strokeStyle = '#ff7ab8'; ctx.lineWidth = 2.5;
      for (let a = -3; a <= 3; a++) { ctx.beginPath(); ctx.moveTo(sx, gy); ctx.lineTo(sx + a * 4 + Math.sin(T * 0.05 + a) * 2, gy - 14 + Math.abs(a)); ctx.stroke(); }
    }
  }
  // Sand
  ctx.fillStyle = GR.sand; ctx.beginPath(); ctx.moveTo(0, H);
  for (let sx = 0; sx <= W; sx += 8) ctx.lineTo(sx, groundY(camX + sx));
  ctx.lineTo(W, H); ctx.fill();
  // Things lying on the sand
  for (let i = i0; i <= i0 + W / step + 1; i++) {
    const wx = i * step + hash(i) * 20, sx = wx - camX, gy = groundY(wx) + 2, k = hash(i * 7.3);
    if (k > 0.7 && k < 0.8) drawStarfish(sx, gy, 6, 0.3, '#ff7f50');
    else if (k >= 0.8 && k < 0.9) { // shell
      ctx.fillStyle = '#f7d6c4'; ctx.beginPath(); ctx.arc(sx, gy, 6, Math.PI, 0); ctx.fill();
      ctx.strokeStyle = '#d4a08a'; ctx.lineWidth = 1;
      for (let a = 1; a < 5; a++) { ctx.beginPath(); ctx.moveTo(sx, gy); ctx.lineTo(sx + Math.cos(Math.PI + a * Math.PI / 5) * 6, gy + Math.sin(Math.PI + a * Math.PI / 5) * 6); ctx.stroke(); }
    } else if (k >= 0.97) { // treasure chest
      ctx.fillStyle = '#7a4a1e'; ctx.fillRect(sx - 12, gy - 12, 24, 14);
      ctx.fillStyle = '#ffd700'; ctx.fillRect(sx - 12, gy - 8, 24, 2); ctx.fillRect(sx - 2, gy - 9, 4, 5);
    }
  }
}

function drawBackground() {
  // Sky
  // Sky + water come from the canvas CSS background (painting them here cost ~4 ms/frame)
  if (!GR.sand) {
    GR.sand = ctx.createLinearGradient(0, H - 70, 0, H);
    GR.sand.addColorStop(0, '#e6c88a'); GR.sand.addColorStop(1, '#9c7640');
  }
  ctx.fillStyle = '#fff59d'; ctx.beginPath(); ctx.arc(W - 90, 30, 18, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  for (let i = 0; i < 4; i++) {
    const cx = ((i * 260 - camX * 0.1) % (W + 200) + W + 200) % (W + 200) - 100, cy = 18 + (i % 2) * 14;
    ctx.beginPath(); ctx.arc(cx, cy, 12, 0, 7); ctx.arc(cx + 14, cy - 5, 14, 0, 7); ctx.arc(cx + 30, cy, 11, 0, 7); ctx.fill();
  }

  // Waves: only the thin band between the wave line and the cached water top
  ctx.fillStyle = '#3fb6e0'; ctx.beginPath(); ctx.moveTo(0, SURFACE + 4);
  for (let sx = 0; sx <= W; sx += 8) ctx.lineTo(sx, waveY(sx));
  ctx.lineTo(W, SURFACE + 4); ctx.fill();

  // Sun rays
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  for (let i = 0; i < 7; i++) {
    const x0 = i * 130 + Math.sin(T * 0.004 + i) * 30;
    ctx.beginPath(); ctx.moveTo(x0, SURFACE); ctx.lineTo(x0 + 40, SURFACE); ctx.lineTo(x0 + 140, H); ctx.lineTo(x0 + 60, H); ctx.fill();
  }

  // Far mountains, mid rocks with a sunken ship (parallax)
  drawLayer(0.2, '#0c3e63', H - 140, 45, 0.006, 25, 0.017);
  const wreckWx = Math.floor((camX * 0.45 + 300) / 1800) * 1800 + 900, wsx = wreckWx - camX * 0.45;
  if (wsx > -150 && wsx < W + 150) drawWreck(wsx, H - 100);
  drawLayer(0.45, '#0e507a', H - 85, 28, 0.009, 14, 0.023);

  // Fish schools far away
  ctx.fillStyle = 'rgba(5,30,60,0.35)';
  for (const f of bgFish) {
    for (let k = 0; k < 4; k++) {
      ctx.save(); ctx.translate(f.x + k * 14, f.y + (k % 2) * 8); ctx.scale(-f.size, f.size);
      ctx.beginPath(); ctx.ellipse(0, 0, 7, 3, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(-11, -4); ctx.lineTo(-11, 4); ctx.fill();
      ctx.restore();
    }
  }
  drawGround();
}

// Attack submarine (Rubis-class look), side view facing right, fitting a 36x16 box at (x, y).
// `accent` is a small marking on the sail; `hull` is the main paint.
function drawShip(x, y, accent, dbl, scale = 1, flip = false, hull = '#1a1d21') { // Suffren-class (Barracuda) attack sub
  ctx.save();
  if (flip) { ctx.translate(x + 36 * scale, y); ctx.scale(-scale, scale); } else { ctx.translate(x, y); ctx.scale(scale, scale); }
  const dark = shade(hull, -0.5), light = shade(hull, 0.35);
  // Very long slim hull (about 9x longer than tall): the stern reaches a bit behind the 36 px box

  // X-shaped rudders: seen from the side, two swept fins angled up and down
  ctx.fillStyle = dark;
  ctx.beginPath(); ctx.moveTo(5, 10); ctx.lineTo(1, 7.4); ctx.lineTo(0, 7.8); ctx.lineTo(1.5, 10.6); ctx.fill();    // upper fins
  ctx.beginPath(); ctx.moveTo(5, 12.6); ctx.lineTo(1, 15.2); ctx.lineTo(0, 14.8); ctx.lineTo(1.5, 12); ctx.fill();   // lower fins

  // Sail: set well forward, with a curved fillet blending into the hull, no sail planes
  ctx.fillStyle = '#555c63'; ctx.fillRect(26, 2.6, 0.6, 2.6); ctx.fillRect(24.8, 3.4, 0.45, 1.8); ctx.fillRect(23.8, 4, 0.45, 1.2); // masts
  const sg = ctx.createLinearGradient(0, 5, 0, 9.4);
  sg.addColorStop(0, light); sg.addColorStop(1, hull);
  ctx.fillStyle = sg;
  ctx.beginPath();
  ctx.moveTo(21, 9.4); ctx.quadraticCurveTo(22.8, 9, 23, 7);       // rear edge, swept
  ctx.lineTo(23.2, 5.6); ctx.quadraticCurveTo(23.4, 5, 24, 5);
  ctx.lineTo(27.3, 5); ctx.quadraticCurveTo(27.8, 5, 27.85, 5.6);
  ctx.lineTo(28, 8); ctx.quadraticCurveTo(28.3, 9.1, 30.5, 9.4); // vertical leading edge + fillet
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(23.9, 5.4, 3.6, 0.3);                               // bridge edge
  ctx.fillStyle = accent; ctx.fillRect(24.4, 6.8, 2.2, 0.8);                                                  // marking

  // Pressure hull: long cylinder, round bow, long tapering stern cone
  const g = ctx.createLinearGradient(0, 9, 0, 13.6);
  g.addColorStop(0, light); g.addColorStop(0.25, hull); g.addColorStop(1, dark);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-1, 10.6);
  ctx.bezierCurveTo(5, 9.6, 9, 9, 15, 9);
  ctx.lineTo(33, 9);
  ctx.bezierCurveTo(36.4, 9, 36.4, 13.6, 33, 13.6);
  ctx.lineTo(15, 13.6);
  ctx.bezierCurveTo(9, 13.6, 5, 13, -1, 12);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 0.3;                                           // anechoic tile seams
  ctx.beginPath(); ctx.moveTo(12, 9.6); ctx.lineTo(33, 9.6);
  for (const sx of [12, 18, 31]) { ctx.moveTo(sx, 9.2); ctx.lineTo(sx, 13.4); }
  ctx.stroke();
  ctx.fillStyle = dark; ctx.fillRect(33, 12, 2, 0.5);                                                         // retractable bow plane
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(15, 12.6, 14, 0.4);                                        // flank sonar array

  // Bow torpedo tubes glow when double torpedo is active
  if (dbl) { ctx.fillStyle = T % 20 < 10 ? '#ffd23f' : '#ff8c1a'; ctx.beginPath(); ctx.arc(34.6, 10.5, 0.7, 0, 7); ctx.arc(34.6, 12.2, 0.7, 0, 7); ctx.fill(); }

  // Pump-jet: shrouded duct instead of a bare propeller, with a faint spinning glint inside
  ctx.fillStyle = shade(hull, -0.3);
  ctx.beginPath(); ctx.moveTo(-0.6, 10.4); ctx.lineTo(-3.6, 10.6); ctx.lineTo(-3.6, 12); ctx.lineTo(-0.6, 12.2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(150,160,170,' + (0.25 + 0.25 * Math.abs(Math.sin(T * 0.4))) + ')'; ctx.fillRect(-3.9, 10.8, 0.5, 1);
  ctx.restore();
}

function drawWarnLight(x, y, th) { // threat light on the sail: green = clear, orange = something aimed at us, red = close
  const red = th < WARN_RED, col = th === Infinity ? '#4cff5a' : red ? '#ff2a2a' : '#ffa31a';
  const on = th === Infinity || player.beepT > 3; // blinks with the beep

  ctx.globalAlpha = on ? (red ? 0.55 : 0.35) : 0.1; ctx.fillStyle = col;

  ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(x - 0.9, y - 0.9, 0.7, 0.7); // shine
}

function drawCIWS(x, y, k, a) { // Phalanx CIWS popping out of the deck: white radar dome over a gatling gun

  const py = y + 12 - 16 * k; // pivot
  ctx.fillStyle = '#7d858d'; ctx.fillRect(x - 3, py, 6, y + 1 - py); // pedestal
  ctx.fillStyle = '#5f666d'; ctx.fillRect(x - 3, py + 2, 6, 0.8);
  ctx.translate(x, py);
  const face = Math.cos(a) < 0 ? -1 : 1; ctx.scale(face, 1); ctx.rotate(Math.atan2(Math.sin(a), Math.abs(Math.cos(a))));
  ctx.fillStyle = '#9aa2a9'; ctx.fillRect(-6.5, -1, 4, 5);          // ammo drum behind
  ctx.fillStyle = '#c9ced3'; ctx.fillRect(-3, -2, 9, 5);            // gun cradle
  ctx.fillStyle = '#2e3236'; ctx.fillRect(6, -0.2, 10, 2.4);        // six barrels in a cluster

  }
  ctx.fillStyle = GR.ciws;                                          // radar dome: a cylinder with a round top
  ctx.fillRect(-4.6, -6.5, 9.2, 4.6);
  ctx.beginPath(); ctx.ellipse(0, -6.5, 4.6, 5, 0, Math.PI, 0); ctx.fill();

  ctx.fillStyle = '#30353a'; ctx.fillRect(3.2, -5, 1.6, 2.2);       // tracking radar window
  ctx.restore();
}

function drawTorpedo(t, enemy) { // heavyweight torpedo: ogive nose, cylinder, tail cone, cross fins, pump-jet
  const L = t.w, R = t.h / 2, cx = t.x + L / 2, tail = -L / 2, cone = tail + L * 0.2, nose = L / 2, ogive = nose - R * 1.6;
  ctx.save(); ctx.translate(cx, t.y + R);
  if (t.a) ctx.rotate(t.a);
  if (enemy) ctx.scale(-1, 1); // drawn nose toward +x, enemy ones point left
  const k = (enemy ? 'torpE' : 'torpP') + t.h; // gradient in local space, so it can be cached
  if (!GR[k]) {
    GR[k] = ctx.createLinearGradient(0, -R, 0, R);
    const c = enemy ? ['#b4bac0', '#6b7178', '#2f3337'] : ['#4a5058', '#1c1f23', '#07080a'];
    GR[k].addColorStop(0, c[0]); GR[k].addColorStop(0.45, c[1]); GR[k].addColorStop(1, c[2]);
  }
  ctx.fillStyle = enemy ? '#4a4f55' : '#0b0c0e'; // top and bottom fins, swept back
  for (const sy of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(cone, sy * R * 0.7); ctx.lineTo(tail + 1.6, sy * (R + 1.2)); ctx.lineTo(tail + 0.3, sy * (R + 1.2)); ctx.lineTo(tail + 0.3, sy * R * 0.4); ctx.fill();
  }
  ctx.fillStyle = GR[k]; // body
  ctx.beginPath(); ctx.moveTo(tail + 0.4, -R * 0.45); ctx.lineTo(cone, -R); ctx.lineTo(ogive, -R);
  ctx.quadraticCurveTo(nose, -R, nose, 0); ctx.quadraticCurveTo(nose, R, ogive, R);
  ctx.lineTo(cone, R); ctx.lineTo(tail + 0.4, R * 0.45); ctx.fill();
  const head = nose - L * 0.24; // warhead section
  if (enemy) {
    ctx.fillStyle = '#c62828';
    ctx.beginPath(); ctx.moveTo(head, -R); ctx.lineTo(ogive, -R); ctx.quadraticCurveTo(nose, -R, nose, 0); ctx.quadraticCurveTo(nose, R, ogive, R); ctx.lineTo(head, R); ctx.fill();
    ctx.fillStyle = '#ffd23f'; ctx.fillRect(head - 1, -R, 0.7, R * 2);               // hazard band
  }
  ctx.fillStyle = enemy ? 'rgba(0,0,0,0.4)' : 'rgba(150,165,180,0.18)'; // section joints
  ctx.fillRect(head, -R, 0.4, R * 2); ctx.fillRect(cone + L * 0.22, -R, 0.4, R * 2);
  ctx.fillStyle = enemy ? 'rgba(255,255,255,0.35)' : 'rgba(150,165,180,0.22)'; ctx.fillRect(cone, -R * 0.7, ogive - cone, R * 0.28); // shine
  ctx.fillStyle = enemy ? '#2a2d31' : '#050506'; ctx.fillRect(tail - 1.2, -R * 0.6, 1.6, R * 1.2); // pump-jet duct
  ctx.fillStyle = 'rgba(200,210,220,0.45)'; ctx.fillRect(tail - 1, Math.sin(T * 0.9 + cx) * R * 0.45 - 0.25, 1.2, 0.5); // spinning rotor
  ctx.restore();
}
function drawDecoy(d) { // small yellow sonar lure with a blinking light
  ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(Math.sin(T * 0.1 + d.vy) * 0.3);
  ctx.fillStyle = '#ffb300'; ctx.fillRect(-5, -2.5, 10, 5);
  ctx.fillStyle = '#5a3d00'; ctx.fillRect(-5, -2.5, 2, 5); ctx.fillRect(3, -2.5, 2, 5);
  ctx.fillStyle = T % 20 < 10 ? '#fff' : '#ffe08a'; ctx.beginPath(); ctx.arc(0, -3.5, 1.5, 0, 7); ctx.fill();
  ctx.restore();
}
function drawCharge(s) { // depth charge barrel
  ctx.save(); ctx.translate(s.x + 5, s.y + 7); ctx.rotate(Math.sin(s.y * 0.05) * 0.3);
  ctx.fillStyle = '#3a3a3a'; ctx.fillRect(-5, -7, 10, 14);

  ctx.fillStyle = s.fuse ? (T % 4 < 2 ? '#fff' : '#f33') : T % 16 < 8 ? '#f33' : '#600'; ctx.fillRect(-1.5, -9, 3, 2); // fast white blink = about to blow
  ctx.restore();
}

function drawMine(e) {
  const cx = e.x + 10, cy = e.y + 10, gy = groundY(camX + cx);
  ctx.strokeStyle = '#555'; ctx.lineWidth = 1.5; ctx.setLineDash([3, 2]);
  ctx.beginPath(); ctx.moveTo(cx, cy + 9); ctx.lineTo(cx, gy); ctx.stroke(); ctx.setLineDash([]); // chain
  ctx.fillStyle = '#333';
  for (let i = 0; i < 8; i++) {
    const an = i * Math.PI / 4;
    ctx.beginPath(); ctx.arc(cx + Math.cos(an) * 11, cy + Math.sin(an) * 11, 2.5, 0, 7); ctx.fill();
  }
  const g = ctx.createRadialGradient(cx - 3, cy - 3, 1, cx, cy, 10);
  g.addColorStop(0, '#999'); g.addColorStop(1, '#1a1a1a');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, 10, 0, 7); ctx.fill();
  ctx.fillStyle = e.fuse ? (T % 4 < 2 ? '#fff' : '#f33') : T % 30 < 15 ? '#f33' : '#600'; ctx.beginPath(); ctx.arc(cx, cy, e.fuse ? 3.5 : 2.5, 0, 7); ctx.fill();
  if (e.burn) { // heated by the laser: glows redder until it blows
    ctx.fillStyle = 'rgba(255,' + (60 + 140 * e.burn / MINE_BURN | 0) + ',0,' + (0.15 + 0.6 * e.burn / MINE_BURN) + ')';
    ctx.beginPath(); ctx.arc(cx, cy, 10, 0, 7); ctx.fill();
  }
}

const OCTO_K = 0.5; // octopus size: art is 34x30 at 1
function drawOcto(e) { // common octopus: mottled red-brown mantle, slit-pupil eyes, tapering arms trailing behind
  ctx.save(); ctx.translate(e.x, e.y); ctx.scale(OCTO_K, OCTO_K); // drawn at half size (owner: 2x smaller)
  const cx = 14, cy = 14;
  ctx.lineCap = 'round';
  for (let i = 0; i < 6; i++) { // arms: thick at the base, thin at the tip, curling as it swims
    const ly = cy + 3 + i * 2.6, w = Math.sin(e.t * 4 + i) * 5, ex = cx + 26 + i * 1.5, ey = ly + w * 0.6 + 3;
    for (const [lw, col] of [[4.5, '#7a3a2c'], [2.2, '#9a5240']]) {
      ctx.strokeStyle = col; ctx.lineWidth = lw * (i % 2 ? 0.85 : 1);
      ctx.beginPath(); ctx.moveTo(cx + 2, ly); ctx.quadraticCurveTo(cx + 14, ly + w, ex, ey); ctx.stroke();
    }
    ctx.strokeStyle = '#7a3a2c'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(ex, ey); ctx.quadraticCurveTo(ex + 4, ey - 2 * Math.sign(w || 1), ex + 3, ey - 4); ctx.stroke(); // curled tip
  }
  ctx.fillStyle = 'rgba(240,210,190,0.55)'; for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(cx + 8 + i * 4, cy + 9 + i * 1.2, 0.9, 0, 7); ctx.fill(); } // suckers
  if (!GR.octo) {
    GR.octo = ctx.createRadialGradient(cx + 4, cy - 6, 1, cx + 6, cy - 3, 14);
    GR.octo.addColorStop(0, '#c07a5e'); GR.octo.addColorStop(0.6, '#9a5240'); GR.octo.addColorStop(1, '#6a2e22');
  }
  ctx.fillStyle = GR.octo; // mantle, swept back above the arms
  ctx.beginPath(); ctx.ellipse(cx + 7, cy - 5, 12, 8, -0.45, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx, cy + 2, 8, 6.5, 0, 0, 7); ctx.fill(); // head
  ctx.fillStyle = 'rgba(60,20,14,0.35)'; // mottling
  ctx.beginPath(); ctx.arc(cx + 6, cy - 8, 1.6, 0, 7); ctx.arc(cx + 11, cy - 4, 1.2, 0, 7); ctx.arc(cx + 2, cy - 3, 1.1, 0, 7); ctx.arc(cx + 14, cy - 9, 1, 0, 7); ctx.fill();
  ctx.fillStyle = '#e8d08a'; ctx.beginPath(); ctx.ellipse(cx - 3, cy, 2.4, 2, 0, 0, 7); ctx.fill(); // eye
  ctx.fillStyle = '#111'; ctx.fillRect(cx - 4.8, cy - 0.4, 3.6, 0.9);                        // slit pupil
  ctx.restore();
}

function drawEel(e) { // electric eel, head on the left, glowing spots along its side
  const n = 18, x0 = e.x + 8, len = 66, cy = e.y + 8, ph = e.t * 7;
  const px = i => x0 + i / n * len, py = i => cy + Math.sin(ph - i / n * 5) * (1 + i / n * 4), wd = i => 11 * (1 - i / n * 0.75);
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#a08a50'; ctx.lineWidth = 2; ctx.beginPath(); // long belly fin
  for (let i = 2; i <= n; i++) ctx[i === 2 ? 'moveTo' : 'lineTo'](px(i), py(i) + wd(i) / 2 + 1 + Math.sin(ph * 2 + i) * 0.8);
  ctx.stroke();
  for (let i = 0; i < n; i++) { // tapering body
    ctx.strokeStyle = e.spent ? '#3a3824' : '#4e4b2c'; ctx.lineWidth = wd(i);
    ctx.beginPath(); ctx.moveTo(px(i), py(i)); ctx.lineTo(px(i + 1), py(i + 1)); ctx.stroke();
    ctx.strokeStyle = '#8c7f45'; ctx.lineWidth = wd(i) * 0.35;                       // lighter belly
    ctx.beginPath(); ctx.moveTo(px(i), py(i) + wd(i) * 0.25); ctx.lineTo(px(i + 1), py(i + 1) + wd(i + 1) * 0.25); ctx.stroke();
  }
  const a0 = ctx.globalAlpha;
  ctx.globalAlpha *= e.spent ? 0.15 : e.near ? 0.6 + 0.4 * Math.sin(T * 0.8) : 0.45 + 0.35 * Math.sin(T * 0.15);
  ctx.fillStyle = '#ffe14a';
  for (let i = 3; i < n; i += 2) { ctx.beginPath(); ctx.arc(px(i), py(i) - 1, 1.3, 0, 7); ctx.fill(); }
  ctx.globalAlpha = a0;
  const hx = px(0), hy = py(0);
  ctx.fillStyle = e.spent ? '#3a3824' : '#4e4b2c'; ctx.beginPath(); ctx.ellipse(hx - 2, hy, 8, 5.5, 0, 0, 7); ctx.fill(); // head
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(hx - 5, hy - 2, 1.6, 0, 7); ctx.fill();
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(hx - 5.4, hy - 2, 0.8, 0, 7); ctx.fill();
  ctx.strokeStyle = '#2a2818'; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.moveTo(hx - 9.5, hy + 1); ctx.lineTo(hx - 4, hy + 2); ctx.stroke(); // mouth
  if (e.near && !e.dead && Math.random() < 0.5) { // charged up next to the sub
    const i = Math.floor(rnd(2, n)); ctx.strokeStyle = '#aef'; ctx.lineWidth = 1;
    bolt(px(i), py(i), px(i) + rnd(-12, 12), py(i) + rnd(-14, 14));
  }
}

function drawDiver(e) { // combat swimmer in a black wetsuit with a bomb on the back, head on the left
  const cx = e.x + 22, cy = e.y + 11, kick = Math.sin(e.t * (e.air ? 2 : 12)) * 3;
  ctx.save(); ctx.translate(cx, cy);
  ctx.rotate(e.air ? (e.vy < 0 ? 0.6 : 1.3) * -e.face : Math.max(-0.5, Math.min(0.5, e.vy * 0.4 * e.face))); ctx.scale(e.face > 0 ? -1.5 : 1.5, 1.5);
  ctx.lineCap = 'round'; ctx.strokeStyle = '#15171a'; ctx.lineWidth = 3.2;
  ctx.beginPath(); ctx.moveTo(4, -0.5); ctx.lineTo(12, -1 + kick); ctx.moveTo(4, 0.8); ctx.lineTo(12, 1.5 - kick); ctx.stroke(); // legs
  ctx.fillStyle = '#26292d'; // fins
  for (const k of [-1 + kick, 1.5 - kick]) { ctx.beginPath(); ctx.moveTo(11, k); ctx.lineTo(18, k - 2.5); ctx.lineTo(18, k + 2.5); ctx.fill(); }
  ctx.fillStyle = '#15171a'; ctx.beginPath(); ctx.ellipse(-1, 0, 7.5, 3.6, 0, 0, 7); ctx.fill(); // body
  ctx.lineWidth = 2.2; ctx.beginPath(); ctx.moveTo(-5, 1.5); ctx.lineTo(-13, 3 + kick * 0.3); ctx.stroke(); // arm
  ctx.beginPath(); ctx.arc(-10, -1, 3.4, 0, 7); ctx.fill(); // hooded head
  ctx.fillStyle = '#050607'; ctx.fillRect(-14, -3, 3.4, 3); ctx.fillStyle = '#2c4a5a'; ctx.fillRect(-13.6, -2.6, 2.6, 2.2); // dark tactical mask
  ctx.fillStyle = '#3a3f45'; ctx.fillRect(-6, -4.2, 5, 1.4); // rebreather
  if (e.bomb) {

  }
  ctx.restore();
}
