function drawRampart(x, y, a, kick) { // Naval Group Rampart: turret with 4 boxy modules, tube grid on the front face
  ctx.fillStyle = '#8e969d'; // pedestal
  ctx.beginPath(); ctx.moveTo(x - 5, y + 4); ctx.lineTo(x - 3.5, y + 0.5); ctx.lineTo(x + 3.5, y + 0.5); ctx.lineTo(x + 5, y + 4); ctx.fill();
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); if (Math.cos(a) < 0) ctx.scale(1, -1); // sensor stays on top
  ctx.translate(-kick * 0.25, 0); // recoil
  ctx.fillStyle = '#aab2b8'; ctx.fillRect(-5, -4.5, 10, 9);                         // module block
  ctx.fillStyle = '#c3c9ce'; ctx.fillRect(-5, -4.5, 10, 1);                         // lit top edge
  ctx.fillStyle = '#7d858c'; ctx.fillRect(-5, -0.3, 10, 0.6); ctx.fillRect(-0.3, -4.5, 0.6, 9); // seams between the modules
  ctx.fillStyle = '#5c646c'; ctx.fillRect(4, -4.5, 1.6, 9);                         // front face
  ctx.fillStyle = '#1e2226'; for (const ty of [-3.4, -1.6, 0.8, 2.6]) ctx.fillRect(4.6, ty, 1, 1); // tube mouths
  ctx.fillStyle = '#3a4048'; ctx.fillRect(-2.5, -6.5, 4.5, 2);                      // electro-optical sensor
  ctx.fillStyle = T % 40 < 20 ? '#ff5a3a' : '#a33'; ctx.fillRect(1.2, -6.1, 1, 1.2); // laser designator
  ctx.restore();
}

function drawCM(s) { // enemy sub decoy: dark red canister with a blinking light
  ctx.save(); ctx.translate(s.x + 3, s.y + 3); ctx.rotate(Math.sin(T * 0.1 + s.vx) * 0.3);
  ctx.fillStyle = '#8a1c1c'; ctx.fillRect(-5, -2.5, 10, 5);
  ctx.fillStyle = '#3a0a0a'; ctx.fillRect(-5, -2.5, 2, 5); ctx.fillRect(3, -2.5, 2, 5);
  ctx.fillStyle = T % 20 < 10 ? '#ff5050' : '#ffd0d0'; ctx.beginPath(); ctx.arc(0, -3.5, 1.5, 0, 7); ctx.fill();
  ctx.restore();
}
function drawBoss(e) { // Typhoon-class sub: our hull art at scale 5, flipped, with hatches and a bow laser
  drawShip(e.x, e.y - 42, '#c62828', false, 5, true, e.hull);
  ctx.fillStyle = '#15181b'; ctx.fillRect(e.x + 45, e.y - 18, 10, 2); ctx.fillRect(e.x + 95, e.y + 25, 10, 2); // rocket hatches: sail and keel
  const lz = e.lzAim > 0 || e.lzBeam > 0;
  ctx.fillStyle = lz ? (T % 6 < 3 ? '#ff3a30' : '#ffd0d0') : '#5a1010'; ctx.beginPath(); ctx.arc(e.x - 1, e.y + 14, lz ? 2.6 : 1.8, 0, 7); ctx.fill(); // laser emitter
}
function drawShkval(s) { // boss rocket-torpedo: blunt cavitator nose, dark body, red band, flame inside its gas bubble
  ctx.save(); ctx.translate(s.x + s.w / 2, s.y + s.h / 2); ctx.rotate(s.a);
  if (!s.boost) { ctx.fillStyle = 'rgba(220,240,255,0.2)'; ctx.beginPath(); ctx.ellipse(-1, 0, 10, 3.6, 0, 0, 7); ctx.fill(); } // cavitation bubble
  ctx.fillStyle = '#3a3f45'; ctx.fillRect(-6, -1.5, 11, 3);
  ctx.fillStyle = '#9aa2a9'; ctx.fillRect(5, -1.8, 1.2, 3.6);   // cavitator disk
  ctx.fillStyle = '#c62828'; ctx.fillRect(1, -1.5, 1, 3);       // warhead band
  ctx.fillStyle = '#2b2f33'; ctx.fillRect(-6, -2.6, 1.6, 5.2);  // fins
  if (!s.boost) { ctx.fillStyle = T % 4 < 2 ? '#fff6c8' : '#ffb347'; ctx.beginPath(); ctx.moveTo(-6, -1); ctx.lineTo(-10 - Math.random() * 3, 0); ctx.lineTo(-6, 1); ctx.fill(); }
  ctx.restore();
}
function drawBubbleWall(s) { // boss bubble screen: a pale cloud, the bubbles are particles
  ctx.globalAlpha = 0.18 * Math.min(1, s.life / 30); ctx.fillStyle = '#dff6ff';
  ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
}
function drawSAM(s) { // Rampart air/air missile: slim white dart with a red nose
  ctx.save(); ctx.translate(s.x + s.w / 2, s.y + s.h / 2); ctx.rotate(s.a);
  ctx.fillStyle = '#eef1f3'; ctx.fillRect(-4, -0.8, 7, 1.6);
  ctx.fillStyle = '#c62828'; ctx.beginPath(); ctx.moveTo(3, -0.8); ctx.lineTo(5, 0); ctx.lineTo(3, 0.8); ctx.fill();
  ctx.fillStyle = '#9aa2a9'; ctx.fillRect(-4, -2, 1.5, 4);                          // tail fins
  ctx.fillStyle = '#ffd23f'; ctx.fillRect(-5.2, -0.6, 1.2, 1.2);                    // motor
  ctx.restore();
}

function drawASM(s) { // anti-ship missile, nose first: ogive nose, cruciform wings, tail fins, motor glow
  ctx.save(); ctx.translate(s.x + s.w / 2, s.y + s.h / 2); ctx.rotate(s.a);
  ctx.fillStyle = '#7d858d';
  ctx.beginPath(); ctx.moveTo(-1, -1.2); ctx.lineTo(-3.5, -3.6); ctx.lineTo(-5, -3.6); ctx.lineTo(-4, -1.2); ctx.fill();        // wing
  ctx.beginPath(); ctx.moveTo(-1, 1.2); ctx.lineTo(-3.5, 3.6); ctx.lineTo(-5, 3.6); ctx.lineTo(-4, 1.2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-5.5, -1.2); ctx.lineTo(-7, -2.8); ctx.lineTo(-7.5, -1.2); ctx.moveTo(-5.5, 1.2); ctx.lineTo(-7, 2.8); ctx.lineTo(-7.5, 1.2); ctx.fill(); // tail fins
  ctx.fillStyle = '#e4e8eb'; ctx.fillRect(-7, -1.3, 11, 2.6);                                                                    // body
  ctx.fillStyle = '#b9c0c6'; ctx.fillRect(-7, 0.4, 11, 0.9);
  ctx.fillStyle = '#3a3f45'; ctx.beginPath(); ctx.moveTo(4, -1.3); ctx.quadraticCurveTo(7.5, -1, 7.5, 0); ctx.quadraticCurveTo(7.5, 1, 4, 1.3); ctx.fill(); // radar nose
  ctx.fillStyle = '#c62828'; ctx.fillRect(2.5, -1.3, 0.9, 2.6);                                                                  // warhead band
  ctx.fillStyle = T % 4 < 2 ? '#fff6c8' : '#ffd23f'; ctx.beginPath(); ctx.arc(-7.5, 0, 1.4, 0, 7); ctx.fill();                   // motor
  ctx.restore();
}

function drawHeli(e) { // naval helicopter (NH90 / Caiman style), navy gray, facing left, in local space
  ctx.save(); ctx.translate(e.x, e.y);
  if (!GR.heli) {
    GR.heli = ctx.createLinearGradient(0, 4, 0, 22);
    GR.heli.addColorStop(0, '#a7afb6'); GR.heli.addColorStop(0.45, '#7f878f'); GR.heli.addColorStop(1, '#4b5258');
  }
  ctx.fillStyle = '#6c747b'; // tail boom, tapering up to the fin
  ctx.beginPath(); ctx.moveTo(34, 9); ctx.lineTo(56, 8); ctx.lineTo(56, 11); ctx.lineTo(34, 16); ctx.fill();
  ctx.beginPath(); ctx.moveTo(52, 9); ctx.lineTo(57, 0.5); ctx.lineTo(61, 0.5); ctx.lineTo(60, 11); ctx.lineTo(55, 11); ctx.fill(); // swept fin
  ctx.fillStyle = '#5a6168'; ctx.fillRect(49, 11, 9, 1.5);                         // stabilizer
  ctx.fillStyle = 'rgba(190,196,202,0.55)'; // tail rotor disc and blade
  ctx.beginPath(); ctx.ellipse(61.5, 5, 1.2, 5, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#3a3f45'; const tb = Math.sin(T * 0.9) * 5; ctx.fillRect(61, 5 - Math.abs(tb), 1, Math.abs(tb) * 2);
  ctx.fillStyle = GR.heli; // fuselage: rounded nose, deep cabin, rear ramp sloping into the boom
  ctx.beginPath(); ctx.moveTo(3, 15); ctx.quadraticCurveTo(2, 8, 9, 6); ctx.lineTo(30, 5); ctx.quadraticCurveTo(36, 6, 38, 9);
  ctx.lineTo(36, 16); ctx.lineTo(30, 21); ctx.lineTo(9, 21); ctx.quadraticCurveTo(3, 20, 3, 15); ctx.fill();
  ctx.fillStyle = '#8d959c'; ctx.beginPath(); ctx.moveTo(13, 5.5); ctx.lineTo(15, 2.5); ctx.lineTo(31, 2.5); ctx.lineTo(34, 6); ctx.fill(); // engine housing
  ctx.fillStyle = '#2b3036'; ctx.fillRect(29, 3.2, 3, 1.6);                        // exhaust
  ctx.fillStyle = '#1f2a33'; // cockpit glass, tinted, with a glint
  ctx.beginPath(); ctx.moveTo(4, 12); ctx.quadraticCurveTo(5, 7.5, 10, 7); ctx.lineTo(13, 7); ctx.lineTo(12, 12); ctx.fill();
  ctx.fillStyle = 'rgba(200,230,255,0.35)'; ctx.fillRect(7, 8, 3, 1);
  ctx.fillStyle = '#25292e'; ctx.fillRect(15, 8, 3, 3); ctx.fillRect(20, 8, 3, 3); // cabin windows
  ctx.strokeStyle = '#555c63'; ctx.lineWidth = 0.6; ctx.strokeRect(14, 7.5, 11, 11); // sliding door
  ctx.fillStyle = '#5a6168'; ctx.beginPath(); ctx.ellipse(21, 20.5, 6, 2, 0, 0, 7); ctx.fill(); // sponson
  ctx.fillStyle = '#6c747b'; ctx.beginPath(); ctx.ellipse(6, 19, 3, 2, 0, 0, 7); ctx.fill(); // chin radome
  ctx.fillStyle = '#1b1d20'; // wheels
  ctx.beginPath(); ctx.arc(8, 23.5, 1.6, 0, 7); ctx.arc(22, 23.5, 1.8, 0, 7); ctx.fill();
  ctx.fillStyle = '#3a3f45'; ctx.fillRect(7.5, 21, 1, 2); ctx.fillRect(21.5, 21.5, 1, 2);
  ctx.fillStyle = T % 40 < 6 ? '#ff3030' : '#601010'; ctx.fillRect(58, 0, 1.5, 1.5); // anti-collision light
  ctx.fillStyle = '#2b3036'; ctx.fillRect(21, 0, 2, 3);                            // rotor mast
  ctx.fillStyle = '#3a3f45'; ctx.fillRect(19.5, -0.5, 5, 1.5);                     // hub
  if (e.parked) { ctx.fillStyle = '#3a3f45'; ctx.fillRect(4, -0.2, 36, 1); }       // blades folded back
  else {
    ctx.fillStyle = 'rgba(150,156,162,0.25)'; ctx.beginPath(); ctx.ellipse(22, 0, 32, 1.6, 0, 0, 7); ctx.fill(); // blur disc
    ctx.fillStyle = 'rgba(40,44,48,0.85)'; // two blades, foreshortened as they turn
    for (const ph of [0, Math.PI / 2]) { const c = Math.cos(T * 0.5 + ph) * 31; ctx.fillRect(22 + Math.min(0, c), -0.4, Math.abs(c), 1.3); ctx.fillRect(22 - Math.max(0, c), -0.4, Math.abs(c), 1.3); }
  }
  ctx.restore();
}

function drawDrone(e) { // military quadcopter, gray carbon frame, gimbal camera and laser under the body
  const x = e.x, y = e.y;
  if (!e.dead && e.beam > 0) drawLaser({ x1: x + 12, y1: y + 12, x2: e.lx, y2: e.ly, hit: e.beamHit, green: e.mine });
  else if (!e.dead && e.aim > 0 && T % 6 < 4) { // aiming line
    ctx.strokeStyle = e.mine ? 'rgba(60,255,110,0.7)' : e.aim < DRONE_LOCK ? 'rgba(255,40,40,0.8)' : 'rgba(255,60,60,0.4)'; ctx.lineWidth = 0.7;
    ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(x + 12, y + 12); ctx.lineTo(e.tx, e.ty); ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = '#4d545a'; ctx.fillRect(8, 3.5, 16, 1.2);                        // rear arms (behind)
  ctx.fillRect(7, 2, 2, 2.5); ctx.fillRect(23, 2, 2, 2.5);
  ctx.fillStyle = '#6a7279'; ctx.fillRect(3, 4.5, 26, 1.6);                        // front arms
  ctx.fillStyle = '#3a3f45'; for (const mx of [2, 27]) ctx.fillRect(mx, 2.6, 3, 3); // motors
  ctx.fillStyle = 'rgba(170,176,182,0.45)'; // propeller blur
  for (const px of [3.5, 28.5, 8, 24]) { ctx.beginPath(); ctx.ellipse(px, 2, px === 8 || px === 24 ? 5 : 6.5, 0.9, 0, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#2b3036'; for (const px of [3.5, 28.5]) { const b = Math.sin(T * 1.3 + px) * 6; ctx.fillRect(px - Math.abs(b), 1.6, Math.abs(b) * 2, 0.8); }
  if (!GR.drone) {
    GR.drone = ctx.createLinearGradient(0, 3, 0, 11);
    GR.drone.addColorStop(0, '#b4bbc2'); GR.drone.addColorStop(0.5, '#868e96'); GR.drone.addColorStop(1, '#565d64');
  }
  if (!GR.droneMine) {
    GR.droneMine = ctx.createLinearGradient(0, 3, 0, 11);
    GR.droneMine.addColorStop(0, '#5e656c'); GR.droneMine.addColorStop(0.5, '#3a3f45'); GR.droneMine.addColorStop(1, '#1e2125');
  }
  ctx.fillStyle = e.mine ? GR.droneMine : GR.drone; // central body (ours: dark gray)
  ctx.beginPath(); ctx.moveTo(9, 9); ctx.lineTo(8, 5.5); ctx.quadraticCurveTo(16, 2, 24, 5.5); ctx.lineTo(23, 9); ctx.quadraticCurveTo(16, 10.5, 9, 9); ctx.fill();
  ctx.fillStyle = '#d5dade'; ctx.fillRect(14.5, 3, 3, 1);                          // GPS puck
  ctx.fillStyle = '#2b3036'; ctx.fillRect(21, 0, 0.7, 4);                          // antenna
  ctx.strokeStyle = '#3a3f45'; ctx.lineWidth = 0.8; // landing legs
  ctx.beginPath(); ctx.moveTo(10, 9); ctx.lineTo(8, 13.5); ctx.moveTo(22, 9); ctx.lineTo(24, 13.5); ctx.moveTo(6.5, 13.5); ctx.lineTo(9.5, 13.5); ctx.moveTo(22.5, 13.5); ctx.lineTo(25.5, 13.5); ctx.stroke();
  ctx.fillStyle = '#3a3f45'; ctx.fillRect(11.4, 8.5, 1.2, 1);                      // gimbal mount
  ctx.fillStyle = '#2b3036'; ctx.beginPath(); ctx.arc(12, 11, 2.4, 0, 7); ctx.fill(); // gimbal ball
  ctx.fillStyle = !e.dead && (e.aim > 0 || e.beam > 0) ? (e.mine ? '#3cff6a' : '#ff3333') : (e.mine ? '#1f6b35' : '#4a90b8'); // lens: lit when it aims
  ctx.beginPath(); ctx.arc(11.2, 11.4, 1.1, 0, 7); ctx.fill();
  ctx.fillStyle = e.mine ? (T % 20 < 10 ? '#3cff6a' : '#0a4a1a') : (T % 20 < 10 ? '#ff3333' : '#600'); ctx.fillRect(19.5, 6, 1.2, 1.2); // status light
  if (e.mine) { ctx.fillStyle = T % 30 < 15 ? '#3cff6a' : '#1f6b35'; ctx.fillRect(2.5, 5.6, 1.2, 1.2); ctx.fillRect(28, 5.6, 1.2, 1.2); } // green arm lights
  ctx.restore();
}

function drawHBomb(m) {
  if (m.guided) { // guided: drawn along its heading
    ctx.save(); ctx.translate(m.x + 2.5, m.y + 7); ctx.rotate(m.a + Math.PI / 2); ctx.translate(-m.x - 2.5, -m.y - 7);
    drawHBomb({ x: m.x, y: m.y }); ctx.restore(); return;
  }
  ctx.fillStyle = '#c62828'; ctx.beginPath(); ctx.moveTo(m.x, m.y + 4); ctx.lineTo(m.x + 2.5, m.y - 2); ctx.lineTo(m.x + 5, m.y + 4); ctx.fill(); // nose
  const g = ctx.createLinearGradient(m.x, 0, m.x + 5, 0);
  g.addColorStop(0, '#999'); g.addColorStop(0.5, '#fff'); g.addColorStop(1, '#888');
  ctx.fillStyle = g; ctx.fillRect(m.x, m.y + 4, 5, 10);
  ctx.fillStyle = '#ffd23f'; ctx.fillRect(m.x, m.y + 7, 5, 1.5);                  // hazard band
  ctx.fillStyle = '#555';
  ctx.beginPath(); ctx.moveTo(m.x, m.y + 10); ctx.lineTo(m.x - 3, m.y + 15); ctx.lineTo(m.x, m.y + 14); ctx.fill();
  ctx.beginPath(); ctx.moveTo(m.x + 5, m.y + 10); ctx.lineTo(m.x + 8, m.y + 15); ctx.lineTo(m.x + 5, m.y + 14); ctx.fill();
}

function drawRock(e) {
  const g = ctx.createLinearGradient(e.x, 0, e.x + e.w, 0);
  g.addColorStop(0, '#6d6875'); g.addColorStop(0.5, '#8e8a96'); g.addColorStop(1, '#4a4652');
  ctx.fillStyle = g;
  const n = Math.ceil(e.h / 22);
  for (let i = 0; i < n; i++) { // stacked boulders
    const by = e.y + e.h - i * 22 - 10, bw = e.w / 2 - i * 0.6;
    ctx.beginPath(); ctx.ellipse(e.x + e.w / 2 + (i % 2 ? 3 : -3), by, bw, 14, 0, 0, 7); ctx.fill();
  }
  drawCoral(e.x + e.w / 2, e.y + 6, '#ff6f61', 0.7);
  ctx.fillStyle = 'rgba(80,160,80,0.6)'; ctx.beginPath(); ctx.ellipse(e.x + e.w / 2 - 6, e.y + 10, 8, 4, 0, 0, 7); ctx.fill(); // moss
}

function drawMark(x, y, m, metal) {
  ctx.fillStyle = metal ? 'rgba(25,18,12,0.85)' : 'rgba(60,0,60,0.55)';            // scorch / bruise
  ctx.beginPath(); ctx.arc(x, y, m.r, 0, 7); ctx.fill();
  if (!metal) return;
  ctx.strokeStyle = 'rgba(10,10,10,0.9)'; ctx.lineWidth = 0.8;                      // cracks
  ctx.beginPath();
  for (const an of m.cracks) { ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(an) * m.r * 1.8, y + Math.sin(an) * m.r * 1.8); }
  ctx.stroke();
  ctx.fillStyle = (T + m.seed) % 10 < 5 ? '#ff8c1a' : '#ffd23f';                     // glowing hole
  ctx.beginPath(); ctx.arc(x, y, 1.4, 0, 7); ctx.fill();
}

function drawEnemy(e, extraRot = 0) {
  const n = e.marks ? e.marks.length : 0;
  const tilt = n * (e.type === 'sub' ? -0.07 : e.type === 'boat' ? 0.06 : 0) + extraRot; // damaged: nose down / listing
  ctx.save();
  if (tilt) { const cx = e.x + e.w / 2, cy = e.y + e.h / 2; ctx.translate(cx, cy); ctx.rotate(tilt); ctx.translate(-cx, -cy); }
  if (e.flash) ctx.globalAlpha *= 0.45; // hit flash
  if (e.type === 'mine') drawMine(e);
  else if (e.type === 'octo') drawOcto(e);
  else if (e.type === 'sub') drawShip(e.x, e.y - 4, '#c62828', false, 3, true, '#6b7682');
  else if (e.type === 'boat') drawBoat(e);
  else if (e.type === 'heli') drawHeli(e);
  else if (e.type === 'drone') drawDrone(e);
  else if (e.type === 'beluga') drawBeluga(e);
  else if (e.type === 'diver') drawDiver(e);
  else if (e.type === 'eel') drawEel(e);
  else if (e.type === 'boss') drawBoss(e);
  else drawRock(e);
  for (let i = 0; i < n; i++) drawMark(e.x + e.marks[i].dx, e.y + e.marks[i].dy, e.marks[i], e.type !== 'octo' && e.type !== 'eel');
  ctx.restore();
}

function drawStarfish(cx, cy, R, rot, color) {
  ctx.fillStyle = color; ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? R * 0.45 : R, an = rot + i * Math.PI / 5 - Math.PI / 2;
    ctx.lineTo(cx + Math.cos(an) * r, cy + Math.sin(an) * r);
  }
  ctx.fill();
}

function drawCoin(x, y, spin = 1) {
  const g = ctx.createRadialGradient(x - 2, y - 2, 1, x, y, 7);
  g.addColorStop(0, '#fff6b0'); g.addColorStop(0.5, '#ffd700'); g.addColorStop(1, '#b8860b');
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(x, y, 7 * Math.max(0.15, Math.abs(spin)), 7, 0, 0, Math.PI * 2); ctx.fill();
  if (Math.abs(spin) > 0.5) { ctx.fillStyle = '#b8860b'; ctx.fillRect(x - 1, y - 4, 2, 8); }
}

function drawHeart(x, y) {
  ctx.fillStyle = '#ff4d6d'; ctx.beginPath();
  ctx.arc(x - 3, y, 3.5, Math.PI, 0); ctx.arc(x + 3, y, 3.5, Math.PI, 0); ctx.lineTo(x, y + 8); ctx.closePath(); ctx.fill();
}

function drawParticles() {
  for (const p of particles) {
    const a = p.life / p.max;
    if (p.kind === 'fire') {
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.4 + a * 0.6), 0, 7); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    } else if (p.kind === 'wreck') {
      ctx.globalAlpha = Math.min(1, p.life / 40); drawEnemy(p.e, p.rot);
    } else if (p.kind === 'flash') {
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a; ctx.fillStyle = '#fff6c8';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1 + (1 - a) * 1.5), 0, 7); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    } else if (p.kind === 'spark') {
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a; ctx.strokeStyle = '#ffe08a'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 3, p.y - p.vy * 3); ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    } else if (p.kind === 'debris') {
      ctx.globalAlpha = Math.min(1, a * 2); ctx.fillStyle = p.color;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore();
    } else if (p.kind === 'smoke') {
      ctx.globalAlpha = a * 0.5; ctx.fillStyle = p.color || '#5c6670';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (2 - a), 0, 7); ctx.fill();
    } else if (p.kind === 'ring') {
      ctx.globalAlpha = a; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, (1 - a) * (p.r || 60), 0, 7); ctx.stroke();
    } else if (p.kind === 'drop') {
      ctx.globalAlpha = a; ctx.fillStyle = '#d8f3ff';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7); ctx.fill();
    } else {
      ctx.globalAlpha = a * 0.8; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
}

function panel(x, y, w, h, border) {
  ctx.fillStyle = 'rgba(0,25,50,0.65)'; ctx.fillRect(x, y, w, h);
  if (border) { ctx.strokeStyle = border; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h); }
}

function text(str, y, size = 20, color = '#fff', x = W / 2, align = 'center') {
  ctx.font = `bold ${size}px ${FONT}`; ctx.textAlign = align;
  ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillText(str, x + 1, y + 2); // cheap drop shadow
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}

// ---------- Tiny 3D for the welcome screen: flat-shaded meshes, painter's sort, no library ----------
// A mesh is a list of faces { p: [[x, y, z], ...], c: [r, g, b] }; x = length (bow +x), y = up, z = beam.
function box3(f, x0, x1, y0, y1, z0, z1, c) {
  const v = (x, y, z) => [x, y, z];
  f.push({ p: [v(x0, y0, z1), v(x1, y0, z1), v(x1, y1, z1), v(x0, y1, z1)], c }, { p: [v(x0, y0, z0), v(x1, y0, z0), v(x1, y1, z0), v(x0, y1, z0)], c },
         { p: [v(x0, y1, z0), v(x1, y1, z0), v(x1, y1, z1), v(x0, y1, z1)], c }, { p: [v(x0, y0, z0), v(x1, y0, z0), v(x1, y0, z1), v(x0, y0, z1)], c },

function draw3D(mesh, cx, cy, s, yaw, pitch) {
  const cyw = Math.cos(yaw), syw = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  const Lx = -0.45, Ly = 0.75, Lz = -0.5; // light from the upper left, toward the viewer
  V3.length = 0;
  for (const fc of mesh) {
    const q = fc.p.map(([x, y, z]) => { const x1 = x * cyw + z * syw, z1 = -x * syw + z * cyw; return [x1, y * cp - z1 * sp, y * sp + z1 * cp]; });

    let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx; const nl = Math.hypot(nx, ny, nz) || 1;

  }
  V3.sort((u, v) => v.z - u.z); // far faces first
  ctx.lineWidth = 0.6; ctx.lineJoin = 'round';
  for (const v of V3) {
    ctx.fillStyle = ctx.strokeStyle = v.col; ctx.beginPath();
    v.q.forEach(([x, y], n) => ctx[n ? 'lineTo' : 'moveTo'](cx + x * s, cy - y * s));
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}

  }
  if (level >= UNLOCK.decoys) {
  text('D', 84, 13, '#fff', 10, 'left');
  ctx.globalAlpha = decoyCool ? 0.35 : 1; drawDecoy({ x: 30, y: 80, vy: 0 }); drawDecoy({ x: 38, y: 82, vy: 1 }); ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(48, 77, 40, 5); // reload bar
  ctx.fillStyle = decoyCool ? '#ffb300' : '#7CFC00'; ctx.fillRect(48, 77, 40 * (1 - decoyCool / DECOY_COOL), 5);
  }
  if (level >= UNLOCK.drone) {
  text('W', 120, 13, '#fff', 10, 'left');
  ctx.save(); ctx.translate(26, 112); ctx.scale(0.7, 0.7); ctx.globalAlpha = droneAmmo > 0 ? (player.jam ? 0.4 : 1) : 0.25;
  drawDrone({ x: 0, y: 0, mine: true }); ctx.restore(); ctx.globalAlpha = 1;
  }
  if (level >= UNLOCK.bubbles) {
  text('E', 102, 13, '#fff', 10, 'left');
  ctx.strokeStyle = '#dff6ff'; ctx.lineWidth = 1.2;
  for (let i = 0; i < BUBBLE_AMMO; i++) { // bubble screen charges
    ctx.globalAlpha = i < bubbleAmmo ? (bubbleCool && i === bubbleAmmo - 1 ? 0.5 : 1) : 0.2;
    ctx.beginPath(); ctx.arc(30 + i * 11, 98, 4, 0, 7); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.fillRect(28 + i * 11, 95.5, 1.5, 1.5);
  }
  ctx.globalAlpha = 1;
  }
  text('ally in: ' + (10 - kills % 10) + ' kills', 44, 12, '#fff', W - 10, 'right');
  // Level progress bar
  const bx = W / 2 - 120, prog = Math.min(1, dist / levelLen);
  if (boss) { // boss fight: its hp replace the progress bar
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(bx, 9, 240, 10);
    const sw = 238 / boss.max;
    for (let i = 0; i < boss.max; i++) { ctx.fillStyle = i < boss.hp ? (boss.flash ? '#fff' : '#e53935') : 'rgba(255,255,255,0.12)'; ctx.fillRect(bx + 2 + i * sw, 11, sw - 2, 6); }
    text(boss.name, 36, 14, '#ff8a80');
  } else {
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(bx, 10, 240, 8);
  ctx.fillStyle = '#7f7'; ctx.fillRect(bx, 10, 240 * prog, 8);
  drawShip(bx + 240 * prog - 10, 7, ship().color, false, 0.55);
  ctx.fillStyle = '#7a4a1e'; ctx.fillRect(bx + 244, 8, 12, 10); ctx.fillStyle = '#ffd700'; ctx.fillRect(bx + 244, 11, 12, 2);
  text('MISSION ' + level, 36, 14, '#bff');
  }
  if (player.jam > 0) text('WEAPONS OFFLINE  ' + Math.ceil(player.jam / 60) + 's', 74, 14, T % 30 < 15 ? '#7df9ff' : '#fff');
  if (player.double > 0 && !ship().double) text('RAPID RELOAD  ' + Math.ceil(player.double / 60) + 's', 54, 14, '#ffd700');
  if (whiteFlash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + whiteFlash + ')'; ctx.fillRect(-20, -20, W + 40, H + 40); }
  if (dashA > 0.02) { // messages on a dark dashboard strip at the bottom, dark red like an instrument display
    ctx.font = `bold 15px ${FONT}`;
    const a = dashA * dashA * (3 - 2 * dashA), bw = Math.max(240, ctx.measureText(dashMsg).width + 56), bh = 26;
    const bx = W / 2 - bw / 2, by = H - bh - 8 + (1 - a) * 18;
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(12,6,6,0.88)'; ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = dashRed ? '#4a1414' : '#4a2e10'; ctx.lineWidth = 1.5; ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);
    ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fillRect(bx + 2, by + 2, bw - 4, 2); // glass reflection
    ctx.fillStyle = dashRed ? (T % 16 < 8 ? '#ff3a30' : '#5a1010') : (T % 30 < 15 ? '#ff9a1a' : '#5a3410'); ctx.beginPath(); ctx.arc(bx + 14, by + bh / 2, 3, 0, 7); ctx.fill(); // status LED
    ctx.textAlign = 'center'; ctx.fillStyle = dashRed ? '#c8231e' : '#e07a1a'; ctx.fillText(dashMsg, W / 2 + 6, by + 18);
    ctx.globalAlpha = 1;
  }

  if (state === 'pause') drawHelp(true);
  if (state === 'brief') drawBrief();
  if (state === 'over') { panel(0, H / 2 - 45, W, 100); text('SUB LOST - MISSION ' + level + ' FAILED', H / 2, 36, '#ff6b6b'); text('ENTER: redeploy    S: armory', H / 2 + 38, 18); }
  if (state === 'next') { panel(0, H / 2 - 45, W, 100); text('MISSION ' + level + ' ACCOMPLISHED', H / 2, 40, '#7f7'); text('Stand by: next mission, heavier resistance...', H / 2 + 38, 18, '#ffd700'); }
}

// Game logic runs at a fixed 60 steps/second; drawing happens once per screen frame.
// So the game keeps the same speed on 30/60/120 Hz screens and when a frame is slow.
const STEP = 1000 / 60;
let lastTime = 0, acc = 0;
function loop(now) {
  acc += Math.min(100, now - (lastTime || now)); lastTime = now;
  let n = 0;
  while (acc >= STEP && n++ < 5) { update(); acc -= STEP; }
  draw();
  requestAnimationFrame(loop);
}

// Action keys by physical position (e.code), so they sit under the left hand on AZERTY and QWERTY alike:
// S bomb, D decoys, E bubble screen, F laser, SPACE torpedo (W air drone goes by letter); the arrows stay for the right hand
addEventListener('keydown', e => {
  keys[e.code] = true;
  if ([' ', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) e.preventDefault();
  initAudio();
  if (state === 'shop') {
    if (e.key === 'ArrowUp') shopCursor = (shopCursor + SHIPS.length - 1) % SHIPS.length;
    if (e.key === 'ArrowDown') shopCursor = (shopCursor + 1) % SHIPS.length;
    if (e.key === 'Enter') shopSelect();
    if (e.key === 'Escape' || e.code === 'KeyS') state = 'title';
    return;
  }
  if (e.key === 'Escape' && !e.repeat && (state === 'play' || state === 'pause')) { state = state === 'play' ? 'pause' : 'play'; for (const k in keys) keys[k] = false; tone(state === 'pause' ? 600 : 900, 0.08, 'sine', 0.05); return; }
  if (state === 'pause') { if (e.key === 'Enter') state = 'play'; return; }
  if (state === 'brief') { if (e.key === 'Enter') state = 'play'; return; }
  if (state === 'play' && player.jam && !e.repeat && (['Space', 'KeyF', 'KeyS'].includes(e.code) || e.key.toLowerCase() === 'w')) sfx.denied();
  if (e.key.toLowerCase() === 'w' && state === 'play') { if (!e.repeat) launchDrone(); return; } // by letter: W is bottom left on AZERTY
  if (e.code === 'KeyS' && state === 'play') { if (!e.repeat) fireHBomb(); return; }
  if (e.code === 'KeyD' && state === 'play') { if (!e.repeat) throwDecoys(); return; }
  if (e.code === 'KeyE' && state === 'play') { if (!e.repeat) bubbleBurst(); return; }
  if (e.code === 'KeyS' && (state === 'title' || state === 'over')) { state = 'shop'; shopCursor = shipIdx; shopMsg = ''; return; }
  if (e.key === 'Enter' && (state === 'title' || state === 'over')) { reset(); state = 'play'; }
});
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('blur', () => { for (const k in keys) keys[k] = false; }); // no stuck keys after alt-tab

requestAnimationFrame(loop);
</script>
