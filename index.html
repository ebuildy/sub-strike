      else if (s.y + s.h > groundY(camX + s.x)) { s.dead = true; boom(s.x, s.y, false); }
    }
    else if (s.type === 'shell') { // ballistic in the air, slowed down by the water
      s.x += s.vx; s.y += s.vy;
      if (!s.wet && s.y > SURFACE) {
        s.wet = true; s.vx *= 0.5; s.vy *= 0.5; noise(0.12, 0.06);
        for (let i = 0; i < 5; i++) particles.push({ kind: 'drop', x: s.x, y: SURFACE, vx: rnd(-1, 1), vy: rnd(-2.5, -1), life: 30, max: 30, size: rnd(1, 2) });
      }
      if (s.wet) { s.vx *= 0.995; s.vy = s.vy * 0.995 + 0.01; if (T % 4 === 0) particles.push({ kind: 'bubble', x: s.x + 3, y: s.y + 1, vx: 0, vy: -0.4, life: 30, max: 30, size: 1 }); }
      else s.vy += 0.05;
      if (s.y + s.h > groundY(camX + s.x)) { s.dead = true; boom(s.x, s.y, false); }
      else if (--s.life <= 0) s.dead = true;
    }
    else {
      const d = s.y > SURFACE && decoyNear(s.x + 5, s.y + 7);
      if (d) { const dx = d.x - s.x - 5, dy = d.y - s.y - 7, dd = Math.hypot(dx, dy) || 1, v = Math.max(0.8, s.vy); s.x += dx / dd * v; s.y += dy / dd * v; }
      else { s.y += s.y < SURFACE ? 1.4 : s.vy; s.x -= scroll * 0.4; s.x += Math.sin(s.y * 0.05) * 0.3; }
    }
    if (s.type === 'charge' && s.y + s.h > groundY(camX + s.x)) { s.dead = true; boom(s.x + 5, s.y + 7, false); }
    if (s.type === 'charge' && !s.dead && s.y > SURFACE && proximityFuse(s, s.x + 5, s.y + 7)) continue;
    if (!s.dead && hit(s, playerBox())) { s.dead = true; damagePlayer(); }
    for (let i = allies - 1; i >= 0; i--) if (!s.dead && hit(s, allyBox(i))) { s.dead = true; allies--; boom(allyBox(i).x + 28, allyBox(i).y + 12); }
    for (const t of torps) if (!s.dead && !t.dead && hit(s, t)) { s.dead = t.dead = true; boom(s.x, s.y, false); score += 5; }
  }
  eShots = eShots.filter(s => !s.dead && s.x > -30 && s.x < W + 30 && s.y < H);

  // H-bomb: rises slowly underwater, then rockets into the sky
  for (const m of missiles) {
    m.vy = Math.max(m.under ? -1.6 : -4.5, m.vy - (m.under ? 0.03 : 0.12));
    m.y += m.vy; m.x += 0.2;
    if (m.under && m.y < SURFACE) { // splash out of the water
      m.under = false; sfx.ignite(m.x);
      for (let i = 0; i < 20; i++) particles.push({ kind: 'drop', x: m.x + rnd(-6, 6), y: SURFACE, vx: rnd(-1.5, 1.5), vy: rnd(-3.5, -1), life: 45, max: 45, size: rnd(1.5, 3) });
    }
    if (m.under) particles.push({ kind: 'bubble', x: m.x + 2 + rnd(-2, 2), y: m.y + 14, vx: rnd(-0.3, 0.3), vy: rnd(-0.6, 0), life: 40, max: 40, size: rnd(1, 2.5) });
    else {
      particles.push({ kind: 'fire', x: m.x + 2.5, y: m.y + 15, vx: rnd(-0.3, 0.3), vy: 1, life: 12, max: 12, size: rnd(2, 4), color: '#ffb347' });
      particles.push({ kind: 'smoke', x: m.x + 2.5, y: m.y + 18, vx: rnd(-0.2, 0.2), vy: 0.2, life: 50, max: 50, size: rnd(2, 4) });
    }
    const target = enemies.find(e => !e.dead && ['boat', 'heli', 'drone'].includes(e.type) && hit(m, e));
    if (target || m.y < 22) { m.dead = true; megaBoom(m.x + 2, m.y); }
  }
  missiles = missiles.filter(m => !m.dead);
  if (whiteFlash > 0.01) whiteFlash *= 0.9; else whiteFlash = 0;

  // Pickups: coins and the double-torpedo starfish
  for (const p of pickups) {
    p.x -= scroll;
    if (hit(p, playerBox())) {
      p.dead = true;
      if (p.type === 'coin') { coins++; score += 5; save(); sfx.coin(); }
      else { player.double = 600; sfx.power(); flash = { msg: 'RECHARGE RAPIDE !', t: 90 }; }
    }
  }
  pickups = pickups.filter(p => !p.dead && p.x > -30);

  if (dist >= levelLen) { state = 'next'; nextTimer = 180; enemies = []; eShots = []; sfx.win(); }
}

// ---------- Draw ----------
let T = 0;
const GR = {}; // cached gradients
const FONT = '"Trebuchet MS", Verdana, sans-serif';
const bgFish = Array.from({ length: 5 }, (_, i) => ({ x: rnd(0, W), y: 130 + i * 50, s: rnd(0.2, 0.6), size: rnd(0.6, 1.1) }));

function shade(hex, f) { // f < 0 darker, f > 0 lighter
  const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255];
  return 'rgb(' + c.map(v => Math.round(f < 0 ? v * (1 + f) : v + (255 - v) * f)).join(',') + ')';
}
const waveY = sx => SURFACE + Math.sin((sx + camX) * 0.03 + T * 0.05) * 3;

function drawLayer(speed, color, base, a1, f1, a2, f2) {
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, H);
  for (let sx = 0; sx <= W; sx += 10) { const wx = camX * speed + sx; ctx.lineTo(sx, base - a1 * Math.sin(wx * f1) - a2 * Math.sin(wx * f2 + 2)); }
  ctx.lineTo(W, H); ctx.fill();
}

function drawWreck(x, y) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(-0.12);
  ctx.fillStyle = '#123f5c';
  ctx.beginPath(); ctx.moveTo(-90, -10); ctx.lineTo(90, -22); ctx.lineTo(70, 12); ctx.lineTo(-75, 15); ctx.fill(); // hull
  ctx.fillRect(-40, -38, 50, 20);                                   // cabin
  ctx.fillRect(25, -90, 4, 72); ctx.fillRect(5, -75, 44, 3);        // mast
  ctx.fillStyle = '#0b2e45';
  for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.arc(-55 + i * 28, -2, 4, 0, 7); ctx.fill(); }
  ctx.restore();
}

function drawSeaweed(x, y, h, c) {
  const sway = Math.sin(T * 0.03 + x * 0.1) * 10;
  ctx.strokeStyle = c; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, y);
  ctx.bezierCurveTo(x - 10, y - h * 0.33, x + 10 + sway / 2, y - h * 0.66, x + sway, y - h); ctx.stroke();
}

function drawCoral(x, y, c, s) {
  ctx.strokeStyle = c; ctx.lineCap = 'round';
  const branch = (bx, by, an, len, wdt) => {
    if (len < 4) return;
    const ex = bx + Math.cos(an) * len, ey = by + Math.sin(an) * len;
    ctx.lineWidth = wdt; ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(ex, ey); ctx.stroke();
    branch(ex, ey, an - 0.5, len * 0.7, wdt * 0.75); branch(ex, ey, an + 0.45, len * 0.65, wdt * 0.75);
  };
  branch(x, y, -Math.PI / 2, 14 * s, 5 * s);
}

function drawGround() {
  // Decorations behind the sand edge
  const step = 46, i0 = Math.floor(camX / step);
  for (let i = i0; i <= i0 + W / step + 1; i++) {
    const wx = i * step + hash(i) * 20, sx = wx - camX, gy = groundY(wx) + 4, k = hash(i * 7.3);
    if (k < 0.35) drawSeaweed(sx, gy, 30 + hash(i * 3.1) * 50, ['#2e8b57', '#3cb371', '#228b22', '#6b8e23'][i & 3]);
    else if (k < 0.55) drawCoral(sx, gy, ['#ff6f61', '#ff9ad5', '#ffb347', '#c77dff'][i & 3], 0.8 + hash(i * 2.2) * 0.6);
    else if (k < 0.62) {   // anemone
      ctx.strokeStyle = '#ff7ab8'; ctx.lineWidth = 2.5;
      for (let a = -3; a <= 3; a++) { ctx.beginPath(); ctx.moveTo(sx, gy); ctx.lineTo(sx + a * 4 + Math.sin(T * 0.05 + a) * 2, gy - 14 + Math.abs(a)); ctx.stroke(); }
    }
  }
  // Sand
  ctx.fillStyle = GR.sand; ctx.beginPath(); ctx.moveTo(0, H);
  for (let sx = 0; sx <= W; sx += 8) ctx.lineTo(sx, groundY(camX + sx));
  ctx.lineTo(W, H); ctx.fill();
  // Things lying on the sand
  for (let i = i0; i <= i0 + W / step + 1; i++) {
    const wx = i * step + hash(i) * 20, sx = wx - camX, gy = groundY(wx) + 2, k = hash(i * 7.3);
    if (k > 0.7 && k < 0.8) drawStarfish(sx, gy, 6, 0.3, '#ff7f50');
    else if (k >= 0.8 && k < 0.9) { // shell
      ctx.fillStyle = '#f7d6c4'; ctx.beginPath(); ctx.arc(sx, gy, 6, Math.PI, 0); ctx.fill();
      ctx.strokeStyle = '#d4a08a'; ctx.lineWidth = 1;
      for (let a = 1; a < 5; a++) { ctx.beginPath(); ctx.moveTo(sx, gy); ctx.lineTo(sx + Math.cos(Math.PI + a * Math.PI / 5) * 6, gy + Math.sin(Math.PI + a * Math.PI / 5) * 6); ctx.stroke(); }
    } else if (k >= 0.97) { // treasure chest
      ctx.fillStyle = '#7a4a1e'; ctx.fillRect(sx - 12, gy - 12, 24, 14);
      ctx.fillStyle = '#ffd700'; ctx.fillRect(sx - 12, gy - 8, 24, 2); ctx.fillRect(sx - 2, gy - 9, 4, 5);
    }
  }
}

function drawBackground() {
  // Sky
  // Sky + water come from the canvas CSS background (painting them here cost ~4 ms/frame)
  if (!GR.sand) {
    GR.sand = ctx.createLinearGradient(0, H - 70, 0, H);
    GR.sand.addColorStop(0, '#e6c88a'); GR.sand.addColorStop(1, '#9c7640');
  }
  ctx.fillStyle = '#fff59d'; ctx.beginPath(); ctx.arc(W - 90, 30, 18, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  for (let i = 0; i < 4; i++) {
    const cx = ((i * 260 - camX * 0.1) % (W + 200) + W + 200) % (W + 200) - 100, cy = 18 + (i % 2) * 14;
    ctx.beginPath(); ctx.arc(cx, cy, 12, 0, 7); ctx.arc(cx + 14, cy - 5, 14, 0, 7); ctx.arc(cx + 30, cy, 11, 0, 7); ctx.fill();
  }

  // Waves: only the thin band between the wave line and the cached water top
  ctx.fillStyle = '#3fb6e0'; ctx.beginPath(); ctx.moveTo(0, SURFACE + 4);
  for (let sx = 0; sx <= W; sx += 8) ctx.lineTo(sx, waveY(sx));
  ctx.lineTo(W, SURFACE + 4); ctx.fill();

  // Sun rays
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  for (let i = 0; i < 7; i++) {
    const x0 = i * 130 + Math.sin(T * 0.004 + i) * 30;
    ctx.beginPath(); ctx.moveTo(x0, SURFACE); ctx.lineTo(x0 + 40, SURFACE); ctx.lineTo(x0 + 140, H); ctx.lineTo(x0 + 60, H); ctx.fill();
  }

  // Far mountains, mid rocks with a sunken ship (parallax)
  drawLayer(0.2, '#0c3e63', H - 140, 45, 0.006, 25, 0.017);
  const wreckWx = Math.floor((camX * 0.45 + 300) / 1800) * 1800 + 900, wsx = wreckWx - camX * 0.45;
  if (wsx > -150 && wsx < W + 150) drawWreck(wsx, H - 100);
  drawLayer(0.45, '#0e507a', H - 85, 28, 0.009, 14, 0.023);

  // Fish schools far away
  ctx.fillStyle = 'rgba(5,30,60,0.35)';
  for (const f of bgFish) {
    for (let k = 0; k < 4; k++) {
      ctx.save(); ctx.translate(f.x + k * 14, f.y + (k % 2) * 8); ctx.scale(-f.size, f.size);
      ctx.beginPath(); ctx.ellipse(0, 0, 7, 3, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(-11, -4); ctx.lineTo(-11, 4); ctx.fill();
      ctx.restore();
    }
  }
  drawGround();
}

// Attack submarine (Rubis-class look), side view facing right, fitting a 36x16 box at (x, y).
// `accent` is a small marking on the sail; `hull` is the main paint.
function drawShip(x, y, accent, dbl, scale = 1, flip = false, hull = '#1a1d21') { // Suffren-class (Barracuda) attack sub
  ctx.save();
  if (flip) { ctx.translate(x + 36 * scale, y); ctx.scale(-scale, scale); } else { ctx.translate(x, y); ctx.scale(scale, scale); }
  const dark = shade(hull, -0.5), light = shade(hull, 0.35);
  // Very long slim hull (about 9x longer than tall): the stern reaches a bit behind the 36 px box

  // X-shaped rudders: seen from the side, two swept fins angled up and down
  ctx.fillStyle = dark;
  ctx.beginPath(); ctx.moveTo(5, 10); ctx.lineTo(1, 7.4); ctx.lineTo(0, 7.8); ctx.lineTo(1.5, 10.6); ctx.fill();    // upper fins
  ctx.beginPath(); ctx.moveTo(5, 12.6); ctx.lineTo(1, 15.2); ctx.lineTo(0, 14.8); ctx.lineTo(1.5, 12); ctx.fill();   // lower fins

  // Sail: set well forward, with a curved fillet blending into the hull, no sail planes
  ctx.fillStyle = '#555c63'; ctx.fillRect(26, 2.6, 0.6, 2.6); ctx.fillRect(24.8, 3.4, 0.45, 1.8); ctx.fillRect(23.8, 4, 0.45, 1.2); // masts
  const sg = ctx.createLinearGradient(0, 5, 0, 9.4);
  sg.addColorStop(0, light); sg.addColorStop(1, hull);
  ctx.fillStyle = sg;
  ctx.beginPath();
  ctx.moveTo(21, 9.4); ctx.quadraticCurveTo(22.8, 9, 23, 7);       // rear edge, swept
  ctx.lineTo(23.2, 5.6); ctx.quadraticCurveTo(23.4, 5, 24, 5);
  ctx.lineTo(27.3, 5); ctx.quadraticCurveTo(27.8, 5, 27.85, 5.6);
  ctx.lineTo(28, 8); ctx.quadraticCurveTo(28.3, 9.1, 30.5, 9.4); // vertical leading edge + fillet
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(23.9, 5.4, 3.6, 0.3);                               // bridge edge
  ctx.fillStyle = accent; ctx.fillRect(24.4, 6.8, 2.2, 0.8);                                                  // marking

  // Pressure hull: long cylinder, round bow, long tapering stern cone
  const g = ctx.createLinearGradient(0, 9, 0, 13.6);
  g.addColorStop(0, light); g.addColorStop(0.25, hull); g.addColorStop(1, dark);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-1, 10.6);
  ctx.bezierCurveTo(5, 9.6, 9, 9, 15, 9);
  ctx.lineTo(33, 9);
  ctx.bezierCurveTo(36.4, 9, 36.4, 13.6, 33, 13.6);
  ctx.lineTo(15, 13.6);
  ctx.bezierCurveTo(9, 13.6, 5, 13, -1, 12);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 0.3;                                           // anechoic tile seams
  ctx.beginPath(); ctx.moveTo(12, 9.6); ctx.lineTo(33, 9.6);
  for (const sx of [12, 18, 31]) { ctx.moveTo(sx, 9.2); ctx.lineTo(sx, 13.4); }
  ctx.stroke();
  ctx.fillStyle = dark; ctx.fillRect(33, 12, 2, 0.5);                                                         // retractable bow plane
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(15, 12.6, 14, 0.4);                                        // flank sonar array

  // Bow torpedo tubes glow when double torpedo is active
  if (dbl) { ctx.fillStyle = T % 20 < 10 ? '#ffd23f' : '#ff8c1a'; ctx.beginPath(); ctx.arc(34.6, 10.5, 0.7, 0, 7); ctx.arc(34.6, 12.2, 0.7, 0, 7); ctx.fill(); }

  // Pump-jet: shrouded duct instead of a bare propeller, with a faint spinning glint inside
  ctx.fillStyle = shade(hull, -0.3);
  ctx.beginPath(); ctx.moveTo(-0.6, 10.4); ctx.lineTo(-3.6, 10.6); ctx.lineTo(-3.6, 12); ctx.lineTo(-0.6, 12.2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(150,160,170,' + (0.25 + 0.25 * Math.abs(Math.sin(T * 0.4))) + ')'; ctx.fillRect(-3.9, 10.8, 0.5, 1);
  ctx.restore();
}

function drawCIWS(x, y, k, a) { // Phalanx CIWS popping out of the deck: white radar dome over a gatling gun
  // (x, y) = hatch on the hull top, k = 0..1 raised, a = aim angle in the sub's frame (upper half)
  ctx.save();
  ctx.beginPath(); ctx.rect(x - 30, y - 60, 60, 60.5); ctx.clip(); // hidden inside the hull while it rises
  const py = y + 12 - 16 * k; // pivot
  ctx.fillStyle = '#7d858d'; ctx.fillRect(x - 3, py, 6, y + 1 - py); // pedestal
  ctx.fillStyle = '#5f666d'; ctx.fillRect(x - 3, py + 2, 6, 0.8);
  ctx.translate(x, py);
  const face = Math.cos(a) < 0 ? -1 : 1; ctx.scale(face, 1); ctx.rotate(Math.atan2(Math.sin(a), Math.abs(Math.cos(a))));
  ctx.fillStyle = '#9aa2a9'; ctx.fillRect(-6.5, -1, 4, 5);          // ammo drum behind
  ctx.fillStyle = '#c9ced3'; ctx.fillRect(-3, -2, 9, 5);            // gun cradle
  ctx.fillStyle = '#2e3236'; ctx.fillRect(6, -0.2, 10, 2.4);        // six barrels in a cluster
  ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(6, 0.3, 10, 0.4);
  ctx.fillStyle = '#4a4f55'; ctx.fillRect(14.5, -0.7, 2.5, 3.4); ctx.fillRect(9.5, -0.5, 1, 3);  // barrel clamps
  if (!GR.ciws) {
    GR.ciws = ctx.createLinearGradient(-4.6, 0, 4.6, 0);
    GR.ciws.addColorStop(0, '#c5cbd0'); GR.ciws.addColorStop(0.4, '#ffffff'); GR.ciws.addColorStop(1, '#a9b0b6');
  }
  ctx.fillStyle = GR.ciws;                                          // radar dome: a cylinder with a round top
  ctx.fillRect(-4.6, -6.5, 9.2, 4.6);
  ctx.beginPath(); ctx.ellipse(0, -6.5, 4.6, 5, 0, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#8d959c'; ctx.fillRect(-4.6, -2.4, 9.2, 0.6);
  ctx.fillStyle = '#30353a'; ctx.fillRect(3.2, -5, 1.6, 2.2);       // tracking radar window
  ctx.restore();
}

function drawTorpedo(t, enemy) { // heavyweight torpedo: ogive nose, cylinder, tail cone, cross fins, pump-jet
  const L = t.w, R = t.h / 2, cx = t.x + L / 2, tail = -L / 2, cone = tail + L * 0.2, nose = L / 2, ogive = nose - R * 1.6;
  ctx.save(); ctx.translate(cx, t.y + R);
  if (t.a) ctx.rotate(t.a);
  if (enemy) ctx.scale(-1, 1); // drawn nose toward +x, enemy ones point left
  const k = (enemy ? 'torpE' : 'torpP') + t.h; // gradient in local space, so it can be cached
  if (!GR[k]) {
    GR[k] = ctx.createLinearGradient(0, -R, 0, R);
    const c = enemy ? ['#b4bac0', '#6b7178', '#2f3337'] : ['#4a5058', '#1c1f23', '#07080a'];
    GR[k].addColorStop(0, c[0]); GR[k].addColorStop(0.45, c[1]); GR[k].addColorStop(1, c[2]);
  }
  ctx.fillStyle = enemy ? '#4a4f55' : '#0b0c0e'; // top and bottom fins, swept back
  for (const sy of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(cone, sy * R * 0.7); ctx.lineTo(tail + 1.6, sy * (R + 1.2)); ctx.lineTo(tail + 0.3, sy * (R + 1.2)); ctx.lineTo(tail + 0.3, sy * R * 0.4); ctx.fill();
  }
  ctx.fillStyle = GR[k]; // body
  ctx.beginPath(); ctx.moveTo(tail + 0.4, -R * 0.45); ctx.lineTo(cone, -R); ctx.lineTo(ogive, -R);
  ctx.quadraticCurveTo(nose, -R, nose, 0); ctx.quadraticCurveTo(nose, R, ogive, R);
  ctx.lineTo(cone, R); ctx.lineTo(tail + 0.4, R * 0.45); ctx.fill();
  const head = nose - L * 0.24; // warhead section
  if (enemy) {
    ctx.fillStyle = '#c62828';
    ctx.beginPath(); ctx.moveTo(head, -R); ctx.lineTo(ogive, -R); ctx.quadraticCurveTo(nose, -R, nose, 0); ctx.quadraticCurveTo(nose, R, ogive, R); ctx.lineTo(head, R); ctx.fill();
    ctx.fillStyle = '#ffd23f'; ctx.fillRect(head - 1, -R, 0.7, R * 2);               // hazard band
  }
  ctx.fillStyle = enemy ? 'rgba(0,0,0,0.4)' : 'rgba(150,165,180,0.18)'; // section joints
  ctx.fillRect(head, -R, 0.4, R * 2); ctx.fillRect(cone + L * 0.22, -R, 0.4, R * 2);
  ctx.fillStyle = enemy ? 'rgba(255,255,255,0.35)' : 'rgba(150,165,180,0.22)'; ctx.fillRect(cone, -R * 0.7, ogive - cone, R * 0.28); // shine
  ctx.fillStyle = enemy ? '#2a2d31' : '#050506'; ctx.fillRect(tail - 1.2, -R * 0.6, 1.6, R * 1.2); // pump-jet duct
  ctx.fillStyle = 'rgba(200,210,220,0.45)'; ctx.fillRect(tail - 1, Math.sin(T * 0.9 + cx) * R * 0.45 - 0.25, 1.2, 0.5); // spinning rotor
  ctx.restore();
}
function drawDecoy(d) { // small yellow sonar lure with a blinking light
  ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(Math.sin(T * 0.1 + d.vy) * 0.3);
  ctx.fillStyle = '#ffb300'; ctx.fillRect(-5, -2.5, 10, 5);
  ctx.fillStyle = '#5a3d00'; ctx.fillRect(-5, -2.5, 2, 5); ctx.fillRect(3, -2.5, 2, 5);
  ctx.fillStyle = T % 20 < 10 ? '#fff' : '#ffe08a'; ctx.beginPath(); ctx.arc(0, -3.5, 1.5, 0, 7); ctx.fill();
  ctx.restore();
}
function drawCharge(s) { // depth charge barrel
  ctx.save(); ctx.translate(s.x + 5, s.y + 7); ctx.rotate(Math.sin(s.y * 0.05) * 0.3);
  ctx.fillStyle = '#3a3a3a'; ctx.fillRect(-5, -7, 10, 14);
  ctx.fillStyle = '#ffd23f'; ctx.fillRect(-5, -4, 10, 2); ctx.fillRect(-5, 2, 10, 2);
  ctx.fillStyle = s.fuse ? (T % 4 < 2 ? '#fff' : '#f33') : T % 16 < 8 ? '#f33' : '#600'; ctx.fillRect(-1.5, -9, 3, 2); // fast white blink = about to blow
  ctx.restore();
}

function drawMine(e) {
  const cx = e.x + 10, cy = e.y + 10, gy = groundY(camX + cx);
  ctx.strokeStyle = '#555'; ctx.lineWidth = 1.5; ctx.setLineDash([3, 2]);
  ctx.beginPath(); ctx.moveTo(cx, cy + 9); ctx.lineTo(cx, gy); ctx.stroke(); ctx.setLineDash([]); // chain
  ctx.fillStyle = '#333';
  for (let i = 0; i < 8; i++) {
    const an = i * Math.PI / 4;
    ctx.beginPath(); ctx.arc(cx + Math.cos(an) * 11, cy + Math.sin(an) * 11, 2.5, 0, 7); ctx.fill();
  }
  const g = ctx.createRadialGradient(cx - 3, cy - 3, 1, cx, cy, 10);
  g.addColorStop(0, '#999'); g.addColorStop(1, '#1a1a1a');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, 10, 0, 7); ctx.fill();
  ctx.fillStyle = e.fuse ? (T % 4 < 2 ? '#fff' : '#f33') : T % 30 < 15 ? '#f33' : '#600'; ctx.beginPath(); ctx.arc(cx, cy, e.fuse ? 3.5 : 2.5, 0, 7); ctx.fill();
  if (e.burn) { // heated by the laser: glows redder until it blows
    ctx.fillStyle = 'rgba(255,' + (60 + 140 * e.burn / MINE_BURN | 0) + ',0,' + (0.15 + 0.6 * e.burn / MINE_BURN) + ')';
    ctx.beginPath(); ctx.arc(cx, cy, 10, 0, 7); ctx.fill();
  }
}

function drawOcto(e) {
  const cx = e.x + 17, cy = e.y + 12, color = '#b04ad8';
  ctx.strokeStyle = color; ctx.lineWidth = 4; ctx.lineCap = 'round';
  for (let i = 0; i < 5; i++) { // tentacles trailing behind while swimming left
    const ly = cy + 2 + i * 3, w = Math.sin(e.t * 4 + i) * 5;
    ctx.beginPath(); ctx.moveTo(cx + 4, ly); ctx.quadraticCurveTo(cx + 16, ly + w, cx + 24, ly - w + 4); ctx.stroke();
  }
  const g = ctx.createRadialGradient(cx - 4, cy - 5, 1, cx, cy, 14);
  g.addColorStop(0, '#e2a6ff'); g.addColorStop(1, color);
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(cx, cy, 13, 11, -0.3, 0, 7); ctx.fill();
  ctx.fillStyle = '#7a2a9a'; ctx.beginPath(); ctx.arc(cx - 2, cy - 7, 1.8, 0, 7); ctx.arc(cx + 6, cy - 4, 1.4, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx - 6, cy, 3.5, 0, 7); ctx.arc(cx + 1, cy + 1, 3.5, 0, 7); ctx.fill();
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(cx - 7, cy + 0.5, 1.8, 0, 7); ctx.arc(cx, cy + 1.5, 1.8, 0, 7); ctx.fill();
}

function drawEel(e) { // electric eel, head on the left, glowing spots along its side
  const n = 18, x0 = e.x + 8, len = 66, cy = e.y + 8, ph = e.t * 7;
  const px = i => x0 + i / n * len, py = i => cy + Math.sin(ph - i / n * 5) * (1 + i / n * 4), wd = i => 11 * (1 - i / n * 0.75);
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#a08a50'; ctx.lineWidth = 2; ctx.beginPath(); // long belly fin
  for (let i = 2; i <= n; i++) ctx[i === 2 ? 'moveTo' : 'lineTo'](px(i), py(i) + wd(i) / 2 + 1 + Math.sin(ph * 2 + i) * 0.8);
  ctx.stroke();
  for (let i = 0; i < n; i++) { // tapering body
    ctx.strokeStyle = e.spent ? '#3a3824' : '#4e4b2c'; ctx.lineWidth = wd(i);
    ctx.beginPath(); ctx.moveTo(px(i), py(i)); ctx.lineTo(px(i + 1), py(i + 1)); ctx.stroke();
    ctx.strokeStyle = '#8c7f45'; ctx.lineWidth = wd(i) * 0.35;                       // lighter belly
    ctx.beginPath(); ctx.moveTo(px(i), py(i) + wd(i) * 0.25); ctx.lineTo(px(i + 1), py(i + 1) + wd(i + 1) * 0.25); ctx.stroke();
  }
  const a0 = ctx.globalAlpha;
  ctx.globalAlpha *= e.spent ? 0.15 : e.near ? 0.6 + 0.4 * Math.sin(T * 0.8) : 0.45 + 0.35 * Math.sin(T * 0.15);
  ctx.fillStyle = '#ffe14a';
  for (let i = 3; i < n; i += 2) { ctx.beginPath(); ctx.arc(px(i), py(i) - 1, 1.3, 0, 7); ctx.fill(); }
  ctx.globalAlpha = a0;
  const hx = px(0), hy = py(0);
  ctx.fillStyle = e.spent ? '#3a3824' : '#4e4b2c'; ctx.beginPath(); ctx.ellipse(hx - 2, hy, 8, 5.5, 0, 0, 7); ctx.fill(); // head
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(hx - 5, hy - 2, 1.6, 0, 7); ctx.fill();
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(hx - 5.4, hy - 2, 0.8, 0, 7); ctx.fill();
  ctx.strokeStyle = '#2a2818'; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.moveTo(hx - 9.5, hy + 1); ctx.lineTo(hx - 4, hy + 2); ctx.stroke(); // mouth
  if (e.near && !e.dead && Math.random() < 0.5) { // charged up next to the sub
    const i = Math.floor(rnd(2, n)); ctx.strokeStyle = '#aef'; ctx.lineWidth = 1;
    bolt(px(i), py(i), px(i) + rnd(-12, 12), py(i) + rnd(-14, 14));
  }
}

function drawDiver(e) { // combat swimmer in a black wetsuit with a bomb on the back, head on the left
  const cx = e.x + 22, cy = e.y + 11, kick = Math.sin(e.t * (e.air ? 2 : 12)) * 3;
  ctx.save(); ctx.translate(cx, cy);
  ctx.rotate(e.air ? (e.vy < 0 ? 0.6 : 1.3) * -e.face : Math.max(-0.5, Math.min(0.5, e.vy * 0.4 * e.face))); ctx.scale(e.face > 0 ? -1.5 : 1.5, 1.5);
  ctx.lineCap = 'round'; ctx.strokeStyle = '#15171a'; ctx.lineWidth = 3.2;
  ctx.beginPath(); ctx.moveTo(4, -0.5); ctx.lineTo(12, -1 + kick); ctx.moveTo(4, 0.8); ctx.lineTo(12, 1.5 - kick); ctx.stroke(); // legs
  ctx.fillStyle = '#ffd23f'; // fins
  for (const k of [-1 + kick, 1.5 - kick]) { ctx.beginPath(); ctx.moveTo(11, k); ctx.lineTo(18, k - 2.5); ctx.lineTo(18, k + 2.5); ctx.fill(); }
  ctx.fillStyle = '#15171a'; ctx.beginPath(); ctx.ellipse(-1, 0, 7.5, 3.6, 0, 0, 7); ctx.fill(); // body
  ctx.lineWidth = 2.2; ctx.beginPath(); ctx.moveTo(-5, 1.5); ctx.lineTo(-13, 3 + kick * 0.3); ctx.stroke(); // arm
  ctx.beginPath(); ctx.arc(-10, -1, 3.4, 0, 7); ctx.fill(); // hooded head
  ctx.fillStyle = '#ffd23f'; ctx.fillRect(-14, -3, 3.4, 3); ctx.fillStyle = '#8fd8ff'; ctx.fillRect(-13.6, -2.6, 2.6, 2.2); // mask
  if (e.bomb) {
    ctx.fillStyle = '#4a525a'; ctx.beginPath(); ctx.ellipse(0, -5.5, 6, 2.6, 0, 0, 7); ctx.fill(); // bomb tank
    ctx.fillStyle = '#c62828'; ctx.fillRect(-1.5, -8, 1.6, 5);
    const on = e.fuse ? T % 4 < 2 : T % 30 < 15;
    ctx.fillStyle = on ? (e.fuse ? '#fff' : '#ff2a2a') : '#5a0d0d'; ctx.beginPath(); ctx.arc(3, -8.5, e.fuse ? 2 : 1.3, 0, 7); ctx.fill();
  }
  ctx.restore();
}

function drawBeluga(e) { // white whale with a bomb strapped on its back
  const cx = e.x + 25, cy = e.y + 15, wag = Math.sin(e.t * 7) * 0.35;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.max(-0.4, Math.min(0.4, e.vy * 0.35 * e.face))); if (e.face > 0) ctx.scale(-1, 1);
  const g = ctx.createLinearGradient(0, -12, 0, 12);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.6, '#e4f1f5'); g.addColorStop(1, '#a9c6d1');
  ctx.fillStyle = g;
  ctx.save(); ctx.translate(24, 0); ctx.rotate(wag); // tail + flukes
  ctx.beginPath(); ctx.moveTo(-10, -6); ctx.lineTo(2, -1.5); ctx.lineTo(2, 1.5); ctx.lineTo(-10, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(4, -4, 5.5, 2.3, -0.6, 0, 7); ctx.ellipse(4, 4, 5.5, 2.3, 0.6, 0, 7); ctx.fill();
  ctx.restore();
  ctx.beginPath(); ctx.ellipse(1, 1, 22, 10, 0, 0, 7); ctx.fill();      // body
  ctx.beginPath(); ctx.ellipse(-16, -1, 10, 8.5, 0, 0, 7); ctx.fill();  // round melon head
  ctx.fillStyle = '#c3dae2'; ctx.beginPath(); ctx.ellipse(-7, 8, 5, 2, 0.5 + Math.sin(e.t * 7) * 0.2, 0, 7); ctx.fill(); // flipper
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(-17, -1, 1.5, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-17.5, -1.6, 0.5, 0, 7); ctx.fill();
  ctx.strokeStyle = '#7d9aa5'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(-21, 1, 4, 0.3, 1.5); ctx.stroke(); // smile
  ctx.fillStyle = 'rgba(255,170,190,0.6)'; ctx.beginPath(); ctx.arc(-14, 3, 1.8, 0, 7); ctx.fill(); // cheek
  if (e.bomb) {
    ctx.strokeStyle = '#5b3a1e'; ctx.lineWidth = 2.5; // harness
    ctx.beginPath(); ctx.ellipse(0, 1, 3, 10.5, 0, 0, 7); ctx.stroke();
    const bg = ctx.createRadialGradient(-2, -16, 1, 0, -13, 8);
    bg.addColorStop(0, '#6b7682'); bg.addColorStop(1, '#0d0f12');
    ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(0, -13, 7, 0, 7); ctx.fill();
    ctx.fillStyle = '#2a2f35'; for (let i = 0; i < 5; i++) { const a = -Math.PI + i * Math.PI / 4; ctx.fillRect(Math.cos(a) * 7 - 1, -13 + Math.sin(a) * 7 - 1, 2, 2); } // spikes
    const on = e.fuse ? T % 4 < 2 : T % 40 < 20;
    ctx.fillStyle = on ? (e.fuse ? '#fff' : '#ff2a2a') : '#5a0d0d';
    ctx.beginPath(); ctx.arc(0, -20, e.fuse ? 2.4 : 1.6, 0, 7); ctx.fill();
  }
  ctx.restore();
}

function drawBoat(e) { // stealth frigate (Naval Group FDI) facing left
  const x = e.x, y = e.y;
  ctx.fillStyle = '#9aa2a9'; // hull with inverted bow
  ctx.beginPath(); ctx.moveTo(x + 8, y + 15); ctx.lineTo(x + 110, y + 15); ctx.lineTo(x + 110, y + 29); ctx.lineTo(x + 104, y + 34); ctx.lineTo(x + 5, y + 34); ctx.lineTo(x, y + 30); ctx.fill();
  ctx.fillStyle = '#7d858c'; ctx.beginPath(); ctx.moveTo(x + 2, y + 24); ctx.lineTo(x + 110, y + 24); ctx.lineTo(x + 110, y + 29); ctx.lineTo(x + 104, y + 34); ctx.lineTo(x + 5, y + 34); ctx.lineTo(x, y + 30); ctx.fill(); // shaded lower hull
  ctx.fillStyle = '#3a3f45'; ctx.fillRect(x + 2, y + 30, 106, 4);                  // boot topping
  ctx.fillStyle = '#c3c9ce'; ctx.fillRect(x + 8, y + 15, 102, 1.5);                // deck edge
  ctx.fillStyle = '#2b3036'; ctx.fillRect(x + 46, y + 18, 7, 3); ctx.fillRect(x + 58, y + 18, 7, 3); // boat bays
  ctx.fillStyle = '#b3bac0'; // superstructure, angled faces
  ctx.beginPath(); ctx.moveTo(x + 20, y + 15); ctx.lineTo(x + 26, y + 5); ctx.lineTo(x + 66, y + 5); ctx.lineTo(x + 74, y + 9); ctx.lineTo(x + 74, y + 15); ctx.fill();
  ctx.fillStyle = '#23282d'; ctx.fillRect(x + 26, y + 7, 11, 2);                    // bridge windows
  ctx.fillStyle = '#a3abb1'; // integrated pyramid mast
  ctx.beginPath(); ctx.moveTo(x + 30, y + 5); ctx.lineTo(x + 37, y - 18); ctx.lineTo(x + 41, y - 18); ctx.lineTo(x + 48, y + 5); ctx.fill();
  ctx.fillStyle = '#4a525a'; ctx.fillRect(x + 36, y - 6, 6, 6);                     // Sea Fire radar panel
  ctx.fillStyle = '#5c646c'; ctx.fillRect(x + 37.5, y - 14, 3, 3);
  ctx.fillStyle = '#333'; ctx.fillRect(x + 38.4, y - 33, 1.2, 15);                 // needle mast
  ctx.fillRect(x + 35, y - 27, 8, 1); ctx.fillRect(x + 36, y - 23, 6, 1);           // yards
  ctx.beginPath(); ctx.moveTo(x + 39, y - 32); ctx.lineTo(x + 48, y - 29); ctx.lineTo(x + 39, y - 26); ctx.fill(); // flag
  ctx.fillStyle = '#d5dade'; ctx.beginPath(); ctx.arc(x + 54, y + 2, 3.5, 0, 7); ctx.fill(); // radome
  ctx.fillStyle = '#5c646c'; ctx.fillRect(x + 59, y, 5, 5);                         // exhaust
  ctx.fillStyle = '#6b7380'; for (let i = 0; i < 4; i++) ctx.fillRect(x + 65 + i * 2.2, y + 9, 1.5, 6); // missile canisters
  ctx.fillStyle = '#a9b0b6'; ctx.fillRect(x + 74, y + 8, 10, 7);                    // hangar
  ctx.fillStyle = '#7d858c'; ctx.fillRect(x + 83, y + 9, 1, 6);
  ctx.fillStyle = '#eceff1'; ctx.fillRect(x + 86, y + 14, 22, 1);                   // helipad marking
  const a = e.gunA || 0.2; // 76 mm gun, barrel follows the aim
  ctx.save(); ctx.translate(x + 14, y + 13); ctx.rotate(-a);
  ctx.fillStyle = '#333'; ctx.fillRect(-10, -0.6, 10, 1.2); ctx.restore();
  ctx.fillStyle = '#8e969d'; ctx.beginPath(); ctx.arc(x + 14, y + 15, 3.6, Math.PI, 0); ctx.fill();
}

function drawShell(s) { // gun shell, nose first
  ctx.save(); ctx.translate(s.x + 3, s.y + 1.5); ctx.rotate(Math.atan2(s.vy, s.vx));
  ctx.fillStyle = '#2b2b2b'; ctx.beginPath(); ctx.ellipse(0, 0, 4, 1.6, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#d4a017'; ctx.fillRect(-4, -1.4, 2, 2.8);                         // brass base
  ctx.restore();
}

function drawHeli(e) { // military helicopter facing left
  const x = e.x, y = e.y;
  ctx.fillStyle = '#4b5320';
  ctx.fillRect(x + 30, y + 10, 28, 4);                                              // tail boom
  ctx.beginPath(); ctx.moveTo(x + 56, y + 12); ctx.lineTo(x + 62, y + 3); ctx.lineTo(x + 62, y + 14); ctx.fill(); // tail fin
  ctx.fillStyle = '#ccc'; ctx.beginPath(); ctx.ellipse(x + 60, y + 6, 1, 5 * Math.abs(Math.sin(T * 0.6)) + 1, 0, 0, 7); ctx.fill(); // tail rotor
  const g = ctx.createLinearGradient(0, y + 4, 0, y + 22);
  g.addColorStop(0, '#6b7a3a'); g.addColorStop(1, '#2f3515');
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(x + 20, y + 13, 18, 8, 0, 0, 7); ctx.fill(); // body
  ctx.fillStyle = '#8fd3ff'; ctx.beginPath(); ctx.ellipse(x + 9, y + 11, 7, 5, -0.2, Math.PI * 0.9, Math.PI * 1.9); ctx.fill(); // cockpit
  ctx.strokeStyle = '#222'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x + 8, y + 24); ctx.lineTo(x + 34, y + 24); ctx.moveTo(x + 14, y + 20); ctx.lineTo(x + 13, y + 24); ctx.moveTo(x + 28, y + 20); ctx.lineTo(x + 29, y + 24); ctx.stroke(); // skids
  ctx.fillStyle = '#333'; ctx.fillRect(x + 19, y + 1, 3, 4);                       // rotor mast
  const span = e.parked ? 26 : 30 * Math.abs(Math.cos(T * 0.5)) + 6;                               // spinning main rotor
  ctx.fillStyle = 'rgba(40,40,40,0.8)'; ctx.fillRect(x + 20.5 - span, y, span * 2, 1.6);
}

function drawDrone(e) { // quadcopter
  const x = e.x, y = e.y;
  if (!e.dead && e.beam > 0) drawLaser({ x1: x + 12, y1: y + 12, x2: e.lx, y2: e.ly, hit: e.beamHit });
  else if (!e.dead && e.aim > 0 && T % 6 < 4) { // aiming line
    ctx.strokeStyle = e.aim < DRONE_LOCK ? 'rgba(255,40,40,0.8)' : 'rgba(255,60,60,0.4)'; ctx.lineWidth = 0.7;
    ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(x + 12, y + 12); ctx.lineTo(e.tx, e.ty); ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x + 4, y + 4); ctx.lineTo(x + 28, y + 4); ctx.stroke();       // arms
  ctx.fillStyle = 'rgba(60,60,60,0.7)';
  for (const rx of [x + 4, x + 28]) { ctx.beginPath(); ctx.ellipse(rx, y + 2, 7 * Math.abs(Math.sin(T * 0.8 + rx)) + 2, 1.2, 0, 0, 7); ctx.fill(); } // rotors
  const g = ctx.createLinearGradient(0, y + 3, 0, y + 12);
  g.addColorStop(0, '#b0b8c0'); g.addColorStop(1, '#5a6470');
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(x + 16, y + 7, 9, 4.5, 0, 0, 7); ctx.fill(); // body
  ctx.fillStyle = !e.dead && (e.aim > 0 || e.beam > 0) ? '#f33' : '#222'; ctx.beginPath(); ctx.arc(x + 12, y + 11, 2.2, 0, 7); ctx.fill(); // laser eye
  ctx.fillStyle = T % 20 < 10 ? '#f33' : '#600'; ctx.beginPath(); ctx.arc(x + 20, y + 4, 1.3, 0, 7); ctx.fill();
}

function drawHBomb(m) {
  ctx.fillStyle = '#c62828'; ctx.beginPath(); ctx.moveTo(m.x, m.y + 4); ctx.lineTo(m.x + 2.5, m.y - 2); ctx.lineTo(m.x + 5, m.y + 4); ctx.fill(); // nose
  const g = ctx.createLinearGradient(m.x, 0, m.x + 5, 0);
  g.addColorStop(0, '#999'); g.addColorStop(0.5, '#fff'); g.addColorStop(1, '#888');
  ctx.fillStyle = g; ctx.fillRect(m.x, m.y + 4, 5, 10);
  ctx.fillStyle = '#ffd23f'; ctx.fillRect(m.x, m.y + 7, 5, 1.5);                  // hazard band
  ctx.fillStyle = '#555';
  ctx.beginPath(); ctx.moveTo(m.x, m.y + 10); ctx.lineTo(m.x - 3, m.y + 15); ctx.lineTo(m.x, m.y + 14); ctx.fill();
  ctx.beginPath(); ctx.moveTo(m.x + 5, m.y + 10); ctx.lineTo(m.x + 8, m.y + 15); ctx.lineTo(m.x + 5, m.y + 14); ctx.fill();
}

function drawRock(e) {
  const g = ctx.createLinearGradient(e.x, 0, e.x + e.w, 0);
  g.addColorStop(0, '#6d6875'); g.addColorStop(0.5, '#8e8a96'); g.addColorStop(1, '#4a4652');
  ctx.fillStyle = g;
  const n = Math.ceil(e.h / 22);
  for (let i = 0; i < n; i++) { // stacked boulders
    const by = e.y + e.h - i * 22 - 10, bw = e.w / 2 - i * 0.6;
    ctx.beginPath(); ctx.ellipse(e.x + e.w / 2 + (i % 2 ? 3 : -3), by, bw, 14, 0, 0, 7); ctx.fill();
  }
  drawCoral(e.x + e.w / 2, e.y + 6, '#ff6f61', 0.7);
  ctx.fillStyle = 'rgba(80,160,80,0.6)'; ctx.beginPath(); ctx.ellipse(e.x + e.w / 2 - 6, e.y + 10, 8, 4, 0, 0, 7); ctx.fill(); // moss
}

function drawMark(x, y, m, metal) {
  ctx.fillStyle = metal ? 'rgba(25,18,12,0.85)' : 'rgba(60,0,60,0.55)';            // scorch / bruise
  ctx.beginPath(); ctx.arc(x, y, m.r, 0, 7); ctx.fill();
  if (!metal) return;
  ctx.strokeStyle = 'rgba(10,10,10,0.9)'; ctx.lineWidth = 0.8;                      // cracks
  ctx.beginPath();
  for (const an of m.cracks) { ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(an) * m.r * 1.8, y + Math.sin(an) * m.r * 1.8); }
  ctx.stroke();
  ctx.fillStyle = (T + m.seed) % 10 < 5 ? '#ff8c1a' : '#ffd23f';                     // glowing hole
  ctx.beginPath(); ctx.arc(x, y, 1.4, 0, 7); ctx.fill();
}

function drawEnemy(e, extraRot = 0) {
  const n = e.marks ? e.marks.length : 0;
  const tilt = n * (e.type === 'sub' ? -0.07 : e.type === 'boat' ? 0.06 : 0) + extraRot; // damaged: nose down / listing
  ctx.save();
  if (tilt) { const cx = e.x + e.w / 2, cy = e.y + e.h / 2; ctx.translate(cx, cy); ctx.rotate(tilt); ctx.translate(-cx, -cy); }
  if (e.flash) ctx.globalAlpha *= 0.45; // hit flash
  if (e.type === 'mine') drawMine(e);
  else if (e.type === 'octo') drawOcto(e);
  else if (e.type === 'sub') drawShip(e.x, e.y - 4, '#c62828', false, 3, true, '#6b7682');
  else if (e.type === 'boat') drawBoat(e);
  else if (e.type === 'heli') drawHeli(e);
  else if (e.type === 'drone') drawDrone(e);
  else if (e.type === 'beluga') drawBeluga(e);
  else if (e.type === 'diver') drawDiver(e);
  else if (e.type === 'eel') drawEel(e);
  else drawRock(e);
  for (let i = 0; i < n; i++) drawMark(e.x + e.marks[i].dx, e.y + e.marks[i].dy, e.marks[i], e.type !== 'octo' && e.type !== 'eel');
  ctx.restore();
}

function drawStarfish(cx, cy, R, rot, color) {
  ctx.fillStyle = color; ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? R * 0.45 : R, an = rot + i * Math.PI / 5 - Math.PI / 2;
    ctx.lineTo(cx + Math.cos(an) * r, cy + Math.sin(an) * r);
  }
  ctx.fill();
}

function drawCoin(x, y, spin = 1) {
  const g = ctx.createRadialGradient(x - 2, y - 2, 1, x, y, 7);
  g.addColorStop(0, '#fff6b0'); g.addColorStop(0.5, '#ffd700'); g.addColorStop(1, '#b8860b');
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(x, y, 7 * Math.max(0.15, Math.abs(spin)), 7, 0, 0, Math.PI * 2); ctx.fill();
  if (Math.abs(spin) > 0.5) { ctx.fillStyle = '#b8860b'; ctx.fillRect(x - 1, y - 4, 2, 8); }
}

function drawHeart(x, y) {
  ctx.fillStyle = '#ff4d6d'; ctx.beginPath();
  ctx.arc(x - 3, y, 3.5, Math.PI, 0); ctx.arc(x + 3, y, 3.5, Math.PI, 0); ctx.lineTo(x, y + 8); ctx.closePath(); ctx.fill();
}

function drawParticles() {
  for (const p of particles) {
    const a = p.life / p.max;
    if (p.kind === 'fire') {
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.4 + a * 0.6), 0, 7); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    } else if (p.kind === 'freed') {
      ctx.globalAlpha = Math.min(1, p.life / 40); p.e.type === 'beluga' ? drawBeluga(p.e) : drawDiver(p.e);
    } else if (p.kind === 'wreck') {
      ctx.globalAlpha = Math.min(1, p.life / 40); drawEnemy(p.e, p.rot);
    } else if (p.kind === 'flash') {
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a; ctx.fillStyle = '#fff6c8';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1 + (1 - a) * 1.5), 0, 7); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    } else if (p.kind === 'spark') {
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a; ctx.strokeStyle = '#ffe08a'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 3, p.y - p.vy * 3); ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    } else if (p.kind === 'debris') {
      ctx.globalAlpha = Math.min(1, a * 2); ctx.fillStyle = p.color;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore();
    } else if (p.kind === 'smoke') {
      ctx.globalAlpha = a * 0.5; ctx.fillStyle = p.color || '#5c6670';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (2 - a), 0, 7); ctx.fill();
    } else if (p.kind === 'ring') {
      ctx.globalAlpha = a; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, (1 - a) * (p.r || 60), 0, 7); ctx.stroke();
    } else if (p.kind === 'drop') {
      ctx.globalAlpha = a; ctx.fillStyle = '#d8f3ff';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7); ctx.fill();
    } else {
      ctx.globalAlpha = a * 0.8; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
}

function panel(x, y, w, h, border) {
  ctx.fillStyle = 'rgba(0,25,50,0.65)'; ctx.fillRect(x, y, w, h);
  if (border) { ctx.strokeStyle = border; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h); }
}

function text(str, y, size = 20, color = '#fff', x = W / 2, align = 'center') {
  ctx.font = `bold ${size}px ${FONT}`; ctx.textAlign = align;
  ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillText(str, x + 1, y + 2); // cheap drop shadow
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}

function drawShop() {
  panel(0, 0, W, H);
  text('BOUTIQUE', 45, 34, '#ffd700');
  drawCoin(W / 2 - 50, 70); text('   ' + coins + ' pieces', 76, 18, '#ffd700');
  SHIPS.forEach((s, i) => {
    const y = 95 + i * 58, sel = i === shopCursor;
    panel(120, y, W - 240, 50, sel ? '#fff' : 'rgba(255,255,255,0.2)');
    drawShip(140, y + 17, s.color, s.double, 1.2);
    ctx.textAlign = 'left'; ctx.font = 'bold 20px ' + FONT; ctx.fillStyle = s.color;
    ctx.fillText(s.name, 200, y + 23);
    ctx.font = '14px ' + FONT; ctx.fillStyle = '#cde';
    ctx.fillText(s.desc, 200, y + 41);
    ctx.textAlign = 'right'; ctx.font = 'bold 18px ' + FONT;
    if (i === shipIdx) { ctx.fillStyle = '#7f7'; ctx.fillText('EQUIPE', W - 135, y + 31); }
    else if (owned.includes(i)) { ctx.fillStyle = '#fff'; ctx.fillText('ACHETE', W - 135, y + 31); }
    else { ctx.fillStyle = coins >= s.price ? '#ffd700' : '#f66'; ctx.fillText(s.price + ' pieces', W - 135, y + 31); }
  });
  text(shopMsg, 405, 18, '#7ff');
  text('Haut/Bas: choisir   ENTREE: acheter/equiper   ECHAP: retour', 435, 14, '#fff');
}

function shopSelect() {
  const s = SHIPS[shopCursor];
  if (owned.includes(shopCursor)) { shipIdx = shopCursor; shopMsg = s.name + ' equipe !'; sfx.power(); }
  else if (coins >= s.price) { coins -= s.price; owned.push(shopCursor); shipIdx = shopCursor; shopMsg = 'Tu as achete ' + s.name + ' !'; sfx.win(); }
  else { shopMsg = 'Pas assez de pieces ! Il en manque ' + (s.price - coins); tone(150, 0.3, 'square', 0.1); }
  save();
}

function drawLaser(l) {
  const j = () => rnd(-1.2, 1.2), mx = (l.x1 + l.x2) / 2 + j(), my = (l.y1 + l.y2) / 2 + j(); // flickering, slightly electric
  ctx.lineCap = 'round';
  for (const [w, col] of [[7, 'rgba(255,0,0,0.25)'], [3, '#ff2020'], [1, '#ffe0e0']]) {
    ctx.strokeStyle = col; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(l.x1, l.y1); ctx.lineTo(mx, my); ctx.lineTo(l.x2, l.y2); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(255,80,80,0.5)'; ctx.beginPath(); ctx.arc(l.x1, l.y1, 3 + Math.random() * 2, 0, 7); ctx.fill();
  if (l.hit) { ctx.fillStyle = 'rgba(255,220,220,0.8)'; ctx.beginPath(); ctx.arc(l.x2, l.y2, 4 + Math.random() * 3, 0, 7); ctx.fill(); }
}

function draw() {
  const sh = shake > 0.5 ? shake : 0;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); // reveals the CSS sky/water
  ctx.setTransform(SCALE, 0, 0, SCALE, rnd(-sh, sh) * SCALE, rnd(-sh, sh) * SCALE);
  drawBackground();

  if (state === 'title') {
    panel(W / 2 - 230, 60, 460, 330);
    text('BATAILLE SOUS LA MER', 115, 40, '#ffd700');
    drawShip(W / 2 - 160, 150, ship().color, ship().double, 2);
    drawMine({ x: W / 2 + 10, y: 145 }); drawOcto({ x: W / 2 + 60, y: 140, t: T * 0.04 });
    drawShip(W / 2 + 110, 150, '#c62828', false, 1.5, true, '#6b7682');
    text('← ↑ → ↓ nager   ESPACE torpille   F laser   D leurres   S bombe H', 230, 16);
    text('En surface: ESPACE = canon anti-aerien (helicos, drones)', 252, 14, '#bff');
    text('ENTREE pour jouer', 280, 24, '#7f7');
    text('S pour la BOUTIQUE', 310, 18, '#7ff');
    drawCoin(W / 2 - 45, 340); text('   ' + coins + ' pieces', 346, 18, '#ffd700');
    return;
  }
  if (state === 'shop') { drawShop(); return; }

  // Coins and starfish
  for (const p of pickups) {
    if (p.type === 'coin') drawCoin(p.x + 7, p.y + 7, Math.cos(T * 0.1 + p.x * 0.05));
    else { drawStarfish(p.x + 10, p.y + 10, 12, T * 0.05, T % 30 < 15 ? '#ffb347' : '#ff7f50'); text('x2', p.y + 14, 10, '#fff', p.x + 10); }
  }
  for (const e of enemies) drawEnemy(e); // not forEach: it would pass the index as the rotation
  eShots.forEach(s => s.type === 'torp' ? drawTorpedo(s, true) : s.type === 'shell' ? drawShell(s) : drawCharge(s));
  decoys.forEach(d => { ctx.globalAlpha = Math.min(1, d.life / 40); drawDecoy(d); ctx.globalAlpha = 1; });
  torps.forEach(t => drawTorpedo(t, false));
  missiles.forEach(drawHBomb);
  if (laser) drawLaser(laser);

  // Player sub tilts with its movement, blinks when hurt
  if (player.inv % 10 < 5) {
    ctx.save(); ctx.translate(player.x + 46, player.y + 24); ctx.rotate(player.vy * 0.1); ctx.translate(-player.x - 46, -player.y - 24);
    if (player.ciws > 0) drawCIWS(player.x + 80.6, player.y + 23.4, player.ciws, player.ciwsA - player.vy * 0.1); // drawn first: it rises out of the hull
    drawShip(player.x, player.y, ship().color, hasDouble(), 2.6);
    if (player.ciws > 0) { ctx.fillStyle = '#050607'; ctx.fillRect(player.x + 74, player.y + 23.2, 13, 1); } // open hatch
    ctx.restore();
  }
  if (bullets.length) { // CIWS tracers
    ctx.strokeStyle = '#ffe680'; ctx.lineWidth = 1.2; ctx.beginPath();
    for (const b of bullets) { ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * 0.9, b.y - b.vy * 0.9); }
    ctx.stroke();
  }
  const tg = player.ciwsT;
  if (player.ciws === 1 && tg && !tg.dead) { // radar lock brackets
    ctx.strokeStyle = T % 20 < 10 ? '#7CFC00' : '#c8ffb0'; ctx.lineWidth = 1;
    ctx.strokeRect(tg.x - 4, tg.y - 4, tg.w + 8, tg.h + 8);
  }
  if (player.jam > 0 && (player.jam > JAM_TIME - 60 || T % 30 < 3)) { // electric arcs over the shocked hull
    ctx.strokeStyle = '#aef'; ctx.lineWidth = 1.2;
    for (let i = 0; i < 3; i++) bolt(player.x + rnd(6, 90), player.y + rnd(12, 36), player.x + rnd(6, 90), player.y + rnd(12, 36));
  }
  for (let i = 0; i < allies; i++) { const a = allyBox(i); drawShip(a.x, a.y, ship().color, false, 1.6, false, '#3a4048'); }
  drawParticles();

  // HUD
  text('SCORE ' + score, 22, 16, '#fff', 10, 'left');
  drawCoin(16, 38); text(coins, 44, 16, '#ffd700', 28, 'left');
  if (lives <= 10) for (let i = 0; i < lives; i++) drawHeart(W - 15 - i * 16, 12);
  else { drawHeart(W - 45, 12); text('x' + lives, 22, 16, '#ff8a8a', W - 10, 'right'); } // many lives: compact
  text('S', 66, 13, '#fff', 10, 'left');
  for (let i = 0; i < 8; i++) {
    ctx.globalAlpha = (i < hbombs ? 1 : 0.25) * (player.jam ? 0.4 : 1);
    drawHBomb({ x: 25 + i * 10, y: 56 });
    ctx.globalAlpha = 1;
  }
  text('D', 84, 13, '#fff', 10, 'left');
  ctx.globalAlpha = decoyCool ? 0.35 : 1; drawDecoy({ x: 30, y: 80, vy: 0 }); drawDecoy({ x: 38, y: 82, vy: 1 }); ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(48, 77, 40, 5); // reload bar
  ctx.fillStyle = decoyCool ? '#ffb300' : '#7CFC00'; ctx.fillRect(48, 77, 40 * (1 - decoyCool / DECOY_COOL), 5);
  text('prochain allie: ' + (10 - kills % 10), 44, 12, '#fff', W - 10, 'right');
  // Level progress bar
  const bx = W / 2 - 120, prog = Math.min(1, dist / levelLen);
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(bx, 10, 240, 8);
  ctx.fillStyle = '#7f7'; ctx.fillRect(bx, 10, 240 * prog, 8);
  drawShip(bx + 240 * prog - 10, 7, ship().color, false, 0.55);
  ctx.fillStyle = '#7a4a1e'; ctx.fillRect(bx + 244, 8, 12, 10); ctx.fillStyle = '#ffd700'; ctx.fillRect(bx + 244, 11, 12, 2);
  text('NIVEAU ' + level, 36, 14, '#bff');
  if (player.jam > 0) text('ARMES EN PANNE  ' + Math.ceil(player.jam / 60) + 's', 74, 14, T % 30 < 15 ? '#7df9ff' : '#fff');
  if (player.double > 0 && !ship().double) text('RECHARGE x2  ' + Math.ceil(player.double / 60) + 's', 54, 14, '#ffd700');
  if (whiteFlash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + whiteFlash + ')'; ctx.fillRect(-20, -20, W + 40, H + 40); }
  if (flash) text(flash.msg, H / 2 - 40, 28, flash.t % 20 < 10 ? '#ffd700' : '#fff');

  if (state === 'over') { panel(0, H / 2 - 45, W, 100); text('PERDU ! niveau ' + level, H / 2, 40, '#ff6b6b'); text('ENTREE pour rejouer    S: boutique', H / 2 + 38, 18); }
  if (state === 'next') { panel(0, H / 2 - 45, W, 100); text('NIVEAU ' + level + ' TERMINE !', H / 2, 40, '#7f7'); text('Attention, le prochain est plus dur...', H / 2 + 38, 18, '#ffd700'); }
}

// Game logic runs at a fixed 60 steps/second; drawing happens once per screen frame.
// So the game keeps the same speed on 30/60/120 Hz screens and when a frame is slow.
const STEP = 1000 / 60;
let lastTime = 0, acc = 0;
function loop(now) {
  acc += Math.min(100, now - (lastTime || now)); lastTime = now;
  let n = 0;
  while (acc >= STEP && n++ < 5) { update(); acc -= STEP; }
  draw();
  requestAnimationFrame(loop);
}

// Action keys by physical position (e.code), so they sit under the left hand on AZERTY and QWERTY alike:
// S bomb, D decoys, F laser, SPACE torpedo; the arrows stay for the right hand
addEventListener('keydown', e => {
  keys[e.code] = true;
  if ([' ', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) e.preventDefault();
  initAudio();
  if (state === 'shop') {
    if (e.key === 'ArrowUp') shopCursor = (shopCursor + SHIPS.length - 1) % SHIPS.length;
    if (e.key === 'ArrowDown') shopCursor = (shopCursor + 1) % SHIPS.length;
    if (e.key === 'Enter') shopSelect();
    if (e.key === 'Escape' || e.code === 'KeyS') state = 'title';
    return;
  }
  if (state === 'play' && player.jam && !e.repeat && ['Space', 'KeyF', 'KeyS'].includes(e.code)) sfx.denied();
  if (e.code === 'KeyS' && state === 'play') { if (!e.repeat) fireHBomb(); return; }
  if (e.code === 'KeyD' && state === 'play') { if (!e.repeat) throwDecoys(); return; }
  if (e.code === 'KeyS' && (state === 'title' || state === 'over')) { state = 'shop'; shopCursor = shipIdx; shopMsg = ''; return; }
  if (e.key === 'Enter' && (state === 'title' || state === 'over')) { reset(); state = 'play'; }
});
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('blur', () => { for (const k in keys) keys[k] = false; }); // no stuck keys after alt-tab

requestAnimationFrame(loop);
</script>
