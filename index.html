<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Bataille sous la mer</title>
<style>
  html, body { margin: 0; height: 100%; background: #021428; display: flex; align-items: center; justify-content: center; }
  /* Sky + water gradient lives in CSS (drawn by the GPU for free); the canvas is transparent on top.
     Sky ends at y=74/450 (16.4%), water goes from #3fb6e0 to #062a4f. */
  canvas { background: linear-gradient(to bottom, #6ec6ff 0%, #d8f3ff 16.4%, #3fb6e0 16.45%, #0f6aa0 49.8%, #062a4f 100%); border: 3px solid #e6c88a; border-radius: 8px; width: min(96vw, calc(94vh * 16 / 9)); height: auto; }
</style>
</head>
<body>
<canvas id="c" width="1600" height="900"></canvas>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const SCALE = 2; // render at 2x for crisp graphics
const W = cv.width / SCALE, H = cv.height / SCALE;
const SURFACE = 70; // y of the sea surface
const keys = {};

// ---------- Audio ----------
// Everything goes through master -> compressor (loud explosions don't clip). Effects also feed a
// dark generated reverb, which gives the underwater echo, and are panned by their screen x.
let ac = null, master = null, verb = null, noiseBuf = null, musicStep = 0, musicTimer = 0;
function initAudio() {
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.25;
  master = ac.createGain(); master.gain.value = 0.9; master.connect(comp).connect(ac.destination);
  verb = ac.createConvolver(); verb.buffer = reverbIR(2.2);
  const vg = ac.createGain(); vg.gain.value = 0.5; verb.connect(vg).connect(master);
}
function reverbIR(sec) { // decaying low-passed noise: a murky underwater tail
  const n = ac.sampleRate * sec | 0, b = ac.createBuffer(2, n, ac.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = b.getChannelData(c); let y = 0;
    for (let i = 0; i < n; i++) { y += 0.18 * (Math.random() * 2 - 1 - y); d[i] = y * Math.pow(1 - i / n, 2.5) * 2.5; }
  }
  return b;
}
function noiseBuffer() { // built once, reused by every noise
  if (!noiseBuf) {
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return noiseBuf;
}
function tone(freq, dur, type = 'square', vol = 0.15, slideTo = null) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur);
  o.onended = () => { o.disconnect(); g.disconnect(); };
}
function noise(dur, vol = 0.2) {
  if (!ac) return;
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), t = ac.currentTime;
  f.type = 'lowpass'; f.frequency.value = 900;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.buffer = noiseBuffer(); s.connect(f).connect(g).connect(master); s.start(t); s.stop(t + dur);
  s.onended = () => { s.disconnect(); f.disconnect(); g.disconnect(); };
}
// Output for one effect: panned by screen x, with a share (wet) sent to the reverb
function sfxOut(x, wet, life) {
  const g = ac.createGain(), send = ac.createGain(); send.gain.value = wet;
  let last = g;
  if (x != null && ac.createStereoPanner) {
    const p = ac.createStereoPanner(); p.pan.value = Math.max(-0.8, Math.min(0.8, x / W * 1.6 - 0.8));
    g.connect(p); last = p;
  }
  last.connect(master); last.connect(send).connect(verb);
  setTimeout(() => { g.disconnect(); last.disconnect(); send.disconnect(); }, life * 1000 + 300);
  return g;
}
function nz(out, t, dur, vol, type, f0, f1, q = 0.7, att = 0.004) { // filtered noise burst, filter sweeps f0 -> f1
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuffer(); s.loop = true;
  f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + att); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(g).connect(out); s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.05);
  s.onended = () => { s.disconnect(); f.disconnect(); g.disconnect(); };
}
function os(out, t, dur, type, f0, f1, vol, att = 0.004) { // oscillator with a pitch slide
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + att); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(out); o.start(t); o.stop(t + dur + 0.05);
  o.onended = () => { o.disconnect(); g.disconnect(); };
}
function bubbles(out, t, n, spread, vol) { // each bubble is a tiny upward chirp
  for (let i = 0; i < n; i++) { const f = rnd(300, 900); os(out, t + Math.random() * spread, rnd(0.03, 0.06), 'sine', f, f * rnd(2, 3), vol * rnd(0.5, 1), 0.002); }
}
const sfx = {
  shoot(x) { // torpedo tube: water-ram thump, air whoosh, bubbles, then the motor spins up
    if (!ac) return; const t = ac.currentTime, o = sfxOut(x, 0.35, 1.2);
    os(o, t, 0.2, 'sine', 95, 40, 0.4);
    nz(o, t, 0.5, 0.28, 'bandpass', 1400, 250, 0.8, 0.01);
    bubbles(o, t + 0.05, 7, 0.45, 0.06);
    os(o, t + 0.15, 0.8, 'triangle', 500, 1150, 0.035, 0.12);
  },
  boom(x, y) { // underwater: shock, deep thump, bubble-pulse second kick, fizz. In the air: crack and rumble
    if (!ac) return; const t = ac.currentTime, sea = y == null || y > SURFACE, o = sfxOut(x, sea ? 0.6 : 0.35, 2.5);
    if (sea) {
      nz(o, t, 0.9, 0.5, 'lowpass', 3500, 150, 0.7, 0.003);
      os(o, t, 0.8, 'sine', 80, 28, 0.6, 0.003);
      os(o, t + 0.22, 0.5, 'sine', 55, 24, 0.3, 0.01);
      nz(o, t + 0.22, 0.5, 0.18, 'lowpass', 600, 100);
      nz(o, t + 0.3, 1.3, 0.04, 'bandpass', 2200, 1200, 1.5, 0.15);
      bubbles(o, t + 0.3, 8, 0.9, 0.04);
    } else {
      nz(o, t, 0.1, 0.5, 'highpass', 1800, 900, 0.7, 0.002);
      nz(o, t, 1.2, 0.45, 'lowpass', 2800, 120);
      os(o, t, 1.0, 'sine', 65, 30, 0.45);
      nz(o, t + 0.1, 0.8, 0.08, 'bandpass', 3000, 2000, 2, 0.05);
    }
  },
  pop(x, y) { // small explosion
    if (!ac) return; const t = ac.currentTime, o = sfxOut(x, 0.4, 1);
    nz(o, t, 0.3, 0.25, 'lowpass', 2200, 200, 0.7, 0.003);
    os(o, t, 0.22, 'sine', 140, 50, 0.22);
    if (y == null || y > SURFACE) bubbles(o, t + 0.05, 4, 0.3, 0.04);
  },
  launch(x) { // H-bomb ejected from the sub by gas pressure
    if (!ac) return; const t = ac.currentTime, o = sfxOut(x, 0.45, 2);
    os(o, t, 0.45, 'sine', 70, 30, 0.5);
    nz(o, t, 0.7, 0.3, 'lowpass', 900, 150, 0.7, 0.01);
    bubbles(o, t + 0.05, 14, 0.9, 0.06);
  },
  ignite(x) { // rocket motor lights as it leaves the water, then roars away
    if (!ac) return; const t = ac.currentTime, o = sfxOut(x, 0.3, 2.5);
    nz(o, t, 0.25, 0.4, 'lowpass', 5000, 1500, 0.7, 0.003);
    nz(o, t, 2.2, 0.38, 'lowpass', 3500, 500, 0.6, 0.06);
    nz(o, t, 2.0, 0.12, 'bandpass', 2500, 900, 0.8, 0.05);
    os(o, t, 1.8, 'sawtooth', 70, 45, 0.05, 0.05);
  },
  mega(x, y) { // H-bomb: crack, huge rumble, rolling thunder, the sea boiling
    if (!ac) return; const t = ac.currentTime, o = sfxOut(x, 0.7, 4.5);
    nz(o, t, 0.15, 0.6, 'highpass', 2000, 800, 0.7, 0.002);
    nz(o, t, 3.2, 0.7, 'lowpass', 1600, 60, 0.7, 0.01);
    os(o, t, 2.8, 'sine', 50, 18, 0.7, 0.01);
    os(o, t, 2.0, 'triangle', 90, 30, 0.25);
    nz(o, t + 0.35, 3, 0.35, 'lowpass', 400, 70, 1, 0.4);
    nz(o, t + 0.6, 2.5, 0.06, 'bandpass', 2500, 1000, 1.5, 0.3);
  },
  impact(x, y) { // torpedo hits a hull: blast plus inharmonic metal ring
    if (!ac) return; const t = ac.currentTime, o = sfxOut(x, 0.5, 1.5);
    nz(o, t, 0.45, 0.35, 'lowpass', 3000, 250, 0.7, 0.003);
    os(o, t, 0.35, 'sine', 190, 55, 0.35);
    for (const f of [430, 1170, 1890]) os(o, t, 0.7, 'sine', f, f * 0.97, 0.05, 0.002);
  },
  gun(x) { // frigate gun: sharp crack, blast, thump
    if (!ac) return; const t = ac.currentTime, o = sfxOut(x, 0.3, 1.2);
    nz(o, t, 0.06, 0.4, 'highpass', 2500, 1200, 0.7, 0.001);
    nz(o, t, 0.5, 0.3, 'lowpass', 1800, 150);
    os(o, t, 0.35, 'sine', 110, 45, 0.3);
  },
  die(x) { // our hull groans after the hit
    if (!ac) return; const t = ac.currentTime, o = sfxOut(x, 0.5, 2);
    os(o, t, 1.1, 'sawtooth', 85, 38, 0.07, 0.05);
    os(o, t + 0.1, 0.9, 'triangle', 300, 180, 0.05, 0.05);
  },
  shock(x) { // electric eel: crackling discharge, mains hum, then the weapons power down
    if (!ac) return; const t = ac.currentTime, o = sfxOut(x, 0.3, 1.8);
    nz(o, t, 0.6, 0.35, 'highpass', 3000, 1500, 0.7, 0.002);
    os(o, t, 0.5, 'sawtooth', 60, 55, 0.12);
    os(o, t, 0.4, 'square', 120, 118, 0.05);
    os(o, t + 0.3, 0.9, 'sawtooth', 600, 40, 0.06, 0.02);
  },
  surface(x) { // blowing the ballast tanks: air roar, then water pouring off the deck
    if (!ac) return; const t = ac.currentTime, o = sfxOut(x, 0.3, 2.5);
    nz(o, t, 1.0, 0.22, 'lowpass', 1500, 300, 0.7, 0.05);
    nz(o, t + 0.3, 1.4, 0.08, 'bandpass', 2500, 1200, 0.8, 0.2);
    bubbles(o, t, 10, 0.6, 0.05);
  },
  dive(x) { // vents open: hiss and gurgle
    if (!ac) return; const t = ac.currentTime, o = sfxOut(x, 0.4, 2);
    nz(o, t, 0.8, 0.12, 'highpass', 4000, 2000, 0.7, 0.02);
    bubbles(o, t + 0.2, 12, 0.8, 0.05);
  },
  raise(x) { // CIWS mount rises: hydraulic hiss, servo whine, then it locks
    if (!ac) return; const t = ac.currentTime, o = sfxOut(x, 0.2, 1.5);
    nz(o, t, 0.6, 0.06, 'highpass', 3500, 2500, 0.7, 0.02);
    os(o, t, 0.6, 'sawtooth', 220, 440, 0.025, 0.05);
    os(o, t + 0.62, 0.08, 'square', 120, 80, 0.06);
  },
  denied: () => tone(110, 0.1, 'square', 0.06), // trigger pressed while the weapons are down
  hit: () => tone(300, 0.08, 'square', 0.08, 200),
  coin: () => { tone(988, 0.08, 'square', 0.08); setTimeout(() => tone(1319, 0.25, 'square', 0.08), 80); },
  win: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.2, 'square', 0.12), i * 150)),
  power: () => [660, 880, 1320].forEach((f, i) => setTimeout(() => tone(f, 0.12, 'square', 0.1), i * 80)),
  lose: () => [392, 330, 262, 196].forEach((f, i) => setTimeout(() => tone(f, 0.3, 'triangle', 0.2), i * 220)),
};
// Laser hum: a buzzing sawtooth chopped by a fast LFO, running while L is held
let laserSnd = null;
function laserSound(on) {
  if (!ac || on === !!laserSnd) return;
  if (on) {
    const o = ac.createOscillator(), o2 = ac.createOscillator(), lfo = ac.createOscillator(), lg = ac.createGain(), g = ac.createGain();
    o.type = 'sawtooth'; o.frequency.value = 110; o2.type = 'square'; o2.frequency.value = 1760;
    lfo.type = 'square'; lfo.frequency.value = 33; lg.gain.value = 0.04; g.gain.value = 0.05;
    lfo.connect(lg).connect(g.gain); o.connect(g); o2.connect(g); g.connect(master);
    o.start(); o2.start(); lfo.start(); laserSnd = { o, o2, lfo, lg, g };
  } else {
    const n = laserSnd, t = ac.currentTime; laserSnd = null;
    n.g.gain.cancelScheduledValues(t); n.g.gain.setValueAtTime(0.05, t); n.g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
    for (const k of ['o', 'o2', 'lfo']) { n[k].stop(t + 0.1); }
    n.o.onended = () => { for (const k in n) n[k].disconnect(); };
  }
}
// CIWS: a gatling firing 75 rounds/s. Noise chopped by a sawtooth LFO (a sharp crack per round, then it fades),
// plus a buzzing sawtooth body at the same rate. The barrels spin up when it starts and whine down when it stops
let ciwsSnd = null;
function ciwsSound(on) {
  if (!ac || on === !!ciwsSnd) return;
  const t = ac.currentTime;
  if (on) {
    const n = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), lfo = ac.createOscillator(), lg = ac.createGain();
    const o = ac.createOscillator(), of = ac.createBiquadFilter(), og = ac.createGain(), out = ac.createGain(), send = ac.createGain();
    n.buffer = noiseBuffer(); n.loop = true; f.type = 'bandpass'; f.frequency.value = 3200; f.Q.value = 0.6;
    for (const x of [lfo, o]) { x.type = 'sawtooth'; x.frequency.setValueAtTime(30, t); x.frequency.exponentialRampToValueAtTime(75, t + 0.25); }
    lg.gain.value = -0.5; g.gain.value = 0.5; // gain = 0.5 - 0.5 * saw: jumps to 1 at each round, fades to 0
    of.type = 'highpass'; of.frequency.value = 600; og.gain.value = 0.25; send.gain.value = 0.3;
    out.gain.setValueAtTime(0.0001, t); out.gain.exponentialRampToValueAtTime(0.14, t + 0.04);
    lfo.connect(lg).connect(g.gain); n.connect(f).connect(g).connect(out); o.connect(of).connect(og).connect(out);
    out.connect(master); out.connect(send).connect(verb);
    n.start(t); lfo.start(t); o.start(t); ciwsSnd = { n, f, g, lfo, lg, o, of, og, out, send };
  } else {
    const c = ciwsSnd; ciwsSnd = null;
    c.out.gain.cancelScheduledValues(t); c.out.gain.setValueAtTime(Math.max(0.0001, c.out.gain.value), t); c.out.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
    for (const k of ['n', 'lfo', 'o']) c[k].stop(t + 0.08);
    c.n.onended = () => { for (const k in c) c[k].disconnect(); };
    os(sfxOut(null, 0.2, 1), t, 0.6, 'triangle', 1400, 250, 0.03, 0.01); // barrels spin down
  }
}
// Music: a cheerful sea melody + bass, 32 steps
const MEL = [659, 0, 784, 0, 880, 0, 784, 659, 587, 0, 659, 0, 523, 0, 0, 0, 659, 0, 784, 0, 880, 0, 1047, 880, 784, 0, 659, 0, 587, 0, 0, 0];
const BASS = [131, 110, 87, 98, 131, 110, 87, 98];
function music() {
  if (--musicTimer > 0) return;
  musicTimer = 9;
  if (MEL[musicStep % 32]) tone(MEL[musicStep % 32], 0.18, 'sine', 0.07);
  if (musicStep % 4 === 0) tone(BASS[(musicStep / 4) % 8], 0.4, 'triangle', 0.18);
  musicStep++;
}

// ---------- Shop ----------
const SHIPS = [
  { name: 'Classique',    price: 0,   color: '#e8e8e8', speed: 3.5, cool: 15, lives: 5, desc: 'Le sous-marin de base' },
  { name: 'Eclair',       price: 15,  color: '#22b8e6', speed: 5.5, cool: 15, lives: 5, desc: 'Tres rapide' },
  { name: 'Mitrailleuse', price: 30,  color: '#e8452c', speed: 3.5, cool: 7,  lives: 5, desc: 'Tire tres vite' },
  { name: 'Tank',         price: 50,  color: '#7a8f3a', speed: 3,   cool: 15, lives: 9, desc: '9 vies' },
  { name: 'Super Star',   price: 100, color: '#c13cff', speed: 4.5, cool: 10, lives: 6, double: true, desc: 'Recharge rapide pour toujours !' },
];
function load(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } }
function save() { try { localStorage.setItem('si_coins', coins); localStorage.setItem('si_owned', JSON.stringify(owned)); localStorage.setItem('si_ship', shipIdx); } catch {} }
let coins = load('si_coins', 0), owned = load('si_owned', [0]), shipIdx = load('si_ship', 0), shopCursor = 0, shopMsg = '';
const ship = () => SHIPS[shipIdx];

// ---------- Game state ----------
let state = 'title', score, lives, level, player, torps, enemies, eShots, pickups, particles = [];
let bullets = [], laser = null, decoys = [], decoyCool = 0, missiles = [], hbombs = 8, airTimer = 0, whiteFlash = 0;
let camX = 0, dist, levelLen, scroll, spawnTimer, coinTimer, kills, allies, flash, nextTimer, shake = 0;
const SURF_Y = SURFACE - 25, CIWS_RANGE = 340, CIWS_HITS = 10; // surfaced: sail and hull top out of the water; rounds per hp
const LASER_RANGE = 150, LASER_BURN = 180, MINE_BURN = 45; // short range; 3 s of beam per damage point, mines pop in 0.75 s
const hasDouble = () => player.double > 0 || ship().double;
const rnd = (a, b) => a + Math.random() * (b - a);
const hash = n => { const v = Math.sin(n * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); };
const groundY = wx => H - 45 - 14 * Math.sin(wx * 0.004) - 8 * Math.sin(wx * 0.013 + 1);
function hit(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
const playerBox = () => ({ x: player.x + 4, y: player.y + 12, w: 88, h: 26 });
// Ally subs follow behind: 0 = above, 1 = below
function allyBox(i) { return { x: player.x - 64, y: i === 0 ? Math.max(SURFACE + 8, player.y - 34) : player.y + 48, w: 58, h: 26 }; } // the top one stays under water

function reset() {
  score = 0; lives = ship().lives; level = 1; kills = 0; allies = 0;
  player = { x: 80, y: H / 2, vx: 0, vy: 0, cool: 0, inv: 0, double: 0, jam: 0, up: false, ciws: 0, ciwsA: -0.9 };
  startLevel();
}

// Each level: longer, faster scrolling, more enemies that shoot more
function startLevel() {
  dist = 0; levelLen = 3000 + level * 900;
  scroll = Math.min(2, 0.8 + (level - 1) * 0.15);
  torps = []; bullets = []; enemies = []; eShots = []; pickups = []; particles = [];
  spawnTimer = 120; coinTimer = 60; airTimer = 400;
  missiles = []; hbombs = 8; // super weapon refilled every level
  decoys = []; decoyCool = 0;
  flash = { msg: 'NIVEAU ' + level, t: 120 };
  belugaLeft = level * 2 - 1; belugaGap = (levelLen - 1000) / belugaLeft; nextBeluga = 300 + belugaGap * 0.4;
  enemies.push({ type: 'boat', x: W + 40, y: SURFACE - 24, w: 110, h: 40, hp: 3, pts: 40, fire: 120, gun: 150, gunA: 0.2 }); // a frigate opens every level
}

function boom(x, y, big = true) {
  const n = big ? 26 : 10, colors = ['#fff7a8', '#ffd23f', '#ff8c1a', '#ff4500'];
  for (let i = 0; i < n; i++) {
    const an = Math.random() * Math.PI * 2, sp = rnd(1, big ? 6 : 3);
    particles.push({ kind: 'fire', x, y, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp, life: 35, max: 35, size: rnd(3, big ? 8 : 4), color: colors[i % 4] });
  }
  for (let i = 0; i < (big ? 6 : 2); i++)
    particles.push({ kind: 'smoke', x: x + rnd(-10, 10), y: y + rnd(-10, 10), vx: rnd(-0.5, 0.5), vy: rnd(-1, -0.3), life: 60, max: 60, size: rnd(6, 12) });
  for (let i = 0; i < (big ? 12 : 4); i++)
    particles.push({ kind: 'bubble', x: x + rnd(-15, 15), y: y + rnd(-15, 15), vx: rnd(-0.5, 0.5), vy: rnd(-2, -0.5), life: 70, max: 70, size: rnd(1.5, 4) });
  if (big) { particles.push({ kind: 'ring', x, y, life: 25, max: 25 }); shake = 10; sfx.boom(x, y); }
  else sfx.pop(x, y);
}

// Torpedo impact: flash, sparks, fire, metal debris, smoke and bubbles
function impact(x, y, e) {
  particles.push({ kind: 'flash', x, y, life: 10, max: 10, size: 10 });
  particles.push({ kind: 'ring', x, y, life: 15, max: 15, r: 30 });
  const fire = ['#fff7a8', '#ffd23f', '#ff8c1a', '#ff4500'];
  for (let i = 0; i < 14; i++) {
    const an = Math.random() * Math.PI * 2, sp = rnd(0.5, 3.5);
    particles.push({ kind: 'fire', x, y, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp, life: 28, max: 28, size: rnd(2, 6), color: fire[i % 4] });
  }
  for (let i = 0; i < 8; i++) {
    const an = Math.random() * Math.PI * 2, sp = rnd(3, 6);
    particles.push({ kind: 'spark', x, y, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp, life: 14, max: 14 });
  }
  const bits = e.type === 'octo' ? ['#7a2a9a', '#b04ad8'] : e.type === 'eel' ? ['#4e4b2c', '#8c7f45', '#ffe14a'] : e.type === 'beluga' || e.type === 'diver' ? ['#3a3f45', '#222', '#555'] : ['#3a3f45', '#6b7682', '#222', e.type === 'boat' ? '#c62828' : '#555'];
  for (let i = 0; i < 6; i++) // pieces fly away from the torpedo, then sink
    particles.push({ kind: 'debris', x, y, vx: rnd(-1, 2.5), vy: rnd(-2, 1), life: 80, max: 80, size: rnd(2, 4.5), rot: rnd(0, 6), spin: rnd(-0.3, 0.3), color: bits[i % bits.length] });
  for (let i = 0; i < 3; i++)
    particles.push({ kind: 'smoke', x: x + rnd(-5, 5), y: y + rnd(-5, 5), vx: rnd(-0.3, 0.3), vy: rnd(-0.6, -0.2), life: 60, max: 60, size: rnd(4, 8), color: '#3d4247' });
  for (let i = 0; i < 8; i++)
    particles.push({ kind: 'bubble', x: x + rnd(-10, 10), y: y + rnd(-10, 10), vx: rnd(-0.5, 0.5), vy: rnd(-1.5, -0.4), life: 60, max: 60, size: rnd(1.5, 3.5) });
  shake = Math.max(shake, 4); sfx.impact(x, y);
}

// Each hit leaves a visible scorch / hole / crack on the enemy
function addMark(e, hx) {
  if (e.type === 'beluga' || e.type === 'diver') return; // living things don't burn
  const ry = { sub: [20, 36], boat: [20, 31], octo: [4, 20] }[e.type] || [e.h * 0.3, e.h * 0.7];
  (e.marks ||= []).push({
    dx: Math.max(5, Math.min(e.w - 5, hx - e.x + rnd(0, e.w * 0.45))), dy: rnd(ry[0], ry[1]),
    r: rnd(3.5, 6), seed: Math.floor(rnd(0, 10)), cracks: [rnd(0, 6.3), rnd(0, 6.3), rnd(0, 6.3)],
  });
}

// H-bomb blast: destroys every boat, helicopter and drone nearby
const BLAST = 120;
function megaBoom(x, y) {
  const colors = ['#ffffff', '#fff7a8', '#ffd23f', '#ff8c1a', '#ff4500'];
  for (let i = 0; i < 70; i++) {
    const an = Math.random() * Math.PI * 2, sp = rnd(1, 9);
    particles.push({ kind: 'fire', x, y, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp, life: 50, max: 50, size: rnd(5, 14), color: colors[i % 5] });
  }
  for (let i = 0; i < 14; i++)
    particles.push({ kind: 'smoke', x: x + rnd(-30, 30), y: y + rnd(-30, 30), vx: rnd(-0.6, 0.6), vy: rnd(-0.8, -0.1), life: 110, max: 110, size: rnd(12, 22) });
  particles.push({ kind: 'ring', x, y, life: 35, max: 35, r: BLAST * 1.3 });
  particles.push({ kind: 'ring', x, y, life: 25, max: 25, r: BLAST * 0.7 });
  shake = 20; whiteFlash = 0.8; sfx.mega(x, y);
  for (const e of enemies)
    if (!e.dead && ['boat', 'heli', 'drone'].includes(e.type) && Math.hypot(e.x + e.w / 2 - x, e.y + e.h / 2 - y) < BLAST + e.w / 2) killEnemy(e);
  for (const sh of eShots) if (Math.hypot(sh.x - x, sh.y - y) < BLAST) sh.dead = true;
}

// Decoys (D): a pair of noisy sonar lures, one thrown up and one down. Belugas, enemy torpedoes,
// mines and depth charges go for the nearest decoy instead of the sub and blow up on it.
const DECOY_RANGE = 400, DECOY_LIFE = 360, DECOY_COOL = 300; // px, steps (6 s), steps (5 s): unlimited, reload time
function throwDecoys() {
  if (decoyCool > 0) return;
  decoyCool = DECOY_COOL;
  for (const dir of [-1, 1]) decoys.push({ x: player.x + 40, y: player.y + 22, vx: -0.8, vy: dir * 4, life: DECOY_LIFE });
  tone(1800, 0.12, 'sine', 0.08); setTimeout(() => tone(1800, 0.12, 'sine', 0.08), 120);
}
function decoyNear(x, y, range = DECOY_RANGE) { // nearest live decoy within range, or null
  let best = null, bd = range;
  for (const d of decoys) { const dd = Math.hypot(d.x - x, d.y - y); if (d.life > 0 && dd < bd) { bd = dd; best = d; } }
  return best;
}
function popDecoy(d) { d.life = 0; boom(d.x, d.y, false); }

function fireHBomb() {

function spawnAir() {

// Kamikaze belugas: 1 in level 1, 3 in level 2, 5 in level 3... spread evenly over the level
let belugaLeft = 0, belugaGap = 0, nextBeluga = 0;
function spawnBeluga() {

// Combat swimmers: jump from boats / fall from helicopters with a bomb on their back, then hunt like the beluga
function spawnDiver(x, y, svx, vy) {

// Electric eel: touching the sub shocks it, the weapons (torpedoes, laser, H-bomb) are down for 10 s.
// Decoys still work. Each eel discharges once, then dives away.
const JAM_TIME = 600;
function shockPlayer(e) {
  e.spent = true; player.jam = JAM_TIME; shake = Math.max(shake, 6);

  }
}
function bolt(x1, y1, x2, y2) { // zigzag lightning line
  ctx.beginPath(); ctx.moveTo(x1, y1);
  for (let i = 1; i < 5; i++) ctx.lineTo(x1 + (x2 - x1) * i / 5 + rnd(-3, 3), y1 + (y2 - y1) * i / 5 + rnd(-3, 3));
  ctx.lineTo(x2, y2); ctx.stroke();
}

// Drone laser: only reaches the sub near the surface (water absorbs it past DRONE_DEPTH).
// It aims for 1 s (thin blinking line), locks the target for the last 0.5 s (time to dodge), then fires for 1/3 s.
const DRONE_DEPTH = 100, DRONE_AIM = 60, DRONE_LOCK = 30, DRONE_BEAM = 20;
function droneLaser(e) {
  const ox = e.x + 12, oy = e.y + 12, px = player.x + 46, py = player.y + 24;
  if (e.beam > 0) {
    e.beam--;
    const dx = e.tx - ox, dy = e.ty - oy, dd = Math.hypot(dx, dy) || 1, c = dx / dd, sn = dy / dd;
    const pb = playerBox();
    let x2 = ox, y2 = oy;
    for (let d = 0; d < dd + 12; d += 3) { // a short burst: stops just past the locked point
      x2 = ox + c * d; y2 = oy + sn * d;
      if (y2 > SURFACE + DRONE_DEPTH || y2 > groundY(camX + x2) || x2 < -20 || x2 > W + 20) break;
      if (!e.beamHit && x2 > pb.x - 2 && x2 < pb.x + pb.w + 2 && y2 > pb.y - 2 && y2 < pb.y + pb.h + 2) { e.beamHit = true; damagePlayer(); }
      for (let i = allies - 1; i >= 0; i--) {
        const ab = allyBox(i);
        if (x2 > ab.x && x2 < ab.x + ab.w && y2 > ab.y && y2 < ab.y + ab.h) { allies--; boom(ab.x + 28, ab.y + 12, false); }
      }
    }
    e.lx = x2; e.ly = y2;
    if (T % 3 === 0 && sn > 0) { // steam where it enters the water
      const sx = ox + c * (SURFACE - oy) / sn;
      particles.push({ kind: 'smoke', x: sx, y: SURFACE - 2, vx: rnd(-0.3, 0.3), vy: -0.5, life: 30, max: 30, size: 3 });
    }
    if (e.beam === 0) e.fire = Math.max(150, 270 - level * 15) * rnd(0.8, 1.2);
  } else if (e.aim > 0) {
    e.aim--;
    if (e.aim >= DRONE_LOCK) { e.tx = px; e.ty = py; }                              // tracks, then locks: the sub can dodge
    if (e.aim % 10 === 0) tone(1400, 0.05, 'square', 0.04);
    if (e.aim === 0) { e.beam = DRONE_BEAM; e.beamHit = false; tone(1800, 0.35, 'sawtooth', 0.08, 500); }
  } else if (e.fire > 0) e.fire--;
  else if (player.y < SURFACE + 70 && Math.abs(px - ox) < 260 && e.x > 0 && e.x < W - 40) e.aim = DRONE_AIM; // sub near the surface
}

// Proximity fuse: mines and depth charges arm when the sub comes close, beep fast, then blow up
const FUSE_RANGE = 38, FUSE_TIME = 24, MINE_BLAST = 55; // px, steps (0.4 s), px
function distToPlayer(x, y) { const b = playerBox(); return Math.hypot(Math.max(b.x - x, 0, x - b.x - b.w), Math.max(b.y - y, 0, y - b.y - b.h)); }
function proximityFuse(o, x, y) { // returns true when it explodes
  const lure = decoyNear(x, y); // fooled by a decoy: only the decoy sets it off
  if (!o.fuse) { if (lure ? Math.hypot(lure.x - x, lure.y - y) < FUSE_RANGE : distToPlayer(x, y) < FUSE_RANGE) { o.fuse = FUSE_TIME; tone(1200, 0.06, 'square', 0.1); } return false; }
  if (--o.fuse % 6 === 0) tone(1600, 0.05, 'square', 0.1); // arming beeps
  if (o.fuse > 0) return false;
  o.dead = true; boom(x, y);
  particles.push({ kind: 'ring', x, y, life: 20, max: 20, r: MINE_BLAST });
  shake = Math.max(shake, 8);
  if (distToPlayer(x, y) < MINE_BLAST) damagePlayer();
  if (o.type === 'beluga' || o.type === 'diver') freeSwimmer(o);
  for (const d of decoys) if (d.life > 0 && Math.hypot(d.x - x, d.y - y) < MINE_BLAST) d.life = 0;
  for (let i = allies - 1; i >= 0; i--) { const a = allyBox(i); if (Math.hypot(a.x + a.w / 2 - x, a.y + a.h / 2 - y) < MINE_BLAST) { allies--; boom(a.x + 28, a.y + 12, false); } }
  return true;
}

function freeSwimmer(e) { // the bomb is gone: the beluga / swimmer swims away safe (kids' game: nobody dies)
  particles.push({ kind: 'freed', e: { ...e, bomb: false, fuse: 0, flash: 0 }, life: 200, max: 200 });
}

// Homing swimmers (beluga, diver): steer toward the nearest decoy, else the sub; give up when life runs out.
// Sets e.svx / e.vy (screen speed); returns false once it has given up.
function steer(e, speed, turn) {
  const ox = e.w / 2, oy = e.h / 2, lure = decoyNear(e.x + ox, e.y + oy);
  const gx = lure ? lure.x : player.x + 46, gy = lure ? lure.y : player.y + 24;
  const leave = --e.life <= 0, dx = gx - (e.x + ox), dy = gy - (e.y + oy), d = Math.hypot(dx, dy) || 1;
  const sx = leave ? -speed * 1.76 : dx / d * speed, sy = leave ? 0 : dy / d * speed;
  const k = lure ? turn * 2.8 : turn; // a lure pulls it hard
  e.svx = (e.svx || 0) + (sx - (e.svx || 0)) * k; e.vy += (sy - e.vy) * k;
  return !leave;
}
function swim(e) { // apply the steering: vx is used with the scroll on the next step; stay in the water
  e.vx = -scroll - e.svx; e.y += e.vy;
  e.y = Math.max(SURFACE + 8, Math.min(groundY(camX + e.x + e.w / 2) - e.h - 4, e.y));
  if (Math.abs(e.svx) > 0.15) e.face = Math.sign(e.svx);
}

function damagePlayer() {
  if (player.inv > 0) return;
  lives--; player.inv = 150; boom(player.x + 46, player.y + 24); sfx.die(player.x + 46);
  if (lives <= 0) { state = 'over'; sfx.lose(); }
}

function killEnemy(e) {
  e.dead = true; boom(e.x + e.w / 2, e.y + e.h / 2);
  if (['sub', 'boat', 'heli', 'drone'].includes(e.type)) { // burning wreck sinks (or falls into the sea)
    const w = { ...e, flash: 0, marks: [...(e.marks || [])] };
    for (let i = 0; i < 3; i++) addMark(w, w.x + rnd(0, w.w * 0.5));
    particles.push({ kind: 'wreck', e: w, x: 0, y: 0, vy: 0.1, rot: 0, spin: rnd(0.004, 0.01) * (Math.random() < 0.5 ? -1 : 1), air: e.type === 'heli' || e.type === 'drone', life: 220, max: 220 });
  }
  if (e.type === 'beluga' || e.type === 'diver') { // bomb destroyed: big blast, the swimmer is free
    const bx = e.x + e.w / 2, by = e.y + 2;
    particles.push({ kind: 'ring', x: bx, y: by, life: 20, max: 20, r: MINE_BLAST }); shake = Math.max(shake, 8);
    if (distToPlayer(bx, by) < MINE_BLAST) damagePlayer();
    freeSwimmer(e);
  }
  if (e.type === 'octo') for (let i = 0; i < 10; i++) // ink cloud
    particles.push({ kind: 'smoke', x: e.x + 17 + rnd(-12, 12), y: e.y + 12 + rnd(-12, 12), vx: rnd(-0.4, 0.4), vy: rnd(-0.3, 0.3), life: 90, max: 90, size: rnd(6, 12), color: '#2a0f3a' });
  score += e.pts * level; coins++; save();
  if (Math.random() < 0.15) pickups.push({ type: 'star', x: e.x + e.w / 2 - 10, y: e.y + e.h / 2 - 10, w: 20, h: 20 });
  // Every 10 kills: a new ally sub (max 2), then extra lives
  if (++kills % 10 === 0) {
    if (allies < 2) { allies++; flash = { msg: 'NOUVEAU SOUS-MARIN ALLIE !', t: 120 }; }
    else { lives++; flash = { msg: '+1 VIE !', t: 120 }; }
    sfx.win();
  }
}

// Destroyed vehicles: tilt and sink to the bottom, trailing bubbles and smoke
function updateWreck(p) {
  const e = p.e;
  if (state === 'play') e.x -= scroll;
  if (p.air && e.y < SURFACE) p.vy = Math.min(3, p.vy + 0.12);   // falling from the sky
  else p.vy = Math.min(0.7, p.vy + 0.015);                       // sinking slowly
  if (p.air && !p.splashed && e.y + e.h / 2 > SURFACE) {
    p.splashed = true; p.vy = 0.5;
    for (let i = 0; i < 20; i++) particles.push({ kind: 'drop', x: e.x + e.w / 2 + rnd(-10, 10), y: SURFACE, vx: rnd(-1.5, 1.5), vy: rnd(-3.5, -1), life: 45, max: 45, size: rnd(1.5, 3) });
  }
  e.y += p.vy; p.rot = Math.max(-0.6, Math.min(0.6, p.rot + p.spin)); // tilts, but never flips over
  if (e.y + e.h > groundY(camX + e.x + e.w / 2)) { p.vy = 0; p.spin = 0; } // rests on the sand
  if (T % 4 === 0) {
    const m = e.marks[Math.floor(Math.random() * e.marks.length)], mx = e.x + m.dx, my = e.y + m.dy;
    if (my < SURFACE) particles.push({ kind: 'fire', x: mx, y: my, vx: rnd(-0.3, 0.3), vy: -0.8, life: 18, max: 18, size: rnd(2, 4), color: '#ff8c1a' });
    particles.push({ kind: 'smoke', x: mx, y: my, vx: rnd(-0.2, 0.2), vy: -0.4, life: 50, max: 50, size: rnd(3, 5), color: '#2b2f33' });
    particles.push({ kind: 'bubble', x: mx, y: my, vx: rnd(-0.3, 0.3), vy: -0.8, life: 50, max: 50, size: rnd(1, 3) });
  }
}

// ---------- Update ----------
function update() {
  T++;
  for (const f of bgFish) { if (state === 'play' || state === 'title') f.x -= f.s; if (f.x < -60) { f.x = W + 60; f.y = rnd(110, H - 150); } }
  if (particles.length > 500) particles.splice(0, particles.length - 500); // safety cap
  if (ac && state !== 'shop') music();
  if (ac && state === 'play' && T % 420 === 0) { tone(1500, 1.5, 'sine', 0.04); setTimeout(() => tone(1500, 1.2, 'sine', 0.015), 500); } // sonar ping + echo
  if (shake > 0) shake *= 0.85;
  particles.forEach(p => {
    p.x += p.vx || 0; p.y += p.vy || 0; p.life--;
    if (p.kind === 'fire') { p.vx *= 0.92; p.vy *= 0.92; }
    if (p.kind === 'bubble') p.vy -= 0.02;
    if (p.kind === 'drop') p.vy += 0.12;
    if (p.kind === 'spark') { p.vx *= 0.88; p.vy *= 0.88; }
    if (p.kind === 'debris') { p.vy += p.y < SURFACE ? 0.15 : 0.03; p.vx *= 0.97; p.rot += p.spin; }
    if (p.kind === 'wreck') updateWreck(p);
    if (p.kind === 'freed' && p.e.type === 'beluga') { p.e.vx += (1.6 - p.e.vx) * 0.03; p.e.x += p.e.vx; p.e.y -= 0.25; p.e.vy = -1; p.e.face = 1; p.e.t += 0.03; }
    if (p.kind === 'freed' && p.e.type === 'diver') { p.e.face = 1; p.e.t += 0.03; p.e.vy = p.e.y > SURFACE + 4 ? -1.5 : 0; p.e.y += p.e.vy * 0.5; p.e.x += 0.8; } // swims up and away
  });
  particles = particles.filter(p => p.life > 0);
  if (state === 'title') { camX += 0.4; return; }
  if (state === 'next' && --nextTimer <= 0) { level++; startLevel(); state = 'play'; }
  if (state !== 'play') { laserSound(false); ciwsSound(false); return; }

  camX += scroll; dist += scroll;
  if (flash && --flash.t <= 0) flash = null;

  // Player: free swimming in 4 directions
  const sp = ship().speed * 0.5;
  const tx = (keys.ArrowRight ? sp : 0) - (keys.ArrowLeft ? sp : 0);
  const ty = (keys.ArrowDown ? sp : 0) - (keys.ArrowUp ? sp : 0);
  player.vx += (tx - player.vx) * 0.05; player.vy += (ty - player.vy) * 0.05; // heavy sub: inertia
  player.x = Math.max(10, Math.min(W * 0.65, player.x + player.vx));
  player.y = Math.max(SURF_Y, Math.min(groundY(camX + player.x + 46) - 40, player.y + player.vy));
  if (player.y <= SURF_Y) player.vy = Math.max(0, player.vy); // floats flat on the surface
  const up = player.y < SURFACE - 16; // surfaced: the CIWS can come out
  if (up !== player.up) { player.up = up; up ? sfx.surface(player.x + 46) : sfx.dive(player.x + 46); }
  const k0 = player.ciws;
  player.ciws = up ? Math.min(1, k0 + 1 / 40) : Math.max(0, k0 - 1 / 25);
  if (k0 === 0 && player.ciws > 0) sfx.raise(player.x + 80);
  if (k0 < 1 && player.ciws === 1 && !flash) flash = { msg: 'CANON ANTI-AERIEN PRET !', t: 70 };
  if (up && T % 3 === 0) particles.push({ kind: 'drop', x: player.x + 92 + rnd(-4, 4), y: SURFACE - 1, vx: rnd(0.2, 1.2), vy: rnd(-1.6, -0.5), life: 20, max: 20, size: rnd(1, 2) }); // bow wave
  if (tx || ty) { // propeller wash: bubbles behind the stern while the player drives the sub
    const a = player.vy * 0.1, c = Math.cos(a), sn = Math.sin(a);
    const px = player.x + 46 - 56 * c - 5.4 * sn, py = player.y + 24 - 56 * sn + 5.4 * c; // pump-jet at the stern
    particles.push({ kind: 'bubble', x: px + rnd(-3, 1), y: py + rnd(-5, 5), vx: -c * rnd(0.6, 1.4) - scroll * 0.3, vy: -sn * 0.8 + rnd(-0.5, 0.1), life: 45, max: 45, size: rnd(1.5, 4) });
  }
  if (player.cool > 0) player.cool--;
  if (player.inv > 0) player.inv--;
